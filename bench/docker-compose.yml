# Benchmark / parity stack: one Postgres, the official Hasura V2 engine and
# (optionally, `--profile rust`) our Rust engine, both serving the same
# project in ./project. Each engine gets its own database so mutations and
# event-trigger bookkeeping in one cannot affect the other.
#
#   docker compose up -d --wait                 # postgres + hasura + handler
#   docker compose --profile rust up -d --wait  # ... + rust engine
#
# Engines are pinned to the same cores (ENGINE_CPUSET, default "0,1") rather
# than given a CFS quota: GHC's -N and tokio both size their thread pools
# from the visible CPUs, so pinning keeps the comparison even.
#
# Image overrides (e.g. a registry mirror when Docker Hub rate-limits):
#   HASURA_IMAGE, POSTGRES_IMAGE, PYTHON_IMAGE, RUST_ENGINE_IMAGE

x-engine-env: &engine-env
  HASURA_GRAPHQL_ADMIN_SECRET: benchsecret
  HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
  HASURA_GRAPHQL_DEV_MODE: "false"
  HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
  HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup
  HASURA_GRAPHQL_LOG_LEVEL: warn
  HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
  ACTION_BASE_URL: http://handler:3000

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  handler:
    image: ${PYTHON_IMAGE:-python:3.12-slim}
    command: ["python", "/app/server.py"]
    volumes:
      - ./handler:/app:ro
    ports: ["${HANDLER_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz')"]
      interval: 2s
      retries: 30

  hasura:
    # Community Edition build (the plain v2.51.0 tag is the EE binary).
    # cli-migrations-v3 applies ./project/migrations and ./project/metadata
    # on boot, exactly as an existing V2 project would be deployed.
    image: ${HASURA_IMAGE:-hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3}
    depends_on:
      postgres: {condition: service_healthy}
      handler: {condition: service_healthy}
    environment:
      <<: *engine-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hasura
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hasura
      HASURA_GRAPHQL_PG_CONNECTIONS: "50"
      EVENT_WEBHOOK_URL: http://handler:3000/events/hasura
    volumes:
      - ./project/migrations:/hasura-migrations:ro
      - ./project/metadata:/hasura-metadata:ro
    ports: ["${HASURA_PORT:-8080}:8080"]
    cpuset: ${ENGINE_CPUSET:-0,1}
    mem_limit: ${ENGINE_MEM:-2g}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 2s
      retries: 90

  # Same Hasura image started as plain `graphql-engine serve` against the
  # already-migrated database: isolates engine boot time from the
  # cli-migrations wrapper. Only used for startup measurements.
  hasura-serve:
    profiles: ["startup"]
    image: ${HASURA_IMAGE:-hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3}
    entrypoint: ["graphql-engine"]
    command: ["serve"]
    environment:
      <<: *engine-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hasura
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hasura
      HASURA_GRAPHQL_PG_CONNECTIONS: "50"
      EVENT_WEBHOOK_URL: http://handler:3000/events/hasura
    ports: ["${HASURA_SERVE_PORT:-8082}:8080"]
    cpuset: ${ENGINE_CPUSET:-0,1}
    mem_limit: ${ENGINE_MEM:-2g}

  rust-engine:
    profiles: ["rust"]
    # Reads the same project directory (migrations + metadata) as Hasura.
    image: ${RUST_ENGINE_IMAGE:-graphql-engine-rust:bench}
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      handler: {condition: service_healthy}
    environment:
      <<: *engine-env
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/rust
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/rust
      HASURA_GRAPHQL_PG_CONNECTIONS: "50"
      EVENT_WEBHOOK_URL: http://handler:3000/events/rust
      HASURA_GRAPHQL_MIGRATIONS_DIR: /hasura-migrations
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
    volumes:
      - ./project/migrations:/hasura-migrations:ro
      - ./project/metadata:/hasura-metadata:ro
    ports: ["${RUST_ENGINE_PORT:-8081}:8080"]
    cpuset: ${ENGINE_CPUSET:-0,1}
    mem_limit: ${ENGINE_MEM:-2g}
