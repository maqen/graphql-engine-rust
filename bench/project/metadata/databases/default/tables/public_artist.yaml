table:
  name: artist
  schema: public
array_relationships:
  - name: albums
    using:
      foreign_key_constraint_on:
        column: artist_id
        table:
          name: album
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - artist_id
        - name
      filter: {}
      allow_aggregations: true
