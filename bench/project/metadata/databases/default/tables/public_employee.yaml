table:
  name: employee
  schema: public
object_relationships:
  - name: manager
    using:
      foreign_key_constraint_on: reports_to
array_relationships:
  - name: customers
    using:
      foreign_key_constraint_on:
        column: support_rep_id
        table:
          name: customer
          schema: public
  - name: reports
    using:
      foreign_key_constraint_on:
        column: reports_to
        table:
          name: employee
          schema: public
