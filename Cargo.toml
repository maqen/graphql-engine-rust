[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/maqen/graphql-engine-rust"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# internal crates
hge-core = { path = "crates/hge-core" }
hge-metadata = { path = "crates/hge-metadata" }
hge-metadata-api = { path = "crates/hge-metadata-api" }
hge-ir = { path = "crates/hge-ir" }
hge-schema = { path = "crates/hge-schema" }
hge-postgres = { path = "crates/hge-postgres" }
hge-auth = { path = "crates/hge-auth" }
hge-server = { path = "crates/hge-server" }
hge-events = { path = "crates/hge-events" }
hge-actions = { path = "crates/hge-actions" }
hge-subscriptions = { path = "crates/hge-subscriptions" }
hge-transforms = { path = "crates/hge-transforms" }

# external crates
anyhow = "1"
arc-swap = "1"
async-graphql-parser = "7"
async-graphql-value = "7"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
futures = "0.3"
httpdate = "1"
http = "1"
indexmap = { version = "2", features = ["serde"] }
postgres-types = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false }
ring = "0.17"
# Only for JWT keys ring cannot verify: RSA under 2048 bits, ES512.
rsa = { version = "0.9", default-features = false, features = ["std"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
serde_yaml = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.29"
tokio-postgres-rustls = "0.14"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webpki-roots = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
subtle = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
