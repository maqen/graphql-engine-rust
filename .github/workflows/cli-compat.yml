name: CLI compatibility

# Runs the official Hasura CLI (v2.51.0, taken from the cli-migrations-v3 image) through a
# full project lifecycle against Hasura v2.51.0-ce and against our engine, and diffs every
# step (cli-compat/README.md). Fails on a step that differs from Hasura and is not listed in
# cli-compat/expected-failures.txt, and on a listed step that now matches.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine
        run: cargo build --locked -p graphql-engine
      - name: Pull Hasura images and extract the CLI
        run: |
          docker pull -q mirror.gcr.io/hasura/graphql-engine:v2.51.0-ce
          docker pull -q mirror.gcr.io/hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3
          id=$(docker create mirror.gcr.io/hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3)
          docker cp "$id:/bin/hasura-cli" ./hasura
          docker rm "$id"
          ./hasura version --skip-update-check
      - name: Install Playwright and Chromium (console scenario)
        run: |
          python3 -m pip install --quiet playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: Run the CLI and the console against both engines
        run: >-
          python3 cli-compat/run.py --hasura-cli ./hasura
          --rust-bin target/debug/graphql-engine
          --pg postgres://postgres:postgres@localhost:5432/postgres
          --out cli-compat-results
      - name: Publish report
        if: always()
        run: test -f cli-compat-results/report.md && head -c 900000 cli-compat-results/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compat-results
          path: cli-compat-results/
