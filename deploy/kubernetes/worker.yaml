# A dedicated replica that delivers event triggers, scheduled and cron events and processes
# async actions while the API Deployment runs with HASURA_GRAPHQL_DISABLE_EVENT_PROCESSING=true
# and HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_INTERVAL=0. It also serves requests, but gets no
# Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura-worker
  labels: { app: hasura-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hasura-worker }
  template:
    metadata:
      labels: { app: hasura-worker }
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: graphql-engine
          image: graphql-engine-rust
          env:
            - name: HASURA_GRAPHQL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: hasura, key: database-url } }
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom: { secretKeyRef: { name: hasura, key: admin-secret } }
            - { name: HASURA_GRAPHQL_ENABLED_APIS, value: graphql }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
