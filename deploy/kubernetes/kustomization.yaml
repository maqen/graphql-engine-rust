apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  # Uncomment to split API replicas from a dedicated worker (and uncomment
  # HASURA_GRAPHQL_DISABLE_EVENT_PROCESSING=true and
  # HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_INTERVAL=0 in deployment.yaml).
  # - worker.yaml
images:
  - name: graphql-engine-rust
    newName: REGISTRY/graphql-engine-rust
    newTag: TAG
