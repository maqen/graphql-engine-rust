config:
  admin_secret: s3cret
  stringify_numeric_types: true
cases:
  - description: missing admin secret
    query:
      query: "{ author { id } }"
    response:
      errors:
        - extensions: { path: "$", code: access-denied }
          message: '"x-hasura-admin-secret" required, but not found'

  - description: wrong admin secret
    headers: { x-hasura-admin-secret: nope }
    query:
      query: "{ author { id } }"
    response:
      errors:
        - extensions: { path: "$", code: access-denied }
          message: 'invalid "x-hasura-admin-secret"'

  - description: correct admin secret, stringified numerics
    headers: { x-hasura-admin-secret: s3cret }
    query:
      query: "{ author(where: {id: {_eq: 1}}) { id rating big } }"
    response:
      data:
        author: [{ id: 1, rating: "4.5", big: "9223372036854775807" }]
