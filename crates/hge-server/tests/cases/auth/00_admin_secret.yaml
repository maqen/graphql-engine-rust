# Admin secret mode (spec 05 §4).
config:
  admin_secret: s3cret
cases:
- description: 'impersonation: admin secret plus x-hasura-role'
  headers:
    X-Hasura-Admin-Secret: s3cret
    X-Hasura-Role: public
  query:
    query: '{ author(order_by: {id: asc}) { name } }'
  response:
    data:
      author:
      - name: Alice
      - name: Bob
- description: a bad backend-only header is a bad request
  headers:
    X-Hasura-Admin-Secret: s3cret
    X-Hasura-Use-Backend-Only-Permissions: maybe
  query:
    query: '{ author(order_by: {id: asc}) { name } }'
  response:
    errors:
    - extensions:
        path: $
        code: bad-request
      message: '"x-hasura-use-backend-only-permissions":  Not a valid boolean text. True values are ["true","t","yes","y"] and  False values are ["false","f","no","n"]. All values are case insensitive'
- description: authentication happens before the body is parsed
  method: POST
  headers:
    Content-Type: application/json
  query: not an object
  response:
    errors:
    - extensions:
        path: $
        code: access-denied
      message: '"x-hasura-admin-secret" required, but not found'
