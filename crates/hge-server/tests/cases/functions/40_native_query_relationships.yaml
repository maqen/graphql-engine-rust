# Recorded on hasura/graphql-engine:v2.51.0-ce.
config:
  fixture: functions
cases:
- description: native queries with relationships onto native queries and tables, an inline logical model,
    and table relationships onto native queries
  url: /v1/metadata
  query:
    type: replace_metadata
    args:
      version: 3
      sources:
      - name: default
        kind: postgres
        configuration:
          connection_info:
            database_url:
              from_env: HASURA_GRAPHQL_DATABASE_URL
        tables:
        - table:
            schema: public
            name: author
          object_relationships:
          - name: nq_self
            using:
              manual_configuration:
                remote_native_query: authors_nq
                column_mapping:
                  id: id
          array_relationships:
          - name: nq_articles
            using:
              manual_configuration:
                remote_native_query: articles_nq
                column_mapping:
                  id: author_id
          select_permissions:
          - role: user
            permission:
              columns:
              - id
              - first_name
              filter: {}
        - table:
            schema: public
            name: article
          select_permissions:
          - role: user
            permission:
              columns:
              - id
              - title
              filter:
                is_published:
                  _eq: true
        logical_models:
        - name: author_lm
          fields:
          - name: id
            type:
              scalar: integer
              nullable: false
          - name: first_name
            type:
              scalar: text
              nullable: false
          - name: articles
            type:
              array:
                logical_model: article_lm
          select_permissions:
          - role: user
            permission:
              columns:
              - id
              - first_name
              filter: {}
        - name: article_lm
          description: An article
          fields:
          - name: id
            type:
              scalar: integer
              nullable: false
          - name: author_id
            type:
              scalar: integer
              nullable: false
          - name: title
            type:
              scalar: text
              nullable: false
          select_permissions:
          - role: user
            permission:
              columns: '*'
              filter:
                id:
                  _gt: 1
        native_queries:
        - root_field_name: authors_nq
          code: SELECT id, first_name FROM author WHERE first_name LIKE {{pattern}}
          arguments:
            pattern:
              type: text
              nullable: false
          returns: author_lm
          array_relationships:
          - name: articles
            using:
              column_mapping:
                id: author_id
              remote_native_query: articles_nq
          - name: table_articles
            using:
              column_mapping:
                id: author_id
              remote_table:
                schema: public
                name: article
          object_relationships:
          - name: self_author
            using:
              column_mapping:
                id: id
              remote_table: author
        - root_field_name: articles_nq
          code: SELECT id, author_id, title FROM article
          returns: article_lm
          object_relationships:
          - name: author
            using:
              column_mapping:
                author_id: id
              remote_native_query: authors_nq
        - root_field_name: inline_nq
          code: SELECT 1 AS x
          description: An inline model
          returns:
            fields:
            - name: x
              type:
                scalar: integer
                nullable: false
            select_permissions:
            - role: user
              permission:
                columns:
                - x
                filter: {}
          array_relationships:
          - name: arts
            using:
              column_mapping:
                x: id
              remote_table:
                schema: public
                name: article
  response:
    message: success
- description: relationships between native queries and onto tables, with arguments and select arguments
  query:
    query: "{ authors_nq(args: {pattern: \"%\"}, order_by: {id: asc}) {\n    id first_name __typename\n\
      \    articles(order_by: {id: asc}) { id title __typename author(args: {pattern: \"A%\"}) { first_name\
      \ } }\n    self_author { last_name }\n    table_articles(order_by: {id: desc}, limit: 1) { title\
      \ }\n  } }\n"
  response:
    data:
      authors_nq:
      - id: 1
        first_name: Alice
        __typename: authors_nq
        articles:
        - id: 1
          title: Rust tips
          __typename: articles_nq
          author:
            first_name: Alice
        - id: 2
          title: Draft
          __typename: articles_nq
          author:
            first_name: Alice
        self_author:
          last_name: Smith
        table_articles:
        - title: Draft
      - id: 2
        first_name: Bob
        __typename: authors_nq
        articles:
        - id: 3
          title: Go tips
          __typename: articles_nq
          author: null
        self_author:
          last_name: null
        table_articles:
        - title: Go tips
      - id: 3
        first_name: Carol
        __typename: authors_nq
        articles:
        - id: 4
          title: Rust again
          __typename: articles_nq
          author: null
        self_author:
          last_name: Jones
        table_articles:
        - title: Rust again
- description: relationships use the target's select permissions
  headers:
    X-Hasura-Role: user
  query:
    query: "{ authors_nq(args: {pattern: \"%\"}, order_by: {id: asc}) {\n    id\n    articles(order_by:\
      \ {id: asc}) { id author(args: {pattern: \"%\"}) { first_name } }\n    table_articles(order_by:\
      \ {id: asc}) { title }\n  } }\n"
  response:
    data:
      authors_nq:
      - id: 1
        articles:
        - id: 2
          author:
            first_name: Alice
        table_articles:
        - title: Rust tips
      - id: 2
        articles:
        - id: 3
          author:
            first_name: Bob
        table_articles:
        - title: Go tips
      - id: 3
        articles:
        - id: 4
          author:
            first_name: Carol
        table_articles:
        - title: Rust again
- description: table relationships onto native queries
  query:
    query: "{ author(order_by: {id: asc}) {\n    id\n    nq_articles(where: {title: {_like: \"%tips\"\
      }}) { title }\n    nq_self(args: {pattern: \"%o%\"}) { first_name articles { id } }\n  } }\n"
  response:
    data:
      author:
      - id: 1
        nq_articles:
        - title: Rust tips
        nq_self: null
      - id: 2
        nq_articles:
        - title: Go tips
        nq_self:
          first_name: Bob
          articles:
          - id: 3
      - id: 3
        nq_articles: []
        nq_self:
          first_name: Carol
          articles:
          - id: 4
- description: an object relationship onto a native query without its arguments
  query:
    query: '{ articles_nq(limit: 1) { author { id } } }'
  response:
    errors:
    - message: missing required field 'args'
      extensions:
        path: $.selectionSet.articles_nq.selectionSet.author.args.args
        code: validation-failed
- description: filtering a table by its relationship onto a native query fails as in V2
  query:
    query: '{ author(where: {nq_articles: {title: {_eq: "Go tips"}}}) { id } }'
  response:
    errors:
    - message: Internal Server Error
      extensions:
        path: $
        code: unexpected
        internal:
          error: translateBoolExp RelTargetNativeQuery
- description: there is no aggregate of an array relationship onto a native query
  query:
    query: '{ authors_nq(args: {pattern: "%"}) { articles_aggregate { aggregate { count } } } }'
  response:
    errors:
    - message: 'field ''articles_aggregate'' not found in type: ''authors_nq'''
      extensions:
        path: $.selectionSet.authors_nq.selectionSet.articles_aggregate
        code: validation-failed
- description: a missing argument of the root field points at the argument
  query:
    query: '{ authors_nq(args: {}) { id } }'
  response:
    errors:
    - message: missing required field 'pattern'
      extensions:
        path: $.selectionSet.authors_nq.args.args.pattern
        code: validation-failed
- description: the inline logical model and its relationship
  headers:
    X-Hasura-Role: user
  query:
    query: '{ inline_nq { x __typename arts { id title } } }'
  response:
    data:
      inline_nq:
      - x: 1
        __typename: inline_nq
        arts:
        - id: 1
          title: Rust tips
- description: v1 selects fail on relationships onto native queries as in V2
  url: /v1/query
  query:
    type: select
    args:
      table: author
      columns:
      - '*.*'
  response:
    error: Internal Server Error
    path: $
    code: unexpected
    internal:
      error: convWildcard RelTargetNativeQuery
  status: 500
