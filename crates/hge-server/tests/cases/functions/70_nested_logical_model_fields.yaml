# Recorded on hasura/graphql-engine:v2.51.0-ce.
config:
  fixture: functions
cases:
- description: track the inner logical model
  url: /v1/metadata
  query:
    type: pg_track_logical_model
    args:
      source: default
      name: nested_inner
      fields:
      - name: a
        type:
          scalar: int4
  response:
    message: success
- description: a native query over it
  url: /v1/metadata
  query:
    type: pg_track_native_query
    args:
      source: default
      root_field_name: nested_inner_q
      returns: nested_inner
      arguments: {}
      code: SELECT 1 AS a
  response:
    message: success
- description: 'object field without a relationship: track the logical model'
  url: /v1/metadata
  query:
    type: pg_track_logical_model
    args:
      source: default
      name: nested_outer
      fields:
      - name: id
        type:
          scalar: int4
      - &id001
        name: one
        type:
          logical_model: nested_inner
          nullable: true
  response:
    message: success
- description: 'object field without a relationship: track a native query returning it'
  url: /v1/metadata
  query:
    type: pg_track_native_query
    args:
      source: default
      root_field_name: nested_q
      returns: nested_outer
      arguments: {}
      code: SELECT 1 AS id
  response:
    error: Unexpected logical model object field 'one'.
    path: $.args
    code: unexpected
  status: 500
- description: 'object field without a relationship: untrack the logical model'
  url: /v1/metadata
  query:
