cases:
  - description: healthz
    url: /healthz
    response: OK

  - description: select with nested object and array relationships
    query:
      query: |
        { author(order_by: {id: asc}) {
            id name tags mood createdAt
            articles(where: {is_published: {_eq: true}}, order_by: {id: asc}) { title author { name } }
        } }
    response:
      data:
        author:
          - id: 1
            name: Alice
            tags: [a, b]
            mood: happy
            createdAt: "2020-01-01T00:00:00+00:00"
            articles:
              - { title: Rust in production, author: { name: Alice } }
          - id: 2
            name: Bob
            tags: []
            mood: sad
            createdAt: "2020-01-01T00:00:00+00:00"
            articles:
              - { title: Go concurrency, author: { name: Bob } }
              - { title: Lima travel, author: { name: Bob } }
          - id: 3
            name: Carol
            tags: null
            mood: null
            createdAt: "2020-01-01T00:00:00+00:00"
            articles: []

  - description: numbers are JSON numbers by default
    query:
      query: "{ author(where: {id: {_eq: 1}}) { rating big } }"
    response:
      data:
        author: [{ rating: 4.5, big: 9223372036854775807 }]

  - description: by_pk, custom root field, custom column name, __typename
    query:
      query: |
        { article_by_pk(id: 4) { title content }
          missing: article_by_pk(id: 99) { id }
          things(order_by: {code: asc}) { code displayLabel __typename }
          __typename }
    response:
      data:
        article_by_pk: { title: Lima travel, content: "it's \"quoted\"" }
        missing: null
        things:
          - { code: x, displayLabel: Ex, __typename: other_thing }
          - { code: y, displayLabel: null, __typename: other_thing }
        __typename: query_root

  - description: limit, offset, order_by desc, variables, fragments
    query:
      query: |
        query Q($names: [String!]) {
          author(where: {name: {_in: $names}}, order_by: {name: desc}, limit: 1, offset: 1) { ...F }
        }
        fragment F on author { id name }
      variables: { names: [Alice, Bob, Carol] }
    response:
      data:
        author: [{ id: 2, name: Bob }]

  - description: boolean expressions over relationships, _or, _not, _ilike
    query:
      query: |
        { author(where: {_or: [{id: {_eq: 3}}, {articles: {title: {_ilike: "%lima%"}}}]}, order_by: {id: asc}) { id }
          notAlice: author(where: {_not: {name: {_eq: "Alice"}}}, order_by: {id: asc}) { id }
          withNull: author(where: {rating: {_is_null: true}}) { id } }
    response:
      data:
        author: [{ id: 2 }, { id: 3 }]
        notAlice: [{ id: 2 }, { id: 3 }]
        withNull: [{ id: 3 }]

  - description: jsonb operators and json path argument
    query:
      query: |
        { author(where: {info: {_contains: {city: "Oslo"}}}) { id info(path: "langs[0]") }
          hasKey: author(where: {info: {_has_key: "langs"}}) { id } }
    response:
      data:
        author: [{ id: 1, info: rust }]
        hasKey: [{ id: 1 }]

  - description: jsonb path operators
    query:
      query: |
        query ($p: String) {
          exists: author(where: {info: {_jsonb_path_exists: "$.langs[*] ? (@ == \"rust\")"}}) { id }
          match: author(where: {info: {_jsonb_path_match: $p}}) { id }
          none: author(where: {info: {_jsonb_path_exists: "$.nope"}}) { id }
          strict: author(where: {info: {_jsonb_path_exists: "strict $.nope"}}) { id }
          notBool: author(where: {info: {_jsonb_path_match: "$.city"}}) { id } }
      variables:
        p: '$.city == "Oslo"'
    response:
      data:
        exists: [{ id: 1 }]
        match: [{ id: 1 }]
        none: []
        strict: []
        notBool: []

  - description: order by object relationship column
    query:
      query: "{ article(order_by: [{author: {name: desc}}, {id: asc}], limit: 2) { id } }"
    response:
      data:
        article: [{ id: 3 }, { id: 4 }]

  - description: distinct_on must match the leading order_by
    query:
      query: "{ article(distinct_on: [author_id], order_by: {id: asc}) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.article.args", code: validation-failed }
          message: '"distinct_on" columns must match initial "order_by" columns'

  - description: distinct_on
    query:
      query: "{ article(distinct_on: [author_id], order_by: [{author_id: asc}, {id: desc}]) { id } }"
    response:
      data:
        article: [{ id: 2 }, { id: 4 }]

  - description: a float literal for limit is a type mismatch (V2's nonNegativeInt)
    query:
      query: "{ author(limit: 1.5) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.limit", code: validation-failed }
          message: "expected a non-negative 32-bit integer for type 'Int', but found a float"

  # Article 2 is the unpublished one, so only 4 matches.
  - description: a column value may be a string, which Postgres parses (V2's column parser)
    query:
      query: '{ article(where: {id: {_in: ["2", 4]}, is_published: {_eq: "true"}}) { id } }'
    response:
      data:
        article: [{ id: 4 }]

  - description: a non-column Int stays strict about strings
    query:
      query: '{ author(limit: "1") { id } }'
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.limit", code: validation-failed }
          message: "expected a non-negative 32-bit integer for type 'Int', but found a string"

  - description: a float for an Int column is V2's parse failure, not a type mismatch
    query:
      query: "{ article(where: {id: {_eq: 1.5}}) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.article.args.where.id._eq", code: parse-failed }
          message: >-
            The value 1.5 lies outside the bounds or is not an integer. Maybe it is a float,
            or is there integer overflow?

  - description: an out-of-range Int is a parse failure, shown as Haskell's Scientific
    query:
      query: "query ($l: Int) { author(limit: $l) { id } }"
      variables: { l: 3000000000 }
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.limit", code: parse-failed }
          message: "The value 3.0e9 lies outside the bounds or is not an integer. Maybe it is a float, or is there integer overflow?"

  - description: unknown field
    query:
      query: "{ author { nope } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.selectionSet.nope", code: validation-failed }
          message: "field 'nope' not found in type: 'author'"

  - description: null in a comparison is rejected
    query:
      query: "{ author(where: {name: {_eq: null}}) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.where.name._eq", code: validation-failed }
          message: "unexpected null value for type 'String'"

  - description: parse error
    query:
      query: "{ author { id "
    response:
      errors:
        - extensions: { path: "$.query", code: validation-failed }
          message: not a valid graphql query

  - description: introspection root
    query:
      query: "{ __schema { queryType { name } mutationType { name } } __type(name: \"author\") { name kind } }"
    response:
      data:
        __schema: { queryType: { name: query_root }, mutationType: { name: mutation_root } }
        __type: { name: author, kind: OBJECT }

  - description: aliases longer than Postgres identifiers stay distinct
    query:
      query: "{ author(where: {id: {_eq: 1}}) { aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: id aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaab: name } }"
    response:
      data:
        author: [{ aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: 1, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaab: Alice }]

  - description: error paths name the field, not its alias
    query:
      query: "{ a: author { b: nope } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.selectionSet.nope", code: validation-failed }
          message: "field 'nope' not found in type: 'author'"

  - description: enum errors list the values and quote what was found
    query:
      query: "{ author(distinct_on: [nope]) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.distinct_on[0]", code: validation-failed }
          message: "expected one of the values ['id', 'name', 'rating', 'big', 'tags', 'info', 'mood', 'createdAt'] for type 'author_select_column', but found 'nope'"

  - description: a non-enum value for an enum type
    query:
      query: '{ author(order_by: {id: "asc"}) { id } }'
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.order_by[0].id", code: validation-failed }
          message: "expected an enum value for type 'order_by', but found a string"

  - description: an unused variable may be declared with an output type, as in V2
    query:
      query: "query ($x: article) { __typename }"
    response:
      data:
        __typename: query_root

  - description: a variable of an output type fails where it is used
    query:
      query: "query ($x: article) { author(limit: $x) { id } }"
      variables: { x: 1 }
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.args.limit", code: validation-failed }
          message: "variable 'x' is declared as 'article', but used where 'Int' is expected"

  - description: provided variables the query doesn't use are rejected, in V2's hash order
    query:
      query: "query ($x: Int) { __typename }"
      variables: { x: 1, y: 2, z: 3 }
    response:
      errors:
        - extensions: { path: "$", code: validation-failed }
          message: "unexpected variables in variableValues: y, z, x"

  # V2 applies one order_by object's keys in the hash order of the field names, verified on
  # v2.51.0-ce: author_id before title, and title before author.
  - description: a multi-key order_by object sorts in V2's field hash order
    query:
      query: "{ article(order_by: {title: desc, author_id: asc}) { id } }"
    response:
      data:
        article: [{ id: 1 }, { id: 2 }, { id: 4 }, { id: 3 }]

  - description: a relationship key in a multi-key order_by object sorts in V2's hash order too
    query:
      query: "{ article(order_by: {author: {name: desc}, title: asc}) { id } }"
    response:
      data:
        article: [{ id: 2 }, { id: 3 }, { id: 4 }, { id: 1 }]

  - description: aggregate order_by applies count first, as V2 does
    query:
      query: "{ author(order_by: {articles_aggregate: {max: {score: asc}, count: asc}}) { id } }"
    response:
      data:
        author: [{ id: 3 }, { id: 2 }, { id: 1 }]

  - description: an aggregate function's columns apply in V2's hash order
    query:
      query: "{ author(order_by: {articles_aggregate: {max: {title: asc, author_id: desc}}}) { id } }"
    response:
      data:
        author: [{ id: 3 }, { id: 2 }, { id: 1 }]

  - description: fragment cycles are found while inlining, with V2's path
    query:
      query: |
        { author { ...a } }
        fragment a on author { articles { ...b } }
        fragment b on article { author { ...a } }
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.selectionSet.a.selectionSet.articles.selectionSet.b.selectionSet.author.selectionSet", code: validation-failed }
          message: "the fragment definition(s) a and b form a cycle"

  - description: an undefined fragment
    query:
      query: "{ author { ...nope } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.author.selectionSet", code: validation-failed }
          message: 'reference to undefined fragment "nope"'

  - description: a variable used but not declared
    query:
      query: "{ author(limit: $l) { id } }"
    response:
      errors:
        - extensions: { path: "$", code: validation-failed }
          message: 'unbound variable "l"'

  - description: null for a non-null variable is rejected up front, even with a default
    query:
      query: "query ($l: Int! = 1) { author(limit: $l) { id } }"
      variables: { l: null }
    response:
      errors:
        - extensions: { path: "$", code: validation-failed }
          message: 'null value found for non-nullable type: "Int!"'

  - description: null for a non-null input object is the object parser's type mismatch
    query:
      query: "mutation { update_article(where: null, _set: {title: \"x\"}) { affected_rows } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.update_article.args.where", code: validation-failed }
          message: "expected an object for type 'article_bool_exp', but found null"

  - description: offset accepts an integer string (V2's bigInt)
    query:
      query: '{ article(order_by: {id: asc}, offset: "3") { id } }'
    response:
      data:
        article: [{ id: 4 }]

  - description: a negative offset fails in Postgres, as in V2
    query:
      query: "{ article(offset: -1) { id } }"
    response:
      errors:
        - extensions: { path: "$", code: data-exception }
          message: "OFFSET must not be negative"

  - description: variables inside a jsonb literal take their values
    query:
      query: "query ($v: jsonb) { author(where: {info: {_contains: {city: $v}}}) { id } }"
      variables: { v: Lima }
    response:
      data:
        author: [{ id: 2 }]

  - description: an Apollo persisted query is not supported
    query:
      query: "{ __typename }"
      extensions: { persistedQuery: { version: 1, sha256Hash: abc } }
    response:
      errors:
        - extensions: { path: "$", code: not-supported }
          message: PersistedQueryNotSupported

  - description: a null default doesn't let a nullable variable fill a non-null position
    query:
      query: 'mutation ($w: article_bool_exp = null) { update_article(where: $w, _set: {title: "x"}) { affected_rows } }'
    response:
      errors:
        - extensions: { path: "$.selectionSet.update_article.args.where", code: validation-failed }
          message: "variable 'w' is declared as 'article_bool_exp', but used where 'article_bool_exp!' is expected"

  - description: a negative offset only fails after the query is validated, as in V2
    query:
      query: "{ article(offset: -1, distinct_on: [author_id], order_by: {id: asc}) { id } }"
    response:
      errors:
        - extensions: { path: "$.selectionSet.article.args", code: validation-failed }
          message: '"distinct_on" columns must match initial "order_by" columns'
