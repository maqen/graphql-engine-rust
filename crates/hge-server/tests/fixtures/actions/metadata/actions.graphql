type Query {
  echo(arg: EchoInput, flag: Boolean, color: Color, extra: json): json

  authorInfo(id: Int!): AuthorInfo

  authorInfos(ids: [Int!]!): [AuthorInfo!]!

  respond(status: Int!, body: json): AuthorInfo

  respondScalar(body: json): [String!]

  slow: String
}

type Mutation {
  login(username: String!, password: String!): LoginOutput!

  asyncRespond(status: Int!, body: json): AsyncRespond

  asyncEcho(arg: EchoInput): AsyncEcho

  asyncAuthor(id: Int!): AsyncAuthor

  asyncSlow: AsyncRespond
}

input EchoInput {
  name: String!
  nested: EchoInput
  tags: [String]
}

enum Color {
  RED
  GREEN
}

type AuthorInfo {
  authorId: Int
  label: String!
  address: Address
}

type Address {
  city: String
}

type LoginOutput {
  token: String!
}

type AsyncRespond {
  authorId: Int
  label: String!
  address: Address
}

type AsyncEcho {
  payload: json
  headers: json
}

type AsyncAuthor {
  authorId: Int
  label: String!
}

extend type Query {
  transformRequest(id: Int!, name: String!): json

  transformForm(foo: String!, missing: String): json

  transformResponse(status: Int!, body: json): AuthorInfo

  transformBroken: json
}

extend type Mutation {
  asyncTransformed(other: Int!): AsyncAuthor
}
