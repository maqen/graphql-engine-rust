- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      pool_settings:
        max_connections: 10
  tables: "!include default/tables/tables.yaml"
  functions:
    - function:
        name: my_messages
        schema: public
      configuration:
        session_argument: hasura_session
