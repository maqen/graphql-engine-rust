table:
  name: author
  schema: public
array_relationships:
  - name: articles
    using:
      foreign_key_constraint_on:
        column: author_id
        table:
          name: article
          schema: public
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - name
      filter: {}
      limit: 2
  - role: reader
    permission:
      columns:
        - id
        - name
        - rating
      filter: {}
      limit: 2
      allow_aggregations: true
