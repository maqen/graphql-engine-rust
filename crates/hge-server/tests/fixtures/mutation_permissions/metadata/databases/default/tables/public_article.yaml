table:
  name: article
  schema: public
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
select_permissions:
  - role: user
    permission:
      columns: [id, title, author_id]
      filter:
        author:
          owner_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  # Only under one's own authors (a relationship check).
  - role: user
    permission:
      columns: [title, author_id]
      check:
        author:
          owner_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  # Deletes without being able to read (V2 still offers `delete_article`).
  - role: pruner
    permission:
      filter:
        title:
          _like: "%1"
