    url: /v1/query
    status: 400
    query:
      type: update_remote_relationship
      args:
        name: name
        table: {schema: custom, name: profiles}
        hasura_fields: [id]
        remote_schema: my-remote-schema
        remote_field: {message: {arguments: {id: "$id"}}}
    response: {"error": "expecting a remote relationship", "path": "$.args", "code": "unexpected-payload"}

