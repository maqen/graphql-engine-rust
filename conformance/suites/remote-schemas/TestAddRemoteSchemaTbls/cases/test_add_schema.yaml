upstream:
  file: test_schema_stitching.py
  class: TestAddRemoteSchemaTbls
  method: test_add_schema
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: run_sql
      args:
        sql: |
          CREATE TABLE hello (
            id SERIAL PRIMARY KEY,
            code TEXT,
            name TEXT
          );
          CREATE TABLE authors (
            id SERIAL PRIMARY KEY,
            name TEXT
          );
    - type: track_table
      args:
        schema: public
        name: hello
    - type: track_table
      args:
        schema: public
        name: authors
    - type: add_remote_schema
      args:
        name: simple2-graphql
        comment: testing
        definition:
          url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
          forward_client_headers: false
  response:
  - result_type: CommandOk
    result: null
  - message: success
  - message: success
  - message: success
- url: /v1/query
  status: 200
  query:
    type: export_metadata
    args: {}
  response:
    version: 3
    sources:
    - name: default
      kind: postgres
      tables:
      - table:
          name: authors
          schema: public
      - table:
          name: hello
          schema: public
      configuration:
        connection_info:
          database_url:
            from_env: HASURA_GRAPHQL_DATABASE_URL
          isolation_level: read-committed
          use_prepared_statements: false
    remote_schemas:
    - name: simple2-graphql
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
      comment: testing
