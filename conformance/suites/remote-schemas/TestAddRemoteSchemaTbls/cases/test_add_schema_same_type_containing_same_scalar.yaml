upstream:
  file: test_schema_stitching.py
  class: TestAddRemoteSchemaTbls
  method: test_add_schema_same_type_containing_same_scalar
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: run_sql
      args:
        sql: |
          CREATE TABLE hello (
            id SERIAL PRIMARY KEY,
            code TEXT,
            name TEXT
          );
          CREATE TABLE authors (
            id SERIAL PRIMARY KEY,
            name TEXT
          );
    - type: track_table
      args:
        schema: public
        name: hello
    - type: track_table
      args:
        schema: public
        name: authors
    - type: add_remote_schema
      args:
        name: simple2-graphql
        comment: testing
        definition:
          url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
          forward_client_headers: false
  response:
  - result_type: CommandOk
    result: null
  - message: success
  - message: success
  - message: success
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: run_sql
      args:
        sql: |
          CREATE TABLE person (
            id SERIAL PRIMARY KEY,
            name TEXT,
            created TIMESTAMPTZ
          );
    - type: track_table
      args:
        schema: public
        name: person
  response:
  - result_type: CommandOk
    result: null
  - message: success
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: person-graphql
      comment: testing person-graphql
      definition:
        url: '{{helper:graphql_server}}/person-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: run_sql
      args:
        sql: drop table person cascade
  response:
  - result_type: CommandOk
    result: null
- url: /v1/query
  status: 200
  query:
    type: remove_remote_schema
    args:
      name: person-graphql
  response:
    message: success
