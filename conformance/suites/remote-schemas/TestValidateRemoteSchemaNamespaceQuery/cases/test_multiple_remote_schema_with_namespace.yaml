upstream:
  file: test_schema_stitching.py
  class: TestValidateRemoteSchemaNamespaceQuery
  method: test_multiple_remote_schema_with_namespace
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: character-foo
      comment: testing character-foo
      definition:
        url: '{{helper:graphql_server}}/character-iface-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization:
          root_fields_namespace: foo
  response:
    message: success
- description: add a remote schema with namespace
  url: /v1/metadata
  status: 200
  query:
    type: add_remote_schema
    args:
      name: user1
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
        customization:
          root_fields_namespace: bar
          type_names:
            mapping:
              UserQuery: MyQueryRoot
  response:
    message: success
- description: add same remote schema with other namespace
  url: /v1/metadata
  status: 200
  query:
    type: add_remote_schema
    args:
      name: user2
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
        customization:
          root_fields_namespace: baz
  response:
    message: success
- description: query with namespace
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        foo {
          __typename
        }
        bar {
          __typename
        }
        baz {
          __typename
        }
      }
  response:
    data:
      foo:
        __typename: fooCharacterIFaceQuery
      bar:
        __typename: MyQueryRoot
      baz:
        __typename: bazUserQuery
- description: remove both remote schema
  url: /v1/metadata
  status: 200
  query:
    type: bulk
    args:
    - type: remove_remote_schema
      args:
        name: user1
    - type: remove_remote_schema
      args:
        name: user2
  response:
  - message: success
  - message: success
