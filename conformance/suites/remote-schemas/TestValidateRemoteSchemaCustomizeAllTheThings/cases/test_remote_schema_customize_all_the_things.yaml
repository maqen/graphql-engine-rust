upstream:
  file: test_schema_stitching.py
  class: TestValidateRemoteSchemaCustomizeAllTheThings
  method: test_remote_schema_customize_all_the_things
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: character-foo
      comment: testing character-foo
      definition:
        url: '{{helper:graphql_server}}/character-iface-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization:
          root_fields_namespace: star_wars
          type_names:
            prefix: Foo
            suffix: _x
            mapping:
              Droid: Android
              Int: MyInt
          field_names:
          - parent_type: Character
            prefix: foo_
            suffix: _f
            mapping:
              id: ident
          - parent_type: Human
            mapping:
              id: ident
              name: foo_name_f
              droid: android
          - parent_type: Droid
            prefix: foo_
            suffix: _f
            mapping:
              id: ident
          - parent_type: CharacterIFaceQuery
            prefix: super_
  response:
    message: success
- description: query with prefix type name in inline fragment
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            ... on Android {
              ident
              foo_name_f
              foo_primaryFunction_f
            }
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
          foo_primaryFunction_f: Astromech
- description: query with prefix type name in inline fragment and non-existing field
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            ... on Android {
              ident
              foo_name_f
              foo_primaryFunction_f
              non_existing_field
            }
          }
        }
      }
  response:
    errors:
    - message: 'field ''non_existing_field'' not found in type: ''Android'''
      extensions:
        path: $.selectionSet.star_wars.selectionSet.super_hero.selectionSet.non_existing_field
        code: validation-failed
- description: query with prefix original (non-customized) type name in inline fragment
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            ... on Droid {
              ident
              foo_name_f
              foo_primaryFunction_f
            }
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
- description: query with fragment
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ... characterFields
          }
        }
      }

      fragment characterFields on FooCharacter_x {
        ident
        foo_name_f
        __typename
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
          __typename: Android
- description: query with variable
  url: /v1/graphql
  status: 200
  query:
    query: |
      query Hero($ep: MyInt!) {
        star_wars {
          super_hero(episode: $ep) {
            ident
            foo_name_f
          }
        }
      }
    variables:
      ep: 4
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
- description: query with variable with wrong type name
  url: /v1/graphql
  status: 200
  query:
    query: |
      query Hero($ep: Int!) {
        star_wars {
          super_hero(episode: $ep) {
            ident
            foo_name_f
          }
        }
      }
    variables:
      ep: 4
  response:
    errors:
    - message: variable 'ep' is declared as 'Int!', but used where 'MyInt!' is expected
      extensions:
        path: $.selectionSet.star_wars.selectionSet.super_hero.args.episode
        code: validation-failed
- description: query with __type introspection
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        __type(name: "Android") {
          kind
          name
        }
      }
  response:
    data:
      __type:
        kind: OBJECT
        name: Android
- description: query with __type introspection on original type should return empty result
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        __type(name: "Droid") {
          kind
          name
        }
      }
  response:
    data:
      __type: null
- description: query with __typename
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            __typename
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
          __typename: Android
- description: query with __typename in list field
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_heroes {
            ident
            foo_name_f
            __typename
            ... on FooHuman_x {
              android {
                foo_name_f
                __typename
              }
            }
          }
        }
      }
  response:
    data:
      star_wars:
        super_heroes:
        - ident: '1'
          foo_name_f: R2-D2
          __typename: Android
        - ident: '2'
          foo_name_f: Luke Skywalker
          __typename: FooHuman_x
          android:
            foo_name_f: R2-D2
            __typename: Android
- description: query with __typename and field aliases
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        space_wars: star_wars {
          my_hero: super_hero(episode: 4) {
            my_id: ident
            my_name: foo_name_f
            my_typename: __typename
          }
        }
      }
  response:
    data:
      space_wars:
        my_hero:
          my_id: '1'
          my_name: R2-D2
          my_typename: Android
- description: query with __typename in list field and field aliases
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          my_heroes: super_heroes {
            my_id: ident
            my_name: foo_name_f
            my_typename: __typename
            ... on FooHuman_x {
              my_droid: android {
                my_droid_name: foo_name_f
                my_droid_typename: __typename
              }
            }
          }
        }
      }
  response:
    data:
      star_wars:
        my_heroes:
        - my_id: '1'
          my_name: R2-D2
          my_typename: Android
        - my_id: '2'
          my_name: Luke Skywalker
          my_typename: FooHuman_x
          my_droid:
            my_droid_name: R2-D2
            my_droid_typename: Android
- description: query with prefix field name in inline fragment
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            ... on Android {
              ident
              foo_name_f
              foo_primaryFunction_f
            }
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
          foo_primaryFunction_f: Astromech
- description: query with prefix field name and non-existing (renamed) field
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            id
          }
        }
      }
  response:
    errors:
    - message: 'field ''id'' not found in type: ''FooHuman_x'''
      extensions:
        path: $.selectionSet.star_wars.selectionSet.super_hero.selectionSet.id
        code: validation-failed
- description: query aliases
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            name: ident
            id: foo_name_f
            __typename: ident
            ... on Android {
              foo_name: foo_primaryFunction_f
              android_typename: __typename
            }
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          name: '1'
          id: R2-D2
          __typename: '1'
          foo_name: Astromech
          android_typename: Android
- description: query with __typename (__typename should _not_ be affected by field prefix/suffix customization)
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        star_wars {
          super_hero(episode: 4) {
            ident
            foo_name_f
            __typename
          }
        }
      }
  response:
    data:
      star_wars:
        super_hero:
          ident: '1'
          foo_name_f: R2-D2
          __typename: Android
