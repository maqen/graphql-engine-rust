upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaIntrospectionHeaders
  method: test_introspection_and_runtime_headers
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: introspection-headers
      comment: testing introspection-headers
      definition:
        url: '{{helper:graphql_server}}/introspection-headers-graphql?mode=null'
        headers:
        - name: x-runtime-header
          value: runtime
        forward_client_headers: false
        timeout_seconds: null
        customization: null
        introspection_headers: null
  response:
    message: success
- url: /v1/query
  status: 200
  query:
    type: export_metadata
    args: {}
  response:
    version: 3
    sources:
    - name: default
      kind: postgres
      tables: []
      configuration:
        connection_info:
          database_url:
            from_env: HASURA_GRAPHQL_DATABASE_URL
          isolation_level: read-committed
          use_prepared_statements: false
    remote_schemas:
    - name: introspection-headers
      definition:
        url: '{{helper:graphql_server}}/introspection-headers-graphql?mode=null'
        headers:
        - name: x-runtime-header
          value: runtime
      comment: testing introspection-headers
- url: /v1/graphql
  status: 200
  query:
    query: '{ hello }'
  response:
    data:
      hello: Hello world
