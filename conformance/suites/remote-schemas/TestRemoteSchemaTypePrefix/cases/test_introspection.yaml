  query:
    type: add_remote_schema
    args:
      name: simple 2
      comment: testing simple 2
      definition:
        url: '{{helper:graphql_server}}/user-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization:
          type_names:
            prefix: Foo
            mapping: {}
  response:
    message: success
- description: GraphQL introspection query
  url: /v1/graphql
  status: 200
  query:
    query: |
      query IntrospectionQuery {
        __schema {
          queryType {
            name
            }
          mutationType {
            name
            }
          subscriptionType {
            name
            }
            types {
            ...FullType
            }
          directives {
            name
            description
            locations
            args {
            ...InputValue
            }
          }
        }
      }

      fragment FullType on __Type {
        kind
        name
        description
        fields(includeDeprecated: true) {
          name
          description
          args {
          ...InputValue
          }
          type {
          ...TypeRef
          }
          isDeprecated
          deprecationReason
        }
        inputFields {
          ...InputValue
        }
        interfaces {
          ...TypeRef
        }
        enumValues(includeDeprecated: true) {
            name
            description
            isDeprecated
            deprecationReason
        }
        possibleTypes {
          ...TypeRef
        }
      }

      fragment InputValue on __InputValue {
      name
      description
      type {
      ...TypeRef
      }
      defaultValue
      }

      fragment TypeRef on __Type {
        kind
        name
        ofType {
          kind
          name
          ofType {
            kind
            name
            ofType {
              kind
              name
              ofType {
                kind
                name
                ofType {
                  kind
                  name
                  ofType {
                    kind
                    name
                    ofType {
                      kind
                      name
                    }
                  }
                }
              }
            }
          }
        }
      }
