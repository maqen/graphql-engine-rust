upstream:
  file: test_schema_stitching.py
  class: TestValidateRemoteSchemaQuery
  method: test_remote_schema_argument_validation
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: add_remote_schema
      args:
        name: user
        definition:
          url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/user-graphql'
    - type: add_remote_schema
      args:
        name: character-iface
        definition:
          url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/character-iface-graphql'
    - type: add_remote_schema
      args:
        name: union
        definition:
          url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/union-graphql'
  response:
  - message: success
  - message: success
  - message: success
- description: query the remote with a non-existing input argument 'foo'
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        user(foo:1) {
          id
          username
        }
      }
  response:
    errors:
    - message: '''user'' has no argument named ''foo'''
      extensions:
        path: $.selectionSet.user
        code: validation-failed
- description: query the remote with a string literal for an int
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        user(id:"1") {
          id
          username
        }
      }
  response:
    data: null
    errors:
    - locations:
      - column: 19
        line: 1
      message: |-
        Argument "id" has invalid value "1".
        Expected type "Int", found "1".
- description: query the remote with a non-existing input object field 'foo'
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        createUserInputObj(userData:{id:5,username:"somethin",foo:"baz"}) {
          user {
            id
            username
          }
        }
      }
  response:
    errors:
    - message: 'field ''foo'' not found in type: ''UserDetailsInput'''
      extensions:
        path: $.selectionSet.createUserInputObj.args.userData.foo
        code: validation-failed
- description: an argument expecting a list of input objects should work properly
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        objectPassedToArrayType: user(id:1, userInfo: {id: 1, username: "foo"}) {
          id
          username
        }
        user(id:1, userInfo: {id: 1, username: "foo"}) {
          id
          username
        }
      }
  response:
    data:
      objectPassedToArrayType:
        id: 1
        username: jane
      user:
        id: 1
        username: jane
- description: an argument expecting a list of input objects should work properly
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        objectPassedToArrayType: user(id:1, userInfo: {id: 1, username: "foo"}) {
          id
          username
        }
        user(id:1, userInfo: [{id: 1, username: "foo"}]) {
          id
          username
        }
      }
  response:
    data:
      objectPassedToArrayType:
        id: 1
        username: jane
      user:
        id: 1
        username: jane
