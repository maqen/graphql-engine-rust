upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_interface_err_wrong_field_type
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Add a remote schema with an object implementing the interface has a field with a different type when compared to the same field in the interface
  url: /v1/query
  status: 400
  query:
    type: add_remote_schema
    args:
      name: err-unknown-types
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/iface-graphql-err-wrong-field-type'
        headers: []
        forward_client_headers: true
  response:
    error: The type of Object field 'Droid'."id" (String!) is not the same type/sub type of Interface field 'Character'."id" (ID!)
    path: $.args
    code: remote-schema-error
