upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_interface_err_extra_non_null_arg
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Add a remote schema with a field of object implementing the interface having an extra non-null arg
  url: /v1/query
  status: 400
  query:
    type: add_remote_schema
    args:
      name: err-unknown-types
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/iface-graphql-err-extra-non-null-arg'
        headers: []
        forward_client_headers: true
  response:
    error: Object field argument 'Droid'."id"("extraArg":) is of required type Int!, but is not provided by Interface field 'Character'."id"
    path: $.args
    code: remote-schema-error
