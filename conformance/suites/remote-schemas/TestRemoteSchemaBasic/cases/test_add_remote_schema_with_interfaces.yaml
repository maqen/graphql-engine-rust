upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_interfaces
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: my remote interface one
      comment: testing my remote interface one
      definition:
        url: '{{helper:graphql_server}}/character-iface-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Query from the remote schema with interfaces
  url: /v1/graphql
  status: 200
  query:
    query: |
      query getHeroes {
        hero3: hero (episode: 3) {
          id
        }

        hero4: hero (episode: 4) {
          __typename
          id
          name
          ... on Droid {
            primaryFunction
          }
        }

        hero5: hero (episode: 5) {
          __typename
          name
          ... on Droid {
            primaryFunction
          }
          ... on Human {
            homePlanet
          }
        }
      }
  response:
    data:
      hero3: null
      hero4:
        __typename: Droid
        id: '1'
        name: R2-D2
        primaryFunction: Astromech
      hero5:
        __typename: Human
        name: Luke Skywalker
        homePlanet: Tatooine
- url: /v1/query
  status: 200
  query:
    type: remove_remote_schema
    args:
      name: my remote interface one
  response:
    message: success
