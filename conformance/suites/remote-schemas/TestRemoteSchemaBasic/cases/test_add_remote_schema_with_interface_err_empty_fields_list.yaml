upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_interface_err_empty_fields_list
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Add a remote schema with an interface with field list empty
  url: /v1/query
  status: 400
  query:
    type: add_remote_schema
    args:
      name: err-unknown-types
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/iface-graphql-err-empty-field-list'
        headers: []
        forward_client_headers: true
  response:
    error: List of fields cannot be empty for interface 'Character'
    path: $.args
    code: remote-schema-error
