upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_union_err_no_member_types
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Add a remote schema with a union which has unknown object types
  url: /v1/query
  status: 400
  query:
    type: add_remote_schema
    args:
      name: err-no-mem-types
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/union-graphql-err-no-member-types'
        headers: []
        forward_client_headers: true
  response:
    error: List of member types cannot be empty for union type 'CharacterSearchResult'
    path: $.args
    code: remote-schema-error
