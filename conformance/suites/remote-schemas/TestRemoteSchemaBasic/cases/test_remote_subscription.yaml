upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_remote_subscription
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Simple GraphQL subscription - not supported
  url: /v1/graphql
  status: 200
  query:
    query: |
      subscription {
        hello
      }
  response:
    errors:
    - message: subscription to remote server is not supported
      extensions:
        path: $
        code: not-supported
