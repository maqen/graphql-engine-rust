upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_json_scalar_dict
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: my remote
      comment: testing my remote
      definition:
        url: '{{helper:graphql_server}}/json-scalar-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Regression test for hasura/graphql-engine#7543 and hasura/graphql-engine#8200
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        jsonTest
      }
  response:
    data:
      jsonTest:
        foo\: bar
        '"foo"': bar
- url: /v1/query
  status: 200
  query:
    type: remove_remote_schema
    args:
      name: my remote
  response:
    message: success
