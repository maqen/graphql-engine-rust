upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaBasic
  method: test_add_remote_schema_with_interface_err_wrong_arg_type
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{helper:graphql_server}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: null
        customization: null
  response:
    message: success
- description: Add a remote schema with a argument of a field of an object not having the same type as the same argument of the same field in interface
  url: /v1/query
  status: 400
  query:
    type: add_remote_schema
    args:
      name: err-missing-arg
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/iface-graphql-err-wrong-arg-type'
        headers: []
        forward_client_headers: true
  response:
    error: Interface field argument 'Character'."id"("ifaceArg":) expects type Int!, but 'Human'."id"("ifaceArg":) has type String!
    path: $.args
    code: remote-schema-error
