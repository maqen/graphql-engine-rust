upstream:
  file: test_schema_stitching.py
  class: TestRemoteSchemaTimeout
  method: test_remote_query_timeout
  by_hand: true
steps:
- url: /v1/query
  status: 200
  query:
    type: add_remote_schema
    args:
      name: simple 1
      comment: testing simple 1
      definition:
        url: '{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/hello-graphql'
        headers: null
        forward_client_headers: false
        timeout_seconds: 5
        customization: null
  response:
    message: success
- description: Simple GraphQL query (takes 10s to respond)
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        delayedHello(arg: "me")
      }
  response:
    errors:
    - message: HTTP exception occurred while sending the request to "{{REMOTE_SCHEMAS_WEBHOOK_DOMAIN}}/hello-graphql"
      extensions:
        path: $
        code: remote-schema-error
        internal:
          message: Response timeout
          request: '{{any}}'
          type: http_exception
