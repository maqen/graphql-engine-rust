upstream:
  file: test_subscriptions.py
  class: TestSubscriptionCtrl
  method: test_connection
  by_hand: true
steps:
- ws_connect:
    protocol: graphql-ws
- ws_send:
    message:
      type: connection_init
      payload:
        headers:
          X-Hasura-Admin-Secret: '{{HASURA_GRAPHQL_ADMIN_SECRET}}'
- ws_expect:
    message:
      type: connection_ack
- ws_send:
    message:
      type: connection_terminate
- ws_expect_close:
    code: 1000
    reason: GQL_CONNECTION_TERMINATE received
