upstream:
  file: test_subscriptions.py
  class: TestStreamingSubscription
  method: test_basic_streaming_subscription_existing_static_data
  by_hand: true
steps:
- url: /v2/query
  status: 200
  query:
    type: run_sql
    args:
      sql: INSERT INTO hge_tests.articles (id, title) VALUES (1, 'Article title 1'), (2, 'Article title 2'), (3, 'Article title 3'), (4, 'Article title 4'), (5, 'Article title 5'), (6, 'Article title 6'), (7, 'Article title 7'), (8, 'Article title 8'), (9, 'Article title 9'), (10, 'Article title 10');
  response:
    result_type: CommandOk
    result: null
- ws_connect:
    protocol: graphql-ws
- ws_send:
    message:
      type: connection_init
      payload:
        headers: {}
- ws_expect:
    message:
      type: connection_ack
- ws_send:
    message:
      id: stream_1
      type: start
      payload:
        query: |
          subscription ($batch_size: Int!) {
            hge_tests_stream_query: hge_tests_articles_stream(cursor: {initial_value: {id: 0}}, batch_size: $batch_size) {
               id
               title
            }
          }
        variables:
          batch_size: 2
- ws_expect:
    message:
      id: stream_1
      type: data
      payload:
        data:
          hge_tests_stream_query:
          - id: 1
            title: Article title 1
          - id: 2
            title: Article title 2
- ws_expect:
    message:
      id: stream_1
      type: data
      payload:
        data:
          hge_tests_stream_query:
          - id: 3
            title: Article title 3
          - id: 4
            title: Article title 4
- ws_expect:
    message:
      id: stream_1
      type: data
      payload:
        data:
          hge_tests_stream_query:
          - id: 5
            title: Article title 5
          - id: 6
            title: Article title 6
- ws_expect:
    message:
      id: stream_1
      type: data
      payload:
        data:
          hge_tests_stream_query:
          - id: 7
            title: Article title 7
          - id: 8
            title: Article title 8
- ws_expect:
    message:
      id: stream_1
      type: data
      payload:
        data:
          hge_tests_stream_query:
          - id: 9
            title: Article title 9
          - id: 10
            title: Article title 10
- ws_send:
    message:
      id: stream_1
      type: stop
- ws_expect_silence:
    ms: 2000
