description: ids within a tie are unordered upstream, so only the cursor column is selected
upstream:
  file: test_subscriptions.py
  class: TestStreamingSubscriptionWithTies
  method: test_streaming_subscription_with_duplicate_cursor_values
  by_hand: true
steps:
- url: /v2/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        ALTER TABLE hge_tests.articles ADD COLUMN IF NOT EXISTS priority INT;
        DELETE FROM hge_tests.articles;
        INSERT INTO hge_tests.articles (id, priority) VALUES (7, 1), (6, 2), (5, 2), (4, 2), (1, 3), (2, 4), (3, 5);
  response:
    result_type: CommandOk
    result: null
- url: /v1/metadata
  status: 200
  query:
    type: reload_metadata
    args: {}
  response:
    is_consistent: true
    message: success
- ws_connect:
    protocol: graphql-ws
- ws_send:
    message:
      type: connection_init
      payload:
        headers: {}
- ws_expect:
    message:
      type: connection_ack
- ws_send:
    message:
      id: stream_test
      type: start
      payload:
        query: |
          subscription ($batch_size: Int!) {
            stream_data: hge_tests_articles_stream(
              cursor: [{initial_value: {priority: 0}, ordering: ASC}],
              batch_size: $batch_size
            ) {
              priority
            }
          }
        variables:
          batch_size: 2
- ws_expect:
    message:
      id: stream_test
      type: data
      payload:
        data:
          stream_data:
          - priority: 1
          - priority: 2
          - priority: 2
          - priority: 2
- ws_expect:
    message:
      id: stream_test
      type: data
      payload:
        data:
          stream_data:
          - priority: 3
          - priority: 4
- ws_expect:
    message:
      id: stream_test
      type: data
      payload:
        data:
          stream_data:
          - priority: 5
- ws_send:
    message:
      id: stream_test
      type: stop
- ws_expect_silence:
    ms: 2000
