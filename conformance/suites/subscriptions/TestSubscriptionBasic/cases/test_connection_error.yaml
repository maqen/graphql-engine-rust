upstream:
  file: test_subscriptions.py
  class: TestSubscriptionBasic
  method: test_connection_error
  by_hand: true
steps:
- ws_connect:
    protocol: graphql-ws
- ws_send:
    message:
      type: connection_init
      payload:
        headers:
          X-Hasura-Admin-Secret: '{{HASURA_GRAPHQL_ADMIN_SECRET}}'
- ws_expect:
    message:
      type: connection_ack
- ws_send:
    message:
      type: test
- ws_expect:
    message:
      type: connection_error
      payload: '{{any string}}'
