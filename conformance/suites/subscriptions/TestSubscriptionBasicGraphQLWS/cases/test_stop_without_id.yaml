upstream:
  file: test_subscriptions.py
  class: TestSubscriptionBasicGraphQLWS
  method: test_stop_without_id
  by_hand: true
steps:
- ws_connect:
    protocol: graphql-transport-ws
- ws_send:
    message:
      type: connection_init
      payload:
        headers:
          X-Hasura-Admin-Secret: '{{HASURA_GRAPHQL_ADMIN_SECRET}}'
- ws_expect:
    message:
      type: connection_ack
- ws_send:
    message:
      type: complete
- ws_expect_close:
    code: 4400
