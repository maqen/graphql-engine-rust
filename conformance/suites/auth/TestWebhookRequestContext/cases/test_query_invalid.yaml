upstream:
  by_hand: true
  file: test_webhook_request_context.py
  class: TestWebhookRequestContext
  method: test_query_invalid
admin_secret_header: false
steps:
- url: /v1/graphql
  status: 200
  headers:
    auth-user-id: '1'
