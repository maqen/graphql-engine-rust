upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEsAndCookie
  method: test_jwt_no_default_role
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Cookie: hasura_user=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImh0dHBzOi8vaGFzdXJhLmlvL2p3dC9jbGFpbXMiOnsieC1oYXN1cmEtdXNlci1pZCI6IjEiLCJ4LWhhc3VyYS1hbGxvd2VkLXJvbGVzIjpbInVzZXIiXX19.bLIv1ZLvwrbom4NDZglw2B0s8WJhCtbVg3uHnhub4wzX3lZhdet9sv06x6Mz7WDadAiR1uUUfUh5o6BNrxGNQw
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: JWT claim does not contain "x-hasura-default-role"
      extensions:
        path: $
        code: jwt-missing-role-claims
