upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEd25519AndStringifiedJsonClaims
  method: test_jwt_invalid_role_in_request_header
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..Kh7aQGYqfd38KrFSsKEJ3sL2a8XaslrSGGlNy8OYnEkuiIrrFDt87Ktz7uhxFVVuftaIdSPlJXPcpbcXXH57CA
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: Your requested role is not in allowed roles
      extensions:
        path: $
        code: access-denied
