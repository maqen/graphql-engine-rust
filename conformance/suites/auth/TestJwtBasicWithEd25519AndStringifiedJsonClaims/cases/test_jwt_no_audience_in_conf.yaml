upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEd25519AndStringifiedJsonClaims
  method: test_jwt_no_audience_in_conf
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..Ki9-EPmRwGOU2BK1GVxhf64Il64a77pgXdrp0wCdWeVfQOv3HyEMb8XsPfQrjbxqKn_-IQOtk9N_jx9ki4AECA
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 1
        title: Article 1
        content: Sample article content 1
        is_published: false
        author:
          id: 1
          name: Author 1
