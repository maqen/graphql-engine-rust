    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsIngtaGFzdXJhLXVzZXItaWQiOiIxIiwieC1oYXN1cmEtZGVmYXVsdC1yb2xlIjoidXNlciJ9.7OFg0sfDt1g6iNwwfJEL0Ckvj4OW2qiaori6atfMAAvk1GG7LQzT_OUEPGERF58bPAqRbdZ8tUqyjUWQ1mj8CA
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: JWT claim does not contain "x-hasura-allowed-roles"
