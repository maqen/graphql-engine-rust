upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEd25519AndClaimsNamespacePathAtRoot
  method: test_jwt_no_default_role
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsIngtaGFzdXJhLXVzZXItaWQiOiIxIiwieC1oYXN1cmEtYWxsb3dlZC1yb2xlcyI6WyJ1c2VyIl19.Ye6he2KssVIJ0jJjYgAOnS674loHa-Yc5jGupUpd0QQL4RumHG3sCRpsxPDANc8-McZPt_n9aW0ccvQL04hWAg
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: JWT claim does not contain "x-hasura-default-role"
      extensions:
        path: $
        code: jwt-missing-role-claims
