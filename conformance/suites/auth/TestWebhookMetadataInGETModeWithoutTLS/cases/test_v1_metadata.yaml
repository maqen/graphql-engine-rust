upstream:
  by_hand: true
  file: test_webhook.py
  class: TestWebhookMetadataInGETModeWithoutTLS
  method: test_v1_metadata
steps:
- url: /v1/metadata
  status: 200
  query:
    type: export_metadata
    args: {}
  response:
    version: 3
    sources:
    - name: default
      kind: postgres
      tables:
      - table:
          name: article
          schema: public
        object_relationships:
        - name: author
          using:
            foreign_key_constraint_on: author_id
      - table:
          name: author
          schema: public
        array_relationships:
        - name: articles
          using:
            foreign_key_constraint_on:
              column: author_id
              table:
                name: article
                schema: public
        select_permissions:
        - role: user
          permission:
            columns:
            - name
            filter: {}
      - table:
          name: user
          schema: public
      configuration:
        connection_info:
          database_url:
            from_env: HASURA_GRAPHQL_DATABASE_URL
          isolation_level: read-committed
          use_prepared_statements: false
