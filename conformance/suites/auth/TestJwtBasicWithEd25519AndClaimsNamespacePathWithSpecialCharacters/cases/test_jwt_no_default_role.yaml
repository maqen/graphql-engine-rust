upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEd25519AndClaimsNamespacePathWithSpecialCharacters
  method: test_jwt_no_default_role
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImhhc3VyYSI6eyJjbGFpbXMlIjp7IngtaGFzdXJhLXVzZXItaWQiOiIxIiwieC1oYXN1cmEtYWxsb3dlZC1yb2xlcyI6WyJ1c2VyIl19fX0.TAATbmSwufT6ToA7X8Ckd9SYb7GG4DHwCfjY_3TqWuQ5t7epGykaaRVWDjtn6u5hbTFQ1bJjctmaUjl47tvgAg
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: JWT claim does not contain "x-hasura-default-role"
      extensions:
        path: $
        code: jwt-missing-role-claims
