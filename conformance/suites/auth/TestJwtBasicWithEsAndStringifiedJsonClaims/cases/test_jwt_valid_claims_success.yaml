- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImh0dHBzOi8vaGFzdXJhLmlvL2p3dC9jbGFpbXMiOiJ7XCJ4LWhhc3VyYS11c2VyLWlkXCI6IFwiMVwiLCBcIngtaGFzdXJhLWFsbG93ZWQtcm9sZXNcIjogW1widXNlclwiLCBcImVkaXRvclwiXSwgXCJ4LWhhc3VyYS1kZWZhdWx0LXJvbGVcIjogXCJ1c2VyXCJ9In0.XbwHQLngmEUanF4OWqd196h-i3qHZVFTE2cxIJ-qw7-DryUzIvicIlSJr3sn0U4If7kyck8no-mDlu7C7pRcXg
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 1
        title: Article 1
        content: Sample article content 1
        is_published: false
        author:
          id: 1
          name: Author 1
