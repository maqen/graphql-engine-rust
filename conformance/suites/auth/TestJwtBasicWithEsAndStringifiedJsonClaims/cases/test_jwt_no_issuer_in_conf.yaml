upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEsAndStringifiedJsonClaims
  method: test_jwt_no_issuer_in_conf
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..4HXQDdoMghuyHtsTwPWWnYk7eaGKKh7xxP_2ntUa7qtEjb948v1qhbPzn3d1Fbcb00m635u-oy90bp4p61VaXQ
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 1
        title: Article 1
        content: Sample article content 1
        is_published: false
        author:
          id: 1
          name: Author 1
