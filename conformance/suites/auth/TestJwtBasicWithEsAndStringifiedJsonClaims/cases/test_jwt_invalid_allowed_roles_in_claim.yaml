  method: test_jwt_invalid_allowed_roles_in_claim
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImh0dHBzOi8vaGFzdXJhLmlvL2p3dC9jbGFpbXMiOiJ7XCJ4LWhhc3VyYS11c2VyLWlkXCI6IFwiMVwiLCBcIngtaGFzdXJhLWFsbG93ZWQtcm9sZXNcIjogXCJ1c2VyXCIsIFwieC1oYXN1cmEtZGVmYXVsdC1yb2xlXCI6IFwidXNlclwifSJ9.k5aD48ly7wJ2u1aubeAv4qvFlpQtfKG-OB5k2PSB_ZAXZmwtQZ8uVm_srloobzxhxqzELLT4jgqFP38prfIZjQ
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: 'invalid "x-hasura-allowed-roles"; should be a list of roles: parsing [] failed, expected Array, but encountered String'
      extensions:
        path: $
        code: jwt-invalid-claims
