- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImh0dHBzOi8vbXlhcHAuY29tL2p3dC9jbGFpbXMiOnsidXNlciI6eyJpZCI6IjEifX19.-E1ywXEf4Pt0e_yZDi_zHC_Wi9-rpL9uS2z378I-G7JlBqqEUj5OrAZLqFKnDoHGxrV3K74vIou5b01oJrDJAw
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
    x-hasura-custom-header: custom-value
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 1
        title: Article 1
        content: Sample article content 1
        is_published: false
        author:
          id: 1
          name: Author 1
