upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEd25519AndCookie
  method: test_jwt_no_allowed_roles_in_claim
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Cookie: hasura_user=eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjQxMDI0NDQ4MDAsImh0dHBzOi8vaGFzdXJhLmlvL2p3dC9jbGFpbXMiOnsieC1oYXN1cmEtdXNlci1pZCI6IjEiLCJ4LWhhc3VyYS1kZWZhdWx0LXJvbGUiOiJ1c2VyIn19.KDxnHHETEr-xgWEdlUAeSZlpcJ55o904m5J_TPevPCdgujyBukVZFi1lkUsXxK6vjJJIW8T9gPvNmmCcpM6QAA
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: JWT claim does not contain "x-hasura-allowed-roles"
      extensions:
        path: $
        code: jwt-missing-role-claims
