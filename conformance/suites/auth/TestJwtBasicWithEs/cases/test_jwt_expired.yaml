upstream:
  by_hand: true
  file: test_jwt.py
  class: TestJwtBasicWithEs
  method: test_jwt_expired
admin_secret_header: false
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    Authorization: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjE3MDAwMDAwNjAsImh0dHBzOi8vaGFzdXJhLmlvL2p3dC9jbGFpbXMiOnsieC1oYXN1cmEtdXNlci1pZCI6IjEiLCJ4LWhhc3VyYS1kZWZhdWx0LXJvbGUiOiJ1c2VyIiwieC1oYXN1cmEtYWxsb3dlZC1yb2xlcyI6WyJ1c2VyIl19fQ.mUYwXjMA0DDlVU3mSVEHJSOW5USw9Wz62I_i9weCiiPmzpNvh24AAoht3RCw90xzuoHVKt1fLs-2jZx3spV4Aw
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        article (
          where: { is_published : {_eq : false}}
        ) {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    errors:
    - message: 'Could not verify JWT: JWTExpired'
      extensions:
        path: $
        code: invalid-jwt
