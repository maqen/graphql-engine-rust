upstream:
  file: test_graphql_queries.py
  class: TestGraphQLInheritedRolesPostgres
  method: test_basic_inherited_role
  fixtures:
  - queries/graphql_query/permissions/inherited_roles/basic_inherited_roles.yaml
steps:
- description: column not accessible to any of the roles should not be accessible to the inherited role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-User-Id: '1'
    X-Hasura-Manager-Id: '2'
  query:
    query: |
      query {
        employee {
          name
          title
          manager_remarks
          hr_remarks
        }
      }
  response:
    errors:
    - message: 'field ''hr_remarks'' not found in type: ''employee'''
      extensions:
        path: $.selectionSet.employee.selectionSet.hr_remarks
        code: validation-failed
- description: check when a role doesn't have access to a certain column in a row, it should be `null`
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-User-Id: '1'
    X-Hasura-Manager-Id: '1'
  query:
    query: |
      query {
        employee {
          id
          name
          title
          salary
          manager_remarks
        }
      }
  response:
    data:
      employee:
      - id: 1
        name: employee 1
        title: Sales representative
        salary: 10000
        manager_remarks: good
      - id: null
        name: employee 2
        title: Sales representative
        salary: null
        manager_remarks: good
- description: Check if appropriate permissions are applied to the relationship field as well
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-User-Id: '1'
    X-Hasura-Manager-Id: '2'
  query:
    query: |
      query {
        employee {
          name
          title
          salary
          manager_remarks
          manager {
            id
            name
            phone
            address
          }
        }
      }
  response:
    data:
      employee:
      - name: employee 1
        title: Sales representative
        salary: 10000
        manager_remarks: null
        manager: null
      - name: employee 4
        title: Sales representative
        salary: null
        manager_remarks: hard working
        manager:
          id: 2
          name: sales manager 2
          phone: '9977223344'
          address: buena vista
- description: Allow aggregation to the inherited role even if one of the parent role allows aggregation
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-Manager-Id: '2'
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        employee_aggregate {
          aggregate {
            count
            sum {
              salary
            }
          }
        }
      }
  response:
    data:
      employee_aggregate:
        aggregate:
          count: 2
          sum:
            salary: 10000
- description: computed fields should only be accessible to the inherited role to the rows it has access
    to
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-Manager-Id: '2'
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        employee {
          salary
          yearly_salary
        }
      }
  response:
    data:
      employee:
      - salary: 10000
        yearly_salary: 120000
      - salary: null
        yearly_salary: null
- description: query multiple tables using an inherited role, even when one of the role doesn't have select
    permission to one of the table
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: manager_employee
    X-Hasura-Manager-Id: '2'
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        employee {
          name
          salary
        }
        manager {
          team_id
          name
        }
      }
  response:
    data:
      employee:
      - name: employee 1
        salary: 10000
      - name: employee 4
        salary: null
      manager:
      - team_id: 1
        name: sales manager 2
- description: The limits of the role should be combined to be the max of the limits of the rows. The
    'non_paying_user' inherited role is created out of the 'free_user' role which has limit set to 2 and
    the 'premium_user_free_trial' role which has limit set to 4. So 4 rows are expected to be returned
    for the inherited role.
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: non_paying_user
  query:
    query: |
      query {
        articles {
          title
        }
      }
  response:
    data:
      articles:
      - title: title 2
      - title: title 3
      - title: title 4
      - title: title 5
