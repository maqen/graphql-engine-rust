upstream:
  file: test_roles_inheritance.py
  class: TestActionsPermissionInheritance
  method: test_override_inherited_permission
  fixtures:
  - queries/actions/roles_inheritance/override_inherited_permission.yaml
steps:
- description: Query the action with the inherited role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: inherited_role2
  query:
    query: |
      mutation {
        create_user (name: "bob", email: "bob@hasura.io") {
          id
        }
      }
  response:
    errors:
    - message: no mutations exist
      extensions:
        path: $
        code: validation-failed
- description: Add permission to role which will override the inherited permission
  url: /v1/metadata
  status: 200
  query:
    type: create_action_permission
    args:
      role: inherited_role2
      action: create_user
  response:
    message: success
- description: Query the action with the inherited role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: inherited_role2
  query:
    query: |
      mutation {
        create_user (name: "bob", email: "bob@hasura.io") {
          id
        }
      }
  response:
    data:
      create_user:
        id: 1
- description: Drop the overridden permission which was added
  url: /v1/metadata
  status: 200
  query:
    type: drop_action_permission
    args:
      role: inherited_role2
      action: create_user
  response:
    message: success
