upstream:
  file: test_graphql_queries.py
  class: TestGraphqlQueryPermissions
  method: test_iregex
  fixtures:
  - queries/graphql_query/permissions/iregex.yaml
steps:
- description: user can only select artists having name matching X-Hasura-iregex-artists
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user_iregex
    X-Hasura-iregex-artists: (.*ak)|(.*lla)
  query:
    query: |
      query {
        Artist (order_by: {name: asc}) {
          name
        }
      }
  response:
    data:
      Artist:
      - name: Akon
      - name: Camilla
