upstream:
  file: test_graphql_queries.py
  class: TestGraphqlQueryPermissions
  method: test_anonymous_only_published_articles_v1alpha1
  fixtures:
  - queries/graphql_query/permissions/anonymous_can_only_get_published_articles_v1alpha1.yaml
steps:
- description: Other Users cannot see unpublished articles
  url: /v1alpha1/graphql
  status: 200
  headers:
    X-Hasura-Role: anonymous
  query:
    query: "query {\n  article ( \n    where: { is_published: {_eq: false}}\n  )  {\n    id\n    title\n\
      \    content\n    is_published\n    author {\n      id\n      name\n    }\n  }\n}\n"
  response:
    data:
      article: []
- description: Other Users can only see published articles
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: anonymous
  query:
    query: |
      query {
        article {
          id
          title
          content
          is_published
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 2
        title: Article 2
        content: Sample article content 2
        is_published: true
        author:
          id: 1
          name: Author 1
      - id: 3
        title: Article 3
        content: Sample article content 3
        is_published: true
        author:
          id: 2
          name: Author 2
