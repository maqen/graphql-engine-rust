upstream:
  file: test_graphql_queries.py
  class: TestGraphqlQueryPermissions
  method: test_author_articles_without_required_headers_set
  fixtures:
  - queries/graphql_query/permissions/select_articles_without_required_headers.yaml
steps:
- description: Select related articles while querying authors, but without setting the headers required
    for selecting articles
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: critic
  query:
    query: |
      query {
        author {
          name
          articles {
            title
            content
            is_published
          }
        }
      }
  response:
    errors:
    - message: 'missing session variable: "x-hasura-critic-id"'
      extensions:
        path: $
        code: not-found
- description: Select related articles while querying authors with a role which doesn't require any headers
    to be set to query articles
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: anonymous
  query:
    query: |
      query {
        author {
          name
          articles {
            title
            content
            is_published
          }
        }
      }
  response:
    data:
      author:
      - name: Author 1
        articles:
        - title: Article 2
          content: Sample article content 2
          is_published: true
      - name: Author 2
        articles:
        - title: Article 3
          content: Sample article content 3
          is_published: true
