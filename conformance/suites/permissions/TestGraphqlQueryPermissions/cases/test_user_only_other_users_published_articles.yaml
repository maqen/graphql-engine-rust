upstream:
  file: test_graphql_queries.py
  class: TestGraphqlQueryPermissions
  method: test_user_only_other_users_published_articles
  fixtures:
  - queries/graphql_query/permissions/user_can_query_other_users_published_articles.yaml
steps:
- description: User can only get his unpublished articles
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: "query {\n  article (\n    where: { _and: \n      [ { is_published : {_eq : true}}\n      \
      \  { author : { id : {_neq : 1}}}\n      ]\n    }\n  ) {\n    id\n    title\n    content\n    is_published\n\
      \    author {\n      id\n      name\n    }\n  }\n}\n"
  response:
    data:
      article:
      - id: 3
        title: Article 3
        content: Sample article content 3
        is_published: true
        author:
          id: 2
          name: Author 2
