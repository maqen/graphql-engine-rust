upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryAggPermPostgres
  method: test_article_agg_with_select_access
  fixtures:
  - queries/graphql_query/agg_perm/article_agg_with_role_with_select_access.yaml
steps:
- description: The 'columns' argument to 'count' should be exposed, as the role has select access to the
    cols
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: role_with_access_to_cols
  query:
    query: |
      query {
        article_aggregate {
          aggregate {
            count(columns:[title,content])
          }
        }
      }
  response:
    data:
      article_aggregate:
        aggregate:
          count: 3
- description: The aggregate functions that use column data should be exposed, as the role has select
    access to them
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: role_with_access_to_cols
  query:
    query: |
      query {
        article_aggregate {
          aggregate {
            max {
              id
            }
          }
        }
      }
  response:
    data:
      article_aggregate:
        aggregate:
          max:
            id: 3
