upstream:
  file: test_roles_inheritance.py
  class: TestNestedInheritedRolesSelectPermissions
  method: test_nested_inherited_roles_column_permissions
  fixtures:
  - queries/graphql_query/permissions/roles_inheritance/nested_inherited_roles_column_permissions.yaml
steps:
- description: Test column permissions with base_role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: base_role
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        users {
          id
          name
          restricted_field
        }
      }
  response:
    data:
      users:
      - id: 1
        name: User 1
        restricted_field: Allowed Data 1
      - id: 2
        name: User 2
        restricted_field: null
      - id: 3
        name: User 3
        restricted_field: null
- description: Test column permissions with nested_role (should inherit base_role's column permissions)
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: nested_role
    X-Hasura-User-Id: '1'
  query:
    query: |
      query {
        users {
          id
          name
          restricted_field
        }
      }
  response:
    data:
      users:
      - id: 1
        name: User 1
        restricted_field: Allowed Data 1
      - id: 2
        name: User 2
        restricted_field: null
      - id: 3
        name: User 3
        restricted_field: null
