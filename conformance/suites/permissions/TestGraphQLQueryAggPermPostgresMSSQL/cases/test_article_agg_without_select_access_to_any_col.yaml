upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryAggPermPostgresMSSQL
  method: test_article_agg_without_select_access_to_any_col
  fixtures:
  - queries/graphql_query/agg_perm/article_agg_with_role_without_select_access.yaml
steps:
- description: User can query for the count of the rows without having select access
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: role_without_access_to_cols
  query:
    query: |
      query {
        article_aggregate {
          aggregate {
            count
          }
        }
      }
  response:
    data:
      article_aggregate:
        aggregate:
          count: 3
- description: The 'columns' argument to 'count' should not be exposed, because the role doesn't have
    access
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: role_without_access_to_cols
  query:
    query: |
      query {
        article_aggregate {
          aggregate {
            count(columns:[title,content])
          }
        }
      }
  response:
    errors:
    - message: '''count'' has no argument named ''columns'''
      extensions:
        path: $.selectionSet.article_aggregate.selectionSet.aggregate.selectionSet.count
        code: validation-failed
- description: The aggregate functions that use column data should not be exposed
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: role_without_access_to_cols
  query:
    query: |
      query {
        article_aggregate {
          aggregate {
            max {
              published_on
            }
          }
        }
      }
  response:
    errors:
    - message: 'field ''max'' not found in type: ''article_aggregate_fields'''
      extensions:
        path: $.selectionSet.article_aggregate.selectionSet.aggregate.selectionSet.max
        code: validation-failed
