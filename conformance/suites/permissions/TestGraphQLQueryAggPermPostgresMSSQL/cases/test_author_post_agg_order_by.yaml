upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryAggPermPostgresMSSQL
  method: test_author_post_agg_order_by
  fixtures:
  - queries/graphql_query/agg_perm/author_post_agg_order_by.yaml
steps:
- description: Query author along with posts with order by posts count
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
  query:
    query: |
      query {
        author(order_by: {posts_aggregate: {count: asc}}){
          id
          name
          posts{
            id
            title
            content
          }
        }
      }
  response:
    data:
      author:
      - id: 2
        name: Author 2
        posts:
        - id: 4
          title: Post 4
          content: Post 4 Content
