upstream:
  file: test_events.py
  class: TestEventRetryConfPostgresMSSQL
  method: test_basic
  by_hand: true
steps:
- description: drop deliveries left by earlier cases
  url: '{{helper:events_webhook}}/__reset'
  status: 200
  response:
    dropped: '{{any}}'
- url: /v1/query
  status: 200
  query:
    type: insert
    args:
      table:
        schema: hge_tests
        name: test_t1
      objects:
      - c1: 1
        c2: hello
      returning: []
  response:
    returning:
    - {}
    affected_rows: 1
- description: INSERT event of t1_retry
  url: '{{helper:events_webhook}}/__next_event?timeout=3'
  status: 200
  response:
    path: /fail
    body:
      created_at: '{{any}}'
      delivery_info:
        current_retry: 0
        max_retries: 4
      event:
        data:
          new:
            c1: 1
            c2: hello
          old: null
        op: INSERT
        session_variables:
          x-hasura-role: admin
        trace_context: '{{any}}'
      id: '{{any}}'
      table:
        name: test_t1
        schema: hge_tests
      trigger:
        name: t1_retry
    headers: {}
- description: INSERT event of t1_retry (retry 1)
  url: '{{helper:events_webhook}}/__next_event?timeout=3'
  status: 200
  response:
    path: /fail
    body:
      created_at: '{{any}}'
      delivery_info:
        current_retry: 1
        max_retries: 4
      event:
        data:
          new:
            c1: 1
            c2: hello
          old: null
        op: INSERT
        session_variables:
