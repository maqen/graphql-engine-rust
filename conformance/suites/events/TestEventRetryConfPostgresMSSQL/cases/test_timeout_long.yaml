upstream:
  file: test_events.py
  class: TestEventRetryConfPostgresMSSQL
  method: test_timeout_long
  by_hand: true
steps:
- description: drop deliveries left by earlier cases
  url: '{{helper:events_webhook}}/__reset'
  status: 200
  response:
    dropped: '{{any}}'
- url: /v1/query
  status: 200
  query:
    type: insert
    args:
      table:
        schema: hge_tests
        name: test_t3
      objects:
      - c1: 1
        c2: hello
      returning: []
  response:
    returning:
    - {}
    affected_rows: 1
- description: INSERT event of t3_timeout_long
  url: '{{helper:events_webhook}}/__next_event?timeout=5'
  status: 200
  response:
    path: /sleep_2s
    body:
      created_at: '{{any}}'
      delivery_info:
        current_retry: 0
        max_retries: 0
      event:
        data:
          new:
            c1: 1
            c2: hello
          old: null
        op: INSERT
        session_variables:
          x-hasura-role: admin
        trace_context: '{{any}}'
      id: '{{any}}'
      table:
        name: test_t3
        schema: hge_tests
      trigger:
        name: t3_timeout_long
    headers: {}
- description: no event
  url: '{{helper:events_webhook}}/__next_event?timeout=3'
  status: 404
  response:
    error: no event
