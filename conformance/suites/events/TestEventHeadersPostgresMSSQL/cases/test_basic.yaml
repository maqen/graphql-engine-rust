upstream:
  file: test_events.py
  class: TestEventHeadersPostgresMSSQL
  method: test_basic
  by_hand: true
steps:
- description: drop deliveries left by earlier cases
  url: '{{helper:events_webhook}}/__reset'
  status: 200
  response:
    dropped: '{{any}}'
- url: /v1/query
  status: 200
  query:
    type: insert
    args:
      table:
        schema: hge_tests
        name: test_t1
      objects:
      - c1: 1
        c2: hello
      returning: []
  response:
    returning:
    - {}
    affected_rows: 1
- description: INSERT event of t1_all
  url: '{{helper:events_webhook}}/__next_event?timeout=3&headers=X-Header-From-Value,X-Header-From-Env'
  status: 200
  response:
    path: /
    body:
      created_at: '{{any}}'
      delivery_info:
        current_retry: 0
        max_retries: 0
      event:
        data:
          new:
            c1: 1
            c2: hello
          old: null
        op: INSERT
        session_variables:
          x-hasura-role: admin
        trace_context: '{{any}}'
      id: '{{any}}'
      table:
        name: test_t1
        schema: hge_tests
      trigger:
        name: t1_all
    headers:
      X-Header-From-Value: MyValue
      X-Header-From-Env: MyEnvValue
