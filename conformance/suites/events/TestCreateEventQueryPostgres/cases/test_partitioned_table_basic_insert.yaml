upstream:
  file: test_events.py
  class: TestCreateEventQueryPostgres
  method: test_partitioned_table_basic_insert
  by_hand: true
steps:
- description: drop deliveries left by earlier cases
  url: '{{helper:events_webhook}}/__reset'
  status: 200
  response:
    dropped: '{{any}}'
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: run_sql
      args:
        sql: |
          CREATE TABLE hge_tests.measurement (
              city_id         int not null,
              logdate         date not null,
              peaktemp        int,
              unitsales       int
          ) PARTITION BY RANGE (logdate);

          CREATE TABLE hge_tests.measurement_y2006m02 PARTITION OF hge_tests.measurement
              FOR VALUES FROM ('2006-02-01') TO ('2006-03-01');

          CREATE TABLE hge_tests.measurement_y2006m03 PARTITION OF hge_tests.measurement
              FOR VALUES FROM ('2006-03-01') TO ('2006-04-01');
    - type: track_table
      args:
        schema: hge_tests
        name: measurement
    - type: create_event_trigger
      args:
        name: measurement_all
        table:
          schema: hge_tests
          name: measurement
        insert:
          columns: '*'
        update:
          columns: '*'
        delete:
          columns: '*'
        webhook: '{{EVENT_WEBHOOK_HANDLER}}'
  response:
  - result_type: CommandOk
    result: null
  - message: success
  - message: success
- url: /v1/query
  status: 200
  query:
    type: insert
    args:
      table:
        schema: hge_tests
        name: measurement
      objects:
      - city_id: 1
        logdate: 2006-02-02
        peaktemp: 1
        unitsales: 1
      returning: []
  response:
    returning:
    - {}
    affected_rows: 1
- description: INSERT event of measurement_all
  url: '{{helper:events_webhook}}/__next_event?timeout=3'
  status: 200
  response:
    path: /
    body:
      created_at: '{{any}}'
      delivery_info:
        current_retry: 0
        max_retries: 0
      event:
        data:
          new:
            city_id: 1
            logdate: 2006-02-02
            peaktemp: 1
            unitsales: 1
          old: null
        op: INSERT
        session_variables:
          x-hasura-role: admin
        trace_context: '{{any}}'
      id: '{{any}}'
      table:
        name: measurement
        schema: hge_tests
      trigger:
        name: measurement_all
    headers: {}
- url: /v1/query
  status: 200
  query:
    type: bulk
    args:
    - type: delete_event_trigger
      args:
        name: measurement_all
    - type: run_sql
      args:
        sql: |
          drop table hge_tests.measurement;
  response:
  - message: success
  - result_type: CommandOk
    result: null
