upstream:
  file: test_graphql_introspection.py
  class: TestGraphQlIntrospectionDescriptions
  method: test_explicit_no_comment_in_metadata
  fixtures:
  - queries/graphql_introspection/descriptions/explicit_no_comment_in_metadata.yaml
steps:
- description: GraphQL introspection query
  url: /v1/graphql
  status: 200
  query:
    query: |
      query IntrospectionQuery {
        __type(name: "explicit_no_comment_in_metadata") {
          name
          description
          kind
          fields {
            name
            description
          }
        }
      }
  response:
    data:
      __type:
        name: explicit_no_comment_in_metadata
        description: null
        kind: OBJECT
        fields:
        - name: id
          description: null
        - name: name
          description: null
        - name: upper_name
          description: null
