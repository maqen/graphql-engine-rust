upstream:
  file: test_v1_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_ancestor
  fixtures:
  - queries/v1/select/boolexp/ltree/select_path_where_ancestor.yaml
steps:
- description: Select ancestors of an `ltree` argument
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $ancestor: Tree.Collections.Pictures.Astronomy.Astronauts
      columns:
      - path
  response:
  - path: Tree
  - path: Tree.Collections
  - path: Tree.Collections.Pictures
  - path: Tree.Collections.Pictures.Astronomy
  - path: Tree.Collections.Pictures.Astronomy.Astronauts
- description: Select ancestors of an invalid `ltree` argument
  url: /v1/query
  status: 400
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $ancestor: Tree.Collections.Pictures.Astronomy.Astronauts.
      columns:
      - path
  response:
    error: 'Expecting label path: a sequence of zero or more labels separated by dots, for example L1.L2.L3'
    path: $.args.where.path["$ancestor"]
    code: parse-failed
