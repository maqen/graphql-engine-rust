upstream:
  file: test_v1_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_ancestor_array
  fixtures:
  - queries/v1/select/boolexp/ltree/select_path_where_ancestor_array.yaml
steps:
- description: Select ancestors of an array of `ltree` arguments
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $ancestor_any:
          - Tree.Collections.Pictures
          - Tree.Hobbies
      columns:
      - path
  response:
  - path: Tree
  - path: Tree.Hobbies
  - path: Tree.Collections
  - path: Tree.Collections.Pictures
- description: Select ancestors of an array of invalid `ltree` arguments
  url: /v1/query
  status: 400
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $ancestor_any:
          - Tree.Collections.Pictures.
      columns:
      - path
  response:
    error: 'Expecting label path: a sequence of zero or more labels separated by dots, for example L1.L2.L3'
    path: $.args.where.path["$ancestor_any"][0]
    code: parse-failed
