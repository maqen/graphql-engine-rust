upstream:
  file: test_v1_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_matches_ltxtquery
  fixtures:
  - queries/v1/select/boolexp/ltree/select_path_where_matches_ltxtquery.yaml
steps:
- description: Select `ltree` paths matching an `ltxtquery` full text query
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $matches_fulltext: Astro*% & !pictures@
      columns:
      - path
  response:
  - path: Tree.Science.Astronomy
  - path: Tree.Science.Astronomy.Astrophysics
  - path: Tree.Science.Astronomy.Cosmology
  - path: Tree.Hobbies.Amateurs_Astronomy
- description: Select `ltree` paths matching an invalid `ltxtquery` full text query
  url: /v1/query
  status: 500
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $matches_fulltext: Astro*% & !pictures@\
      columns:
      - path
  response:
    error: database query error
    path: $.args
    code: unexpected
    internal:
      arguments:
      - (Oid 25,Just ("Astro*% & !pictures@\\",Binary))
      error:
        description: null
        exec_status: FatalError
        hint: null
        message: syntax error
        status_code: '42601'
      prepared: true
      statement: 'SELECT  coalesce(json_agg("root" ), ''[]'' ) AS "root" FROM  (SELECT  row_to_json((SELECT  "_e"  FROM  (SELECT  "_root.base"."path"
        AS "path"       ) AS "_e"      ) ) AS "root" FROM  (SELECT  *  FROM "public"."tree"  WHERE (("public"."tree"."path")
        @ (($1)::ltxtquery))     ) AS "_root.base"      ) AS "_root"      '
