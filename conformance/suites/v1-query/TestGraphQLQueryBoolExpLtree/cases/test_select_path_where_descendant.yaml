upstream:
  file: test_v1_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_descendant
  fixtures:
  - queries/v1/select/boolexp/ltree/select_path_where_descendant.yaml
steps:
- description: Select descendants of an `ltree` argument
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: tree
      where:
        path:
          $descendant: Tree.Science
      columns:
      - path
  response:
  - path: Tree.Science
  - path: Tree.Science.Astronomy
  - path: Tree.Science.Astronomy.Astrophysics
  - path: Tree.Science.Astronomy.Cosmology
