upstream:
  file: test_v1_queries.py
  class: TestV1SelectLimits
  method: test_err_str_limit_error
  fixtures:
  - queries/v1/select/limits/select_query_article_string_limit_error.yaml
steps:
- description: Nested select on article with limit expecting error
  url: /v1/query
  status: 400
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - content
      - name: author
        columns:
        - id
        - name
      order_by: -id
      limit: '3'
  response:
    error: parsing Int failed, expected Number, but encountered String
    path: $.args.limit
    code: parse-failed
