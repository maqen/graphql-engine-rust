upstream:
  file: test_v1_queries.py
  class: TestV1SelectLimits
  method: test_limit_2
  fixtures:
  - queries/v1/select/limits/select_query_article_limit_2.yaml
steps:
- description: Nested select on article with limit
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns: &id001
      - id
      - title
      - content
      - name: author
        columns:
        - id
        - name
      order_by: -id
      limit: 2
  response:
  - id: 3
    title: Article 3
    content: Sample article content 3
    author:
      id: 2
      name: Author 2
  - id: 2
    title: Article 2
    content: Sample article content 2
    author:
      id: 1
      name: Author 1
- description: Nested select on article with limit
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns: *id001
      order_by:
      - type: desc
        column: id
      limit: 2
  response:
  - id: 3
    title: Article 3
    content: Sample article content 3
    author:
      id: 2
      name: Author 2
  - id: 2
    title: Article 2
    content: Sample article content 2
    author:
      id: 1
      name: Author 1
