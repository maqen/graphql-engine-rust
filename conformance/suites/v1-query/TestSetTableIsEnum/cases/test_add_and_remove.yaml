upstream:
  file: test_v1_queries.py
  class: TestSetTableIsEnum
  method: test_add_and_remove
  fixtures:
  - queries/v1/set_table_is_enum/add_and_remove.yaml
steps:
- description: Mark a valid enum table as an enum
  url: /v1/query
  status: 200
  query:
    type: set_table_is_enum
    args:
      table: weekdays
      is_enum: true
  response:
    message: success
- description: Check that marking a table as an enum changed the schema
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        weekdays: __type(name: "weekdays_enum") {
          name
          kind
          enumValues {
            name
            description
          }
        }
        employees: __type(name: "employees") {
          fields {
            name
            type {
              ofType {
                name
              }
            }
          }
        }
      }
  response:
    data:
      weekdays:
        name: weekdays_enum
        kind: ENUM
        enumValues:
        - name: friday
          description: null
        - name: monday
          description: null
        - name: saturday
          description: null
        - name: sunday
          description: null
        - name: thursday
          description: null
        - name: tuesday
          description: null
        - name: wednesday
          description: null
      employees:
        fields:
        - name: favorite_color
          type:
            ofType:
              name: colors_enum
        - name: gets_paid_on
          type:
            ofType:
              name: weekdays_enum
        - name: id
          type:
            ofType:
              name: Int
        - name: name
          type:
            ofType:
              name: String
- description: Mark an existing enum table as not an enum
  url: /v1/query
  status: 200
  query:
    type: set_table_is_enum
    args:
      table: colors
      is_enum: false
  response:
    message: success
- description: Check that marking a table as not an enum changed the schema
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        colors: __type(name: "colors_enum") {
          name
          kind
        }
        employees: __type(name: "employees") {
          fields {
            name
            type {
              ofType {
                name
              }
            }
          }
        }
      }
  response:
    data:
      colors: null
      employees:
        fields:
        - name: favorite_color
          type:
            ofType:
              name: String
        - name: gets_paid_on
          type:
            ofType:
              name: weekdays_enum
        - name: id
          type:
            ofType:
              name: Int
        - name: name
          type:
            ofType:
              name: String
