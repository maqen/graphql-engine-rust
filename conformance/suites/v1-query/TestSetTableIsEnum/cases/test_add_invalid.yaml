upstream:
  file: test_v1_queries.py
  class: TestSetTableIsEnum
  method: test_add_invalid
  fixtures:
  - queries/v1/set_table_is_enum/add_invalid.yaml
steps:
- description: Attempts to mark a non-enum table as an enum are rejected
  url: /v1/query
  status: 400
  query:
    type: set_table_is_enum
    args:
      table: employees
      is_enum: true
  response:
    error: |
      Inconsistent object: the table "employees" cannot be used as an enum for the following reasons:
        • the table’s primary key ("id") must have type "text", not type "integer"
        • the table must have exactly one primary key and optionally one comment column, not 4 columns (favorite_color, gets_paid_on, id, name)
    path: $.args
    code: invalid-configuration
    internal:
    - definition:
        name: employees
        schema: public
      name: table employees in source default
      reason: |
        Inconsistent object: the table "employees" cannot be used as an enum for the following reasons:
          • the table’s primary key ("id") must have type "text", not type "integer"
          • the table must have exactly one primary key and optionally one comment column, not 4 columns (favorite_color, gets_paid_on, id, name)
      type: table
