upstream:
  file: test_v1_queries.py
  class: TestRelationships
  method: test_create_object_relationship_as_not_admin_error
  fixtures:
  - queries/v1/relationships/create_object_relationship_as_not_admin_error.yaml
steps:
- description: Create object relationship using foreign key
  url: /v1/query
  status: 400
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    type: create_object_relationship
    args:
      table: article
      name: author
      using:
        foreign_key_constraint_on: author_id
  response:
    error: 'restricted access : admin only'
    path: $.args
    code: access-denied
