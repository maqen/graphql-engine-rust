upstream:
  file: test_v1_queries.py
  class: TestRelationships
  method: test_object_relationship_foreign_key
  fixtures:
  - queries/v1/relationships/object_relationship_foreign_key.yaml
steps:
- description: Create object relationship using foreign key
  url: /v1/query
  status: 200
  query:
    type: create_object_relationship
    args:
      table: article
      name: author
      using:
        foreign_key_constraint_on: author_id
  response:
    message: success
- description: Nested select on article
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - content
      - name: author
        columns:
        - id
        - name
  response:
  - id: 1
    title: Article 1
    content: Sample article content 1
    author:
      id: 1
      name: Author 1
  - id: 2
    title: Article 2
    content: Sample article content 2
    author:
      id: 1
      name: Author 1
  - id: 3
    title: Article 3
    content: Sample article content 3
    author:
      id: 2
      name: Author 2
- description: Rename object relationship author to author_obj
  url: /v1/query
  status: 200
  query:
    type: rename_relationship
    args:
      table: article
      name: author
      new_name: author_obj
  response:
    message: success
- description: Nested select on article with renamed object relation
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - content
      - name: author_obj
        columns:
        - id
        - name
  response:
  - id: 1
    title: Article 1
    content: Sample article content 1
    author_obj:
      id: 1
      name: Author 1
  - id: 2
    title: Article 2
    content: Sample article content 2
    author_obj:
      id: 1
      name: Author 1
  - id: 3
    title: Article 3
    content: Sample article content 3
    author_obj:
      id: 2
      name: Author 2
- description: Drop object relationship
  url: /v1/query
  status: 200
  query:
    type: drop_relationship
    args:
      table: article
      relationship: author_obj
  response:
    message: success
