upstream:
  file: test_v1_queries.py
  class: TestV1UpdatePermissions
  method: test_user_update_resident_preset
  fixtures:
  - queries/v1/update/permissions/user_update_resident_preset.yaml
steps:
- description: Update resident using preset
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: user1
  query:
    type: update
    args:
      table: resident
      where:
        name: clarke
      returning:
      - id
      - name
      - age
      - city
  response:
    returning:
    - id: 3
      name: clarke
      age: 21
      city: melbourne
    affected_rows: 1
