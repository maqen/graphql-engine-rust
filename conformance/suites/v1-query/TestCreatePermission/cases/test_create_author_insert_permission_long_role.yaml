upstream:
  file: test_v1_queries.py
  class: TestCreatePermission
  method: test_create_author_insert_permission_long_role
  fixtures:
  - queries/v1/permissions/create_author_insert_permission_long_role.yaml
steps:
- description: Create insert permission for author table with long (> 63 chars) role
  url: /v1/query
  status: 200
  query:
    type: create_insert_permission
    args:
      table: author
      role: this.is.really.a.very.long.and.long.role.more.than.63.characters.one
      permission:
        columns: '*'
        check: {}
  response:
    message: success
- description: Create insert permission for author table with long (> 63 chars) role
  url: /v1/query
  status: 200
  query:
    type: create_insert_permission
    args:
      table: author
      role: this.is.really.a.very.long.and.long.role.more.than.63.characters.two
      permission:
        columns: '*'
        check: {}
  response:
    message: success
