upstream:
  file: test_v1_queries.py
  class: TestCreatePermission
  method: test_create_permission_admin_role_error
  fixtures:
  - queries/v1/permissions/create_article_permission_role_admin_error.yaml
steps:
- description: Create permission with admin as role (error)
  url: /v1/query
  status: 400
  query:
    type: create_select_permission
    args:
      table: author
      role: admin
      permission:
        columns: '*'
        filter:
          id: X-Hasura-User-Id
  response:
    error: select permission already defined on table "author" with role "admin"
    path: $.args
    code: already-exists
