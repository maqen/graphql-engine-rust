upstream:
  file: test_v1_queries.py
  class: TestV1InsertPermissions
  method: test_student_role_insert_check_bio_fail
  fixtures:
  - queries/v1/insert/permissions/author_student_role_insert_check_bio_fail.yaml
steps:
- description: Inserts author without bio as a student (Error)
  url: /v1/query
  status: 400
  headers:
    X-Hasura-Role: student
  query:
    type: insert
    args:
      table: author
      objects:
      - id: 5
        name: Student 1
        is_registered: false
  response:
    error: check constraint of an insert/update permission has failed
    path: $.args
    code: permission-error
