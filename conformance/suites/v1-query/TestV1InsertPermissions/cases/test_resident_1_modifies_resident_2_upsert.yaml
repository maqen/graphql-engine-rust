upstream:
  file: test_v1_queries.py
  class: TestV1InsertPermissions
  method: test_resident_1_modifies_resident_2_upsert
  fixtures:
  - queries/v1/insert/permissions/resident_1_modifies_resident_2_upsert.yaml
steps:
- description: Resident 1 trying to update Resident 2 age
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: resident
    X-Hasura-Resident-Id: '1'
  query:
    type: insert
    args:
      table: resident
      objects:
      - id: 1
        name: Resident 2
        age: 23
      on_conflict:
        constraint: resident_name_key
        action: update
      returning:
      - id
      - name
      - age
  response:
    returning: []
    affected_rows: 0
