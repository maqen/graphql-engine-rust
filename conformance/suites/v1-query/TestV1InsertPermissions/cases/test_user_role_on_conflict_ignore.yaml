upstream:
  file: test_v1_queries.py
  class: TestV1InsertPermissions
  method: test_user_role_on_conflict_ignore
  fixtures:
  - queries/v1/insert/permissions/author_on_conflict_ignore_user_role.yaml
steps:
- description: Upserts author with id 1 as a user (Error)
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    type: insert
    args:
      table: author
      objects:
      - id: 1
        name: Author 1 Updated
      on_conflict:
        constraint: author_pkey
        action: ignore
      returning:
      - name
      - id
  response:
    returning: []
    affected_rows: 0
