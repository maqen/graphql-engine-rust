upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpPostGIS
  method: test_query_geog_stintersects
  fixtures:
  - queries/v1/select/boolexp/postgis/query_geog_stintersects.yaml
steps:
- description: Query data from geog_table using st_intersects
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: geog_table
      where:
        geog_col:
          $st_intersects:
            coordinates:
            - 0.0
            - 0.5
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            type: Point
      columns:
      - name
  response:
  - name: Linestring
  - name: Point
