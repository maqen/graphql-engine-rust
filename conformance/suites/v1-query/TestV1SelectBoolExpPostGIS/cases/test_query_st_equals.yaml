upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpPostGIS
  method: test_query_st_equals
  fixtures:
  - queries/v1/select/boolexp/postgis/query_st_equals.yaml
steps:
- description: Query data from geom_table using postgis op $st_equals in bool exp
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: geom_table
      where:
        geom_col:
          $st_equals:
            type: Point
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - 1
            - 2
      columns:
      - id
      - type
      - geom_col
  response:
  - id: 1
    type: point
    geom_col:
      type: Point
      crs:
        type: name
        properties:
          name: urn:ogc:def:crs:EPSG::4326
      coordinates:
      - 1
      - 2
