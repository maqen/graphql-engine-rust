upstream:
  file: test_v1_queries.py
  class: TestV1SelectPermissions
  method: test_user_can_query_geog_filter
  fixtures:
  - queries/v1/select/permissions/user_can_query_geog_filter.yaml
steps:
- description: Query data from geog_table using st_intersects in permission
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: postgis_user1
  query:
    type: select
    args:
      table: geog_table
      columns:
      - name
  response:
  - name: Linestring
  - name: Point
