upstream:
  file: test_v1_queries.py
  class: TestV1SelectPermissions
  method: test_anonymous_only_published_articles
  fixtures:
  - queries/v1/select/permissions/anonymous_can_only_get_published_articles.yaml
steps:
- description: Anonymous Users cannot see unpublished articles
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: anonymous
  query:
    type: select
    args:
      table: article
      where:
        is_published: false
      columns:
      - id
      - title
      - content
      - is_published
      - name: author
        columns:
        - id
        - name
  response: []
- description: Anonymous Users can only see published articles
  url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: anonymous
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - content
      - is_published
      - name: author
        columns:
        - id
        - name
  response:
  - id: 2
    title: Article 2
    content: Sample article content 2
    is_published: true
    author:
      id: 1
      name: Author 1
  - id: 3
    title: Article 3
    content: Sample article content 3
    is_published: true
    author:
      id: 2
      name: Author 2
