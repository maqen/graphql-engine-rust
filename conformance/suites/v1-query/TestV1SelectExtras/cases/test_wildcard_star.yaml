steps:
- url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns:
      - '*'
      order_by: id
  response:
  - id: 1
    content: Sample article content 1
    is_published: false
    published_on: null
    author_id: 1
    title: Article 1
  - id: 2
    content: Sample article content 2
    is_published: true
    published_on: null
    author_id: 1
    title: Article 2
  - id: 3
    content: Sample article content 3
    is_published: true
    published_on: null
    author_id: 2
    title: Article 3
  - id: 4
    content: Sample article content 4
    is_published: false
    published_on: null
    author_id: 3
    title: Article 4
