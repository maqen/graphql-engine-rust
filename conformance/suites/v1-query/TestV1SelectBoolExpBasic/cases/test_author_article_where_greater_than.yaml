upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_author_article_where_greater_than
  fixtures:
  - queries/v1/select/boolexp/basic/select_author_article_where_gt.yaml
steps:
- description: Select author and their articles
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      where:
        id:
          $gt: 2
      columns:
      - id
      - name
      - name: articles
        columns:
        - id
        - title
        - content
  response:
  - id: 3
    name: Author 3
    articles:
    - id: 4
      title: Article 4
      content: Sample article content 4
