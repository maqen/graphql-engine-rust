upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_author_article_where_less_than_or_equal
  fixtures:
  - queries/v1/select/boolexp/basic/select_author_article_where_lte.yaml
steps:
- description: Select author and their articles
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      order_by: -id
      where:
        id:
          $lte: 2
      columns:
      - id
      - name
      - name: articles
        order_by: -id
        where:
          id:
            $gt: 1
        columns:
        - id
        - title
        - content
  response:
  - id: 2
    name: Author 2
    articles:
    - id: 3
      title: Article 3
      content: Sample article content 3
  - id: 1
    name: Author 1
    articles:
    - id: 2
      title: Article 2
      content: Sample article content 2
