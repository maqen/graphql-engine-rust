upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_author_article_where_not_equal
  fixtures:
  - queries/v1/select/boolexp/basic/select_author_article_where_neq.yaml
steps:
- description: Select author and their articles
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      where:
        name:
          $neq: Author 1
      columns:
      - id
      - name
      - name: articles
        where:
          is_published:
            $neq: false
        columns:
        - id
        - title
        - content
        - is_published
  response:
  - id: 2
    name: Author 2
    articles: []
  - id: 3
    name: Author 3
    articles:
    - id: 4
      title: Article 4
      content: Sample article content 4
      is_published: true
