upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_author_article_where_nin
  fixtures:
  - queries/v1/select/boolexp/basic/select_author_article_where_nin.yaml
steps:
- description: Select author and their articles
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      where:
        name:
          $nin:
          - Author 2
          - Author 3
      columns:
      - id
      - name
      - name: articles
        where:
          id:
            $gt: 1
        columns:
        - id
        - title
        - content
  response:
  - id: 1
    name: Author 1
    articles:
    - id: 2
      title: Article 2
      content: Sample article content 2
