upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_order_delivered_at_is_not_null
  fixtures:
  - queries/v1/select/boolexp/basic/select_query_order_delivered_at_is_not_null.yaml
steps:
- description: Simple GraphQL object query on author
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: orders
      where:
        delivered_at:
          $is_null: false
      columns:
      - id
      - received_at
      - delivered_at
  response:
  - id: 2
    received_at: '2018-09-21T09:40:44+00:00'
    delivered_at: '2018-09-21T09:50:44+00:00'
