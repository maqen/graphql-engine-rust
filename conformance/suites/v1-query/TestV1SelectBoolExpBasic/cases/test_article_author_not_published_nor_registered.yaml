upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_article_author_not_published_nor_registered
  fixtures:
  - queries/v1/select/boolexp/basic/select_article_author_not_published_or_not_registered.yaml
steps:
- description: Nested select on article
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      where:
        $or:
        - is_published: false
        - author:
            is_registered: false
      columns:
      - id
      - title
      - content
      - is_published
      - name: author
        columns:
        - id
        - name
        - is_registered
      order_by: +id
  response:
  - id: 1
    title: Article 1
    content: Sample article content 1
    is_published: false
    author:
      id: 1
      name: Author 1
      is_registered: true
  - id: 3
    title: Article 3
    content: Sample article content 3
    is_published: false
    author:
      id: 2
      name: Author 2
      is_registered: true
  - id: 4
    title: Article 4
    content: Sample article content 4
    is_published: true
    author:
      id: 3
      name: Author 3
      is_registered: false
