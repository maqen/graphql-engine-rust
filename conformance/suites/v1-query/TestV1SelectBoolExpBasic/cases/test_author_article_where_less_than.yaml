upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpBasic
  method: test_author_article_where_less_than
  fixtures:
  - queries/v1/select/boolexp/basic/select_author_article_where_lt.yaml
steps:
- description: Select author and their articles
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      where:
        id:
          $lt: 2
      columns:
      - id
      - name
      - name: articles
        columns:
        - id
        - title
        - content
  response:
  - id: 1
    name: Author 1
    articles:
    - id: 1
      title: Article 1
      content: Sample article content 1
    - id: 2
      title: Article 2
      content: Sample article content 2
