upstream:
  file: test_v1_queries.py
  class: TestRunSQL
  method: test_sql_rename_columns_article
  fixtures:
  - queries/v1/run_sql/sql_rename_columns_article.yaml
steps:
- url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        alter table author rename column id to author_id;
  response:
    result_type: CommandOk
    result: null
- url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      columns:
      - author_id
      - name
  response:
  - author_id: 1
    name: Author 1
  - author_id: 2
    name: Author 2
- url: /v1/query
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - author_id
  response:
  - id: 1
    title: article 1 by author 1
    author_id: 1
  - id: 2
    title: article 2 by author 1
    author_id: 1
- url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        alter table author rename column author_id to id;
  response:
    result_type: CommandOk
    result: null
- url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: author
      columns:
      - id
      - name
  response:
  - id: 1
    name: Author 1
  - id: 2
    name: Author 2
