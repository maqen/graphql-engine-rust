upstream:
  file: test_v1_queries.py
  class: TestV1UpdateBasic
  method: test_product_mul_price
  fixtures:
  - queries/v1/update/basic/product_mul_price.yaml
steps:
- description: Updated product price using _mul operator
  url: /v1/query
  status: 200
  query:
    type: update
    args:
      table: products
      $mul:
        price: 3
      where:
        product_id:
          $gte: 1
      returning:
      - product_id
      - name
      - price
  response:
    returning:
    - product_id: 1
      name: Product 1
      price: '15'
    - product_id: 2
      name: Product 2
      price: '45'
    affected_rows: 2
- description: Updated product price using _mul operator
  url: /v1/query
  status: 200
  query:
    type: update
    args:
      table: products
      $mul:
        price: 1.1
      where:
        product_id: 2
      returning:
      - product_id
      - name
      - price
  response:
    returning:
    - product_id: 2
      name: Product 2
      price: '49.5000'
    affected_rows: 1
