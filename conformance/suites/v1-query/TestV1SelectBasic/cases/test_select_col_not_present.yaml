upstream:
  file: test_v1_queries.py
  class: TestV1SelectBasic
  method: test_select_col_not_present
  fixtures:
  - queries/v1/select/basic/select_article_col_not_present_err.yaml
steps:
- url: /v1/query
  status: 400
  query:
    type: select
    args:
      table: author
      columns:
      - id
      - name
      - user
  response:
    error: 'no such column exists: "user"'
    path: $.args.columns[2]
    code: permission-denied
