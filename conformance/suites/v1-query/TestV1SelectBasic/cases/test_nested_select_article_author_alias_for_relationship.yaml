upstream:
  file: test_v1_queries.py
  class: TestV1SelectBasic
  method: test_nested_select_article_author_alias_for_relationship
  fixtures:
  - queries/v1/select/basic/nested_select_query_article_author_rel_alias.yaml
steps:
- description: Nested select on article
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      columns:
      - id
      - title
      - content
      - name: author
        alias: author_info
        columns:
        - id
        - name
  response:
  - id: 1
    title: Article 1
    content: Sample article content 1
    author_info:
      id: 1
      name: Author 1
  - id: 2
    title: Article 2
    content: Sample article content 2
    author_info:
      id: 1
      name: Author 1
  - id: 3
    title: Article 3
    content: Sample article content 3
    author_info:
      id: 2
      name: Author 2
