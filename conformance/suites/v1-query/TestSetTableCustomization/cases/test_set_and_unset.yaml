upstream:
  file: test_v1_queries.py
  class: TestSetTableCustomization
  method: test_set_and_unset
  fixtures:
  - queries/v1/set_table_configuration/set_and_unset.yaml
steps:
- description: Set select_by_pk root field and customise name column
  url: /v1/query
  status: 200
  query:
    type: set_table_customization
    args:
      table: author
      configuration:
        custom_root_fields:
          select: Authors
          select_by_pk: Author
        column_config:
          id:
            custom_name: AuthorId
          name:
            custom_name: AuthorName
          age:
            custom_name: age
  response:
    message: success
- description: Check that above query has changed the schema
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
          Author(AuthorId: 1){
            AuthorName
          }
      }
  response:
    data:
      Author:
        AuthorName: Clarke
- description: Unset select_by_pk root field and remove custom column names
  url: /v1/query
  status: 200
  query:
    type: set_table_customization
    args:
      table: author
      configuration:
        custom_root_fields:
          select: Authors
  response:
    message: success
- description: Check that above query has changed the schema
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
          author_by_pk(id: 1){
            name
          }
      }
  response:
    data:
      author_by_pk:
        name: Clarke
