upstream:
  file: test_v1_queries.py
  class: TestSetTableCustomization
  method: test_conflict_with_relationship
  fixtures:
  - queries/v1/set_table_configuration/conflict_with_relationship.yaml
steps:
- description: Set custom column names conflicting with existing relationship
  url: /v1/query
  status: 400
  query:
    type: set_table_customization
    args:
      table: author
      configuration:
        custom_root_fields: {}
        column_config:
          name:
            custom_name: articles
          age:
            custom_name: articles_aggregate
  response:
    error: cannot continue due to new inconsistent metadata
    path: $.args
    code: unexpected
    internal:
    - definition:
        comment: null
        name: articles
        source: default
        table:
          name: author
          schema: public
        using:
          foreign_key_constraint_on:
            column: author_id
            table:
              name: article
              schema: public
      name: array_relation articles in table author in source default
      reason: 'Inconsistent object: field definition conflicts with custom field name for postgres column
        "name"'
      type: array_relation
