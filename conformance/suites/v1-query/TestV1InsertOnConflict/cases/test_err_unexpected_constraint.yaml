upstream:
  file: test_v1_queries.py
  class: TestV1InsertOnConflict
  method: test_err_unexpected_constraint
  fixtures:
  - queries/v1/insert/onconflict/article_unexpected_on_conflict_constraint_error.yaml
steps:
- description: Upserts article data via GraphQL mutation (Error 03)
  url: /v1/query
  status: 400
  query:
    type: insert
    args:
      table: article
      objects:
      - content: Updated Article 1 content
        id: 1
      - content: Updated Article 2 content
        id: 2
      on_conflict:
        constraint_on:
        - name
        action: update
      returning:
      - content
      - id
  response:
    error: column "name" does not exist
    path: $.args.on_conflict.constraint_on[0]
    code: not-exists
