upstream:
  file: test_v1_queries.py
  class: TestV1InsertOnConflict
  method: test_on_conflict_no_action_specified
  fixtures:
  - queries/v1/insert/onconflict/article_on_conflict_no_action_specified.yaml
steps:
- description: Upserts article data via GraphQL mutation with only constraint (Error)
  url: /v1/query
  status: 400
  query:
    type: insert
    args:
      table: article
      objects:
      - content: Updated Article 1 content
        id: 1
      - content: Updated Article 2 content
        id: 2
      on_conflict:
        constraint_on:
        - id
      returning:
      - name
      - id
  response:
    error: parsing Hasura.RQL.DML.Types.OnConflict(OnConflict) failed, key "action" not found
    path: $.args.on_conflict
    code: parse-failed
