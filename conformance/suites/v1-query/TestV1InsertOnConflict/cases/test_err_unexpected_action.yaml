upstream:
  file: test_v1_queries.py
  class: TestV1InsertOnConflict
  method: test_err_unexpected_action
  fixtures:
  - queries/v1/insert/onconflict/article_unexpected_on_conflict_action.yaml
steps:
- description: Upserts article data via GraphQL mutation (Error 02)
  url: /v1/query
  status: 400
  query:
    type: insert
    args:
      table: article
      objects:
      - content: Updated Article 1 content
        id: 1
      - content: Updated Article 2 content
        id: 2
      on_conflict:
        constraint_on:
        - id
        action: random
      returning:
      - name
      - id
  response:
    error: Expecting 'ignore' or 'update'
    path: $.args.on_conflict.action
    code: parse-failed
