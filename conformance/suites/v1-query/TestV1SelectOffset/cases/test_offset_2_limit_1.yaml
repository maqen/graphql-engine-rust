upstream:
  file: test_v1_queries.py
  class: TestV1SelectOffset
  method: test_offset_2_limit_1
  fixtures:
  - queries/v1/select/offset/select_query_article_offset_2_limit_1.yaml
steps:
- description: Nested select on article with offset 2 and limit 1
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      offset: 2
      columns:
      - id
      - title
      - content
      - name: author
        columns:
        - id
        - name
      order_by: -id
      limit: 1
  response:
  - id: 1
    title: Article 1
    content: Sample article content 1
    author:
      id: 1
      name: Author 1
