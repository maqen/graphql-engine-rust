upstream:
  file: test_v1_queries.py
  class: TestV1SelectOffset
  method: test_offset_1_limit_2
  fixtures:
  - queries/v1/select/offset/select_query_article_offset_1_limit_2.yaml
steps:
- description: Nested select on article with offset 1 and limit 2
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: article
      offset: 1
      columns:
      - id
      - title
      - content
      - name: author
        columns:
        - id
        - name
      order_by: -id
      limit: 2
  response:
  - id: 2
    title: Article 2
    content: Sample article content 2
    author:
      id: 1
      name: Author 1
  - id: 1
    title: Article 1
    content: Sample article content 1
    author:
      id: 1
      name: Author 1
