upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpSearch
  method: test_city_where_not_regex
  fixtures:
  - queries/v1/select/boolexp/search/select_city_where_nregex.yaml
steps:
- description: Select cities not starting with new (case-sensitively)
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: city
      where:
        name:
          $nregex: new.*
      columns:
      - name
      - country
  response:
  - name: Durham
    country: USA
  - name: New York
    country: USA
  - name: Framlingham
    country: UK
  - name: New Orleans
    country: USA
