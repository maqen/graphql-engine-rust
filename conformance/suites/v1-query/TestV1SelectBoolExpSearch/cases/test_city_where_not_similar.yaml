upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpSearch
  method: test_city_where_not_similar
  fixtures:
  - queries/v1/select/boolexp/search/select_city_where_not_similar.yaml
steps:
- description: Select cities not ending with ham
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: city
      where:
        name:
          $nsimilar: _*ham
      columns:
      - name
      - country
  response:
  - name: New York
    country: USA
  - name: New Orleans
    country: USA
