upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpSearch
  method: test_city_where_iregex
  fixtures:
  - queries/v1/select/boolexp/search/select_city_where_iregex.yaml
steps:
- description: Select cities starting with fram
  url: /v1/query
  status: 200
  query:
    type: select
    args:
      table: city
      where:
        name:
          $iregex: fram.*
      columns:
      - name
      - country
  response:
  - name: Framlingham
    country: UK
