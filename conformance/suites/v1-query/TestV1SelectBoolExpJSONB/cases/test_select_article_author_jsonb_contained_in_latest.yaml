upstream:
  file: test_v1_queries.py
  class: TestV1SelectBoolExpJSONB
  method: test_select_article_author_jsonb_contained_in_latest
  fixtures:
  - queries/v1/select/boolexp/jsonb/select_article_author_jsonb_contained_in_latest.yaml
steps:
- description: Nested select on article
  url: /v1/query
  status: 200
  query:
    variables:
      tags:
      - latest
    type: select
    args:
      table: article
      where:
        tags:
          $contained_in:
          - latest
      columns:
      - id
      - title
      - content
      - tags
      - name: author
        columns:
        - id
        - name
  response:
  - id: 3
    title: Article 3
    content: Sample article content 3
    tags:
    - latest
    author:
      id: 2
      name: Author 2
