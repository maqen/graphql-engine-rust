upstream:
  file: test_v1_queries.py
  class: TestV1General
  method: test_query_v2_invalid_version
  fixtures:
  - queries/v1/basic/query_v2_invalid_version.yaml
steps:
- description: Track function search_articles
  url: /v1/query
  status: 400
