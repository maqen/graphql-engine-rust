upstream:
  file: test_endpoints.py
  by_hand: true
steps:
- description: Replace metadata with invalid collection queries
  url: /v1/metadata
  status: 200
  query:
    type: replace_metadata
    args:
      allow_inconsistent_metadata: true
      metadata:
        version: 3
        sources:
        - name: default
          kind: postgres
          configuration:
            connection_info:
              database_url:
                from_env: HASURA_GRAPHQL_DATABASE_URL
          tables:
          - table:
              name: qv_author
              schema: public
            array_relationships:
            - name: articles
              using:
                foreign_key_constraint_on:
                  column: author_id
                  table:
                    name: qv_article
                    schema: public
          - table:
              name: qv_article
              schema: public
        query_collections:
        - name: c1
          definition:
            queries:
            - name: ok
              query: query ok { qv_author { id name } }
            - name: nofield
              query: query nofield { nope }
            - name: nested
              query: query nested { qv_author { id nope articles { title zz } } }
            - name: scalarsel
              query: query scalarsel { qv_author { id { x } } }
            - name: objnosel
              query: query objnosel { qv_author { articles } }
            - name: mut
              query: 'mutation mut { insert_qv_author(objects: []) { affected_rows } nope }'
            - name: sub
              query: subscription sub { qv_author { id } }
            - name: badvar
              query: 'query badvar($a: Nope, $b: qv_author, $c: Int) { qv_author { id } }'
            - name: mismatch
              query: 'query mismatch { qv_author { x: id x: name } }'
            - name: mismatchobj
              query: 'query mismatchobj { a: qv_author { id } a: qv_article { id } }'
            - name: mismatchroot
              query: 'query mismatchroot { x: qv_author { id } x: qv_author_aggregate { aggregate { count } } nope }'
            - name: frag
              query: query frag { qv_author { ...F } } fragment F on qv_author { id bad }
            - name: undef
              query: query undef { qv_author { ...G } }
            - name: cycle
              query: query cycle { qv_author { ...A } } fragment A on qv_author { ...B } fragment B on qv_author { ...C } fragment C on qv_author { ...A }
            - name: two
              query: query a { qv_author { id } } query b { qv_author { id } }
            - name: shorthand
              query: '{ nope }'
            - name: typename
              query: 'query typename { __typename qv_author { __typename } __schema { types { name zz } } __type(name: "x") { name } }'
            - name: inline
              query: query inline { qv_author { ... on qv_author { id bad } ... { name } } }
            - name: enumsel
              query: query enumsel { __schema { types { kind { a } } } }
            - name: inputout
              query: query inputout { qv_author { id } }
            - name: argsbad
              query: 'query argsbad { qv_author(nope: 1) { id } }'
            - name: multi
              query: query multi { b1 c1 qv_author { d1 } }
            - name: onlyfrag
              query: fragment F on qv_author { id }
        - name: c2
          definition:
            queries:
            - name: nofield
              query: query nofield { nope }
            - name: dup
              query: query nofield { nope }
        allowlist:
        - collection: c1
        - collection: c2
          scope:
            global: false
            roles:
            - user
        rest_endpoints:
        - name: e1
          url: e1
          methods:
          - GET
          - POST
          definition:
            query:
              collection_name: c1
              query_name: nofield
        - name: e0
          url: e0
          methods:
          - GET
          definition:
            query:
              collection_name: c2
              query_name: nofield
        - name: e2
          url: e2
          methods:
          - GET
          definition:
            query:
              collection_name: c1
              query_name: nested
  response:
    inconsistent_objects:
    - definition:
        name: nofield
        query: query nofield { nope }
      name: query_collections nofield in c1
      reason: 'Inconsistent object: In query collection "c1" the query "nofield" is invalid with the following error(s): "$.nope: field ''nope'' not found in object ''query_root''". This query is being used in the following REST endpoint(s): "e1", "e1", "e0". This query is in allowlist.'
