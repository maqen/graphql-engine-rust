upstream:
  file: test_allowlist_queries.py
  class: TestAllowlistQueries
  method: test_query_as_admin
  fixtures:
  - queries/graphql_query/allowlist/query_as_admin.yaml
steps:
- description: Query as admin. Allowlist is not enforced.
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        user(where: {company: {_is_null: true}}){
          id
          account_id
          company
          name
        }
      }
  response:
    data:
      user:
      - id: 2
        account_id: 2
        company: null
        name: reckler
