upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOffsets
  method: test_offset_1_limit_2
  fixtures:
  - queries/graphql_query/offset/select_query_article_offset_1_limit_2.yaml
steps:
- description: Nested select on article with offset 1 and limit 2
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        article(limit: 2, offset: 1, order_by: {id: desc}) {
          id
          title
          content
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 2
        title: Article 2
        content: Sample article content 2
        author:
          id: 1
          name: Author 1
      - id: 1
        title: Article 1
        content: Sample article content 1
        author:
          id: 1
          name: Author 1
