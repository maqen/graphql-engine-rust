upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryLimits
  method: test_limit_null
  fixtures:
  - queries/graphql_query/limits/select_query_article_limit_null.yaml
steps:
- description: Nested select on article with limit (null)
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        article(limit: null, order_by: {id: desc}) {
          id
          title
          content
          author {
            id
            name
          }
        }
      }
  response:
    data:
      article:
      - id: 3
        title: Article 3
        content: Sample article content 3
        author:
          id: 2
          name: Author 2
      - id: 2
        title: Article 2
        content: Sample article content 2
        author:
          id: 1
          name: Author 1
      - id: 1
        title: Article 1
        content: Sample article content 1
        author:
          id: 1
          name: Author 1
