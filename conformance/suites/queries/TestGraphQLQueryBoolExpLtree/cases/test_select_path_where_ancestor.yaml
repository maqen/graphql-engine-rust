upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_ancestor
  fixtures:
  - queries/graphql_query/boolexp/ltree/select_path_where_ancestor.yaml
steps:
- description: Select ancestors of an `ltree` argument
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        tree (
          where: {path: {_ancestor: "Tree.Collections.Pictures.Astronomy.Astronauts"}}
        ) {
          path
        }
      }
  response:
    data:
      tree:
      - path: Tree
      - path: Tree.Collections
      - path: Tree.Collections.Pictures
      - path: Tree.Collections.Pictures.Astronomy
      - path: Tree.Collections.Pictures.Astronomy.Astronauts
- description: Select ancestors of an invalid `ltree` argument
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        tree (
          where: {path: {_ancestor: "Tree.Collections.Pictures.Astronomy.Astronauts."}}
        ) {
          path
        }
      }
  response:
    errors:
    - message: 'Expecting label path: a sequence of zero or more labels separated by dots, for example
        L1.L2.L3'
      extensions:
        path: $.selectionSet.tree.args.where.path._ancestor
        code: parse-failed
