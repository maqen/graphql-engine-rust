upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpLtree
  method: test_select_path_where_descendant
  fixtures:
  - queries/graphql_query/boolexp/ltree/select_path_where_descendant.yaml
steps:
- description: Select descendants of an `ltree` argument
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        tree (
          where: {path: {_descendant: "Tree.Science"}}
        ) {
          path
        }
      }
  response:
    data:
      tree:
      - path: Tree.Science
      - path: Tree.Science.Astronomy
      - path: Tree.Science.Astronomy.Astrophysics
      - path: Tree.Science.Astronomy.Cosmology
