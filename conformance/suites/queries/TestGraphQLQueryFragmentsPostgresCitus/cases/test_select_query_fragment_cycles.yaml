upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryFragmentsPostgresCitus
  method: test_select_query_fragment_cycles
  fixtures:
  - queries/graphql_query/basic/select_query_fragment_cycles.yaml
steps:
- url: /v1/graphql
  status: 200
  query:
    query: |
      query fragmentCycle {
        author {
          ...authorFragment
        }
      }

      fragment authorFragment on author {
        id
        name
        articles {
          ...articleFragment
        }
      }

      fragment articleFragment on article {
        title
        author {
          ...authorFragment
        }
      }
  response:
    errors:
    - message: the fragment definition(s) authorFragment and articleFragment form a cycle
      extensions:
        path: $.selectionSet.author.selectionSet.authorFragment.selectionSet.articles.selectionSet.articleFragment.selectionSet.author.selectionSet
        code: validation-failed
