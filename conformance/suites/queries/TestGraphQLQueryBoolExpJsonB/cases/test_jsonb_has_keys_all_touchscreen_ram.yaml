upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpJsonB
  method: test_jsonb_has_keys_all_touchscreen_ram
  fixtures:
  - queries/graphql_query/boolexp/jsonb/select_product_jsonb_has_keys_all_ram_touchscreen.yaml
steps:
- description: Select products having key 'SIM type' in spec
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        product (
        where: {spec: {_has_keys_all: ["Touchscreen","RAM"] }}
        ) {
          id
          category
          name
          spec
        }
      }
  response:
    data:
      product:
      - id: 2
        category: Laptop
        name: laptop2
        spec:
          OS: os2
          RAM: 16GB
          Disk: 128GB
          Weight: 1.2Kg
          Processor: processor2
          Touchscreen: true
      - id: 3
        category: Mobile
        name: mobile1
        spec:
          RAM: 3GB
          Weight: 200g
          Sensors: Accelerometer sensor, E-compass, Proximity sensor
          SIM type: DualSim
          Processor: processor2
          Touchscreen: true
          Network type: 4G
          Operating System Type: osType1
