upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_less_than
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_lt.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |-
      query {
        author (
        where: {id: {_lt: 2}}
        ) {
          id
          name
          articles{
            id
            title
            content
          }
        }
      }
  response:
    data:
      author:
      - id: 1
        name: Author 1
        articles:
        - id: 1
          title: Article 1
          content: Sample article content 1
        - id: 2
          title: Article 2
          content: Sample article content 2
