upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_order_delivered_at_is_null
  fixtures:
  - queries/graphql_query/boolexp/basic/select_query_order_delivered_at_is_null.yaml
steps:
- description: Get all the orders which are not delivered at (delivered_at is NULL)
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        orders (
        where: {delivered_at: {_is_null: true}})
         {
          id
          received_at
        }
      }
  response:
    data:
      orders:
      - id: 1
        received_at: '2018-09-21T09:39:44'
