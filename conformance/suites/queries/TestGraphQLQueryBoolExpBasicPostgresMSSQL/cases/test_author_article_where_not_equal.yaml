upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_not_equal
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_neq.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |-
      query {
        author (where: {name: {_neq: "Author 1"}}) {
          id
          name
          articles (
          where: {is_published: {_neq: false}}
          ) {
            id
            title
            content
            is_published
          }
        }
      }
  response:
    data:
      author:
      - id: 2
        name: Author 2
        articles: []
      - id: 3
        name: Author 3
        articles:
        - id: 4
          title: Article 4
          content: Sample article content 4
          is_published: true
