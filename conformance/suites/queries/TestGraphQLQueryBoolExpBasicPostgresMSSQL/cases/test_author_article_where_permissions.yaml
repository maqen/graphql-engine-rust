upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_permissions
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_permissions.yaml
steps:
- description: Select author and their articles as an admin
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: admin
  query:
    query: |
      query {
        author(where: {articles: {}}) {
          name
        }
      }
  response:
    data:
      author:
      - name: Author 1
      - name: Author 2
      - name: Author 3
- description: Select author and their articles as a user
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
  query:
    query: |
      query {
        author(where: {articles: {}}) {
          name
        }
      }
  response:
    data:
      author:
      - name: Author 1
      - name: Author 3
