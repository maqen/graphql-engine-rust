upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_greater_than
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_gt.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |-
      query {
        author (where: {id: {_gt: 2}}) {
          id
          name
          articles {
            id
            title
            content
          }
        }
      }
  response:
    data:
      author:
      - id: 3
        name: Author 3
        articles:
        - id: 4
          title: Article 4
          content: Sample article content 4
