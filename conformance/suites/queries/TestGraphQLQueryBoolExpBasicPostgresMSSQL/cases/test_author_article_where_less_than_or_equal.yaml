upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_less_than_or_equal
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_lte.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        author (
        where: {id: {_lte: 2}}
        order_by: {id: desc}
        ) {
          id
          name
          articles(
            where: {id: {_gt: 1}}
          ) {
            id
            title
            content
          }
        }
      }
  response:
    data:
      author:
      - id: 2
        name: Author 2
        articles:
        - id: 3
          title: Article 3
          content: Sample article content 3
      - id: 1
        name: Author 1
        articles:
        - id: 2
          title: Article 2
          content: Sample article content 2
