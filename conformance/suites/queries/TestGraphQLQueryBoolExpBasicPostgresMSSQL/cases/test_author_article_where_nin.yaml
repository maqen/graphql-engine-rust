upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgresMSSQL
  method: test_author_article_where_nin
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_where_nin.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |-
      query {
        author (
        where: {name: {_nin: [ "Author 2", "Author 3" ] }}
        ) {
          id
          name
          articles(
          where: { id : { _gt: 1}}
          ) {
            id
            title
            content
          }
        }
      }
  response:
    data:
      author:
      - id: 1
        name: Author 1
        articles:
        - id: 2
          title: Article 2
          content: Sample article content 2
