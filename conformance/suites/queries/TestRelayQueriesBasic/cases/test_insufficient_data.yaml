upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_insufficient_data
  fixtures:
  - queries/graphql_query/relay/basic/node_id_errors/insufficient_data.yaml
steps:
- description: Query node interface with insufficient items in node id json array
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        node(id: "WzEsICJwdWJsaWMiLCAidXNlciJdCg=="){
          ... on user{
            first_name
            last_name
            age
            address
          }
        }
      }
  response:
    errors:
    - message: 'invalid node id: Error in $: GUID version 1: expecting schema name, table name and at
        least one column value'
      extensions:
        path: $.selectionSet.node.args.id
        code: validation-failed
