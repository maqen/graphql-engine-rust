upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_invalid_column_value
  fixtures:
  - queries/graphql_query/relay/basic/node_id_errors/invalid_column_value.yaml
steps:
- description: Query node interface with an invalid column value in node id json array
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        node(id: "WzEsICJwdWJsaWMiLCAidXNlciIsIDEsICJsYXN0XzIiXQo="){
          ... on user{
            first_name
            last_name
            age
            address
          }
        }
      }
  response:
    errors:
    - message: 'value of column ''first_name'' in node id: parsing Text failed, expected String, but encountered
        Number'
      extensions:
        path: $.selectionSet.node
        code: parse-failed
