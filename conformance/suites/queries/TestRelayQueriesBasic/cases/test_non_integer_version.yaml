upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_non_integer_version
  fixtures:
  - queries/graphql_query/relay/basic/node_id_errors/non_integer_version.yaml
steps:
- description: Query node interface with a non-integer GUID version
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        node(id: "WyIxIiwgInB1YmxpYyIsICJ1c2VyIiwgImZpcnN0XzIiLCAibGFzdF8yIiwgMl0K"){
          ... on user{
            first_name
            last_name
            age
            address
          }
        }
      }
  response:
    errors:
    - message: 'invalid node id: Error in $: unexpected GUID format, needs to start with a version number'
      extensions:
        path: $.selectionSet.node.args.id
        code: validation-failed
