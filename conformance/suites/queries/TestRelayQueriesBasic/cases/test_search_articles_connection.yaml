upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_search_articles_connection
  fixtures:
  - queries/graphql_query/relay/basic/search_articles_connection.yaml
steps:
- description: Query search_articles function with edges
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        search_articles_connection(args: {search: "6"}){
          edges{
            cursor
            node{
              id
              title
              content
              author{
                id
                name
              }
            }
          }
        }
      }
  response:
    data:
      search_articles_connection:
        edges:
        - cursor: eyJpZCIgOiA2fQ==
          node:
            id: WzEsICJwdWJsaWMiLCAiYXJ0aWNsZSIsIDZd
            title: Article 6
            content: Sample article content 6
            author:
              id: WzEsICJwdWJsaWMiLCAiYXV0aG9yIiwgM10=
              name: Author 3
