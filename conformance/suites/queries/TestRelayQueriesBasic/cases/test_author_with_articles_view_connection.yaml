upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_author_with_articles_view_connection
  fixtures:
  - queries/graphql_query/relay/basic/author_with_articles_view_connection.yaml
steps:
- description: Query author connection with edges
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        author_connection{
          edges{
            cursor
            node{
              id
              name
              articles{
                id
                title
                content
              }
              articles_aggregate{
                aggregate{
                  count
                }
              }
              articles_view_connection{
                edges{
                  cursor
                  node{
                    id
                    title
                    content
                  }
                }
              }
            }
          }
        }
      }
  response:
    errors:
    - message: 'field ''articles_view_connection'' not found in type: ''author'''
      extensions:
        path: $.selectionSet.author_connection.selectionSet.edges.selectionSet.node.selectionSet.articles_view_connection
        code: validation-failed
