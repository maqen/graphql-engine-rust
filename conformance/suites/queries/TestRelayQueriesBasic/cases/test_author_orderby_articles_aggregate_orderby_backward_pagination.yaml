upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_author_orderby_articles_aggregate_orderby_backward_pagination
  by_hand: true
  fixtures:
  - queries/graphql_query/relay/basic/author_pagination_articles_aggregate_orderby/backward/page_1.yaml
  - queries/graphql_query/relay/basic/author_pagination_articles_aggregate_orderby/backward/page_2.yaml
  - queries/graphql_query/relay/basic/author_pagination_articles_aggregate_orderby/backward/page_3.yaml
steps:
- description: Fetch 1st page from last of articles ordered by their article count
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        author_connection(
          last: 1
          order_by: {articles_aggregate: {count: asc}}
        ){
          pageInfo{
            startCursor
            endCursor
            hasPreviousPage
            hasNextPage
          }
          edges{
            cursor
            node{
              name
              articles_aggregate{
                aggregate{
                  count
                }
              }
            }
          }
        }
      }
  response:
    data:
      author_connection:
        pageInfo:
          startCursor: eyJhcnRpY2xlc19hZ2dyZWdhdGUiIDogeyJjb3VudCIgOiAzfSwgImlkIiA6IDF9
          endCursor: eyJhcnRpY2xlc19hZ2dyZWdhdGUiIDogeyJjb3VudCIgOiAzfSwgImlkIiA6IDF9
          hasPreviousPage: true
          hasNextPage: false
        edges:
        - cursor: eyJhcnRpY2xlc19hZ2dyZWdhdGUiIDogeyJjb3VudCIgOiAzfSwgImlkIiA6IDF9
          node:
            name: Author 1
            articles_aggregate:
              aggregate:
                count: 3
