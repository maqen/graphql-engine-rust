upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_first_and_last_fail
  fixtures:
  - queries/graphql_query/relay/basic/pagination_errors/first_and_last.yaml
steps:
- description: Use first and last arguments in the same query
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        author_connection(
          first: 1
          last: 2
        ){
          edges{
            cursor
          }
        }
      }
  response:
    errors:
    - message: '"first" and "last" are not allowed at once'
      extensions:
        path: $.selectionSet.author_connection.args
        code: validation-failed
