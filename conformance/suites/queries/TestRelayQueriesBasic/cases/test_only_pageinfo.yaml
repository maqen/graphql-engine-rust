upstream:
  file: test_graphql_queries.py
  class: TestRelayQueriesBasic
  method: test_only_pageinfo
  fixtures:
  - queries/graphql_query/relay/basic/only_pageinfo.yaml
steps:
- description: Query the article connection with only pageInfo
  url: /v1/relay
  status: 200
  query:
    query: |
      query {
        article_connection(
          order_by: {title: asc}
          last: 2
        ){
          pageInfo{
            startCursor
            endCursor
            hasPreviousPage
            hasNextPage
          }
          startCursor: pageInfo{
            startCursor
          }
          endCursor: pageInfo{
            endCursor
          }
          hasPreviousPage: pageInfo{
            hasPreviousPage
          }
          hasNextPage: pageInfo{
            hasNextPage
          }
        }
      }
  response:
    data:
      article_connection:
        pageInfo:
          startCursor: eyJ0aXRsZSIgOiAiQXJ0aWNsZSA1IiwgImlkIiA6IDV9
          endCursor: eyJ0aXRsZSIgOiAiQXJ0aWNsZSA2IiwgImlkIiA6IDZ9
          hasPreviousPage: true
          hasNextPage: false
        startCursor:
          startCursor: eyJ0aXRsZSIgOiAiQXJ0aWNsZSA1IiwgImlkIiA6IDV9
        endCursor:
          endCursor: eyJ0aXRsZSIgOiAiQXJ0aWNsZSA2IiwgImlkIiA6IDZ9
        hasPreviousPage:
          hasPreviousPage: true
        hasNextPage:
          hasNextPage: false
