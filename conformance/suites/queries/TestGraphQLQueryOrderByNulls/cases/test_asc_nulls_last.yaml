upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOrderByNulls
  method: test_asc_nulls_last
  fixtures:
  - queries/graphql_query/order_by_nulls/asc_nulls_last.yaml
steps:
- description: order by nullable column ascending with nulls last, same on every backend
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        order_by_nulls_test(order_by: [{val: asc_nulls_last}, {id: asc}]) {
          id
          val
        }
      }
  response:
    data:
      order_by_nulls_test:
      - id: 3
        val: 1
      - id: 5
        val: 2
      - id: 1
        val: 3
      - id: 2
        val: null
      - id: 4
        val: null
