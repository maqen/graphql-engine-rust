upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgres
  method: test_article_author_unexpected_operator_in_where_err
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_unexpected_operator_in_where_err_postgres.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        author (
        where: {id: {_unexpected: 2}}
        ) {
          id
          name
          articles{
            id
            title
            content
          }
        }
      }
  response:
    errors:
    - message: 'field ''_unexpected'' not found in type: ''Int_comparison_exp'''
      extensions:
        path: $.selectionSet.author.args.where.id._unexpected
        code: validation-failed
