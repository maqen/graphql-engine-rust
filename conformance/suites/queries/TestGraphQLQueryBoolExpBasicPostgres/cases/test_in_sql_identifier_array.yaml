upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgres
  method: test_in_sql_identifier_array
  fixtures:
  - queries/graphql_query/boolexp/basic/in_sql_identifier_array.yaml
steps:
- description: _in boolexp on column of type sql_identifier
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        table_with_sql_identifier(where: {sql_id: {_nin: ["one", "three"]}}) {
          id
          sql_id
        }
      }
  response:
    data:
      table_with_sql_identifier:
      - id: 3
        sql_id: two
      - id: 5
        sql_id: four
      - id: 7
        sql_id: two
