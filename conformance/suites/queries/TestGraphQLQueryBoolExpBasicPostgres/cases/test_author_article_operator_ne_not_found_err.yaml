upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpBasicPostgres
  method: test_author_article_operator_ne_not_found_err
  fixtures:
  - queries/graphql_query/boolexp/basic/select_author_article_operator_ne_not_found_err_postgres.yaml
steps:
- description: Select author and their articles
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        author (where: {name: {_ne: "Author 1"}}) {
          id
          name
          articles {
            id
            title
            content
            is_published
          }
        }
      }
  response:
    errors:
    - message: 'field ''_ne'' not found in type: ''String_comparison_exp'''
      extensions:
        path: $.selectionSet.author.args.where.name._ne
        code: validation-failed
