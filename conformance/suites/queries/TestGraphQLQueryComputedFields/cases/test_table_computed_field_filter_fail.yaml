upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryComputedFields
  method: test_table_computed_field_filter_fail
  fixtures:
  - queries/graphql_query/computed_fields/table_computed_field_filter_fail.yaml
steps:
- description: Query author by using a table computed field with input arguments in filter (Testing limitation)
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        author(where: {get_articles: {title: {_ilike: "%random%"}}}){
          id
          first_name
          last_name
          full_name
        }
      }
  response:
    errors:
    - message: 'field ''get_articles'' not found in type: ''author_bool_exp'''
      extensions:
        path: $.selectionSet.author.args.where.get_articles
        code: validation-failed
