upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOrderBy
  method: test_album_order_by_tracks_tags
  fixtures:
  - queries/graphql_query/order_by/album_order_by_tracks_tags.yaml
steps:
- description: Fetch Albums order by their tracks and tags aggregate fields
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        Album(
          order_by: [
            {
              Tracks_aggregate: {
                 max: {
                  track_id: asc
                }
              }
            },
            {
              Tags_aggregate:{
                max: {
                  id:asc
                }
              }
            }
          ]
        ){
          album_id
        }
      }
  response:
    data:
      Album:
      - album_id: 1
      - album_id: 2
