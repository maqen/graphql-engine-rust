upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOrderBy
  method: test_album_order_by_tracks_max_name
  fixtures:
  - queries/graphql_query/order_by/album_order_by_tracks_max_name.yaml
steps:
- description: Fetch Album order by their tracks' maximum name
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        Album(order_by: {Tracks_aggregate: {max: {name: asc}}}){
          album_id
          title
          Tracks_aggregate(order_by: {name: desc}){
            aggregate{
              stddev{
                bytes
              }
            }
            nodes{
              track_id
              name
            }
          }
        }
      }
  response:
    data:
      Album:
      - album_id: 2
        title: Face Lift
        Tracks_aggregate:
          aggregate:
            stddev:
              bytes: 653697.39166707
          nodes:
          - track_id: 5
            name: Random
          - track_id: 7
            name: Mistress
          - track_id: 6
            name: Good One
          - track_id: 4
            name: Evil Walks
      - album_id: 1
        title: Big Ones
        Tracks_aggregate:
          aggregate:
            stddev:
              bytes: 4460362.9621
          nodes:
          - track_id: 1
            name: Restless
          - track_id: 2
            name: Keepup
          - track_id: 3
            name: Havana
