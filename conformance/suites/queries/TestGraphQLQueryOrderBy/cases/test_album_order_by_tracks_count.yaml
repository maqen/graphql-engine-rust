upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOrderBy
  method: test_album_order_by_tracks_count
  fixtures:
  - queries/graphql_query/order_by/album_order_by_tracks_count.yaml
steps:
- description: Fetch Albums order by their tracks count
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        Album(order_by: {Tracks_aggregate: {count: desc}}){
          album_id
          title
        }
      }
  response:
    data:
      Album:
      - album_id: 2
        title: Face Lift
      - album_id: 1
        title: Big Ones
