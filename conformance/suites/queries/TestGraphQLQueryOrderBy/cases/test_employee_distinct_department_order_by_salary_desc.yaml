upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryOrderBy
  method: test_employee_distinct_department_order_by_salary_desc
  fixtures:
  - queries/graphql_query/order_by/employee_distinct_department_order_by_salary_desc.yaml
steps:
- description: Fetch highest salaried employee from each department
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        employee(
          distinct_on: [department]
          order_by: [{department: asc}, {salary: desc}]
        ){
          id
          name
          department
          salary
        }
      }
  response:
    data:
      employee:
      - id: 5
        name: Kamila
        department: Engineering
        salary: 4325
      - id: 4
        name: Damien
        department: Product
        salary: 3124
      - id: 7
        name: Rickard
        department: Services
        salary: 2223
