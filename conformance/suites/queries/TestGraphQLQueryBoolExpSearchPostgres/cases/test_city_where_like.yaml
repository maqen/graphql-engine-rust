upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpSearchPostgres
  method: test_city_where_like
  fixtures:
  - queries/graphql_query/boolexp/search/select_city_where_like.yaml
steps:
- description: Select cities ending with ham
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        city (
        where: {name: {_like: "%ham" }}
        ) {
          name
          country
        }
      }
  response:
    data:
      city:
      - name: Durham
        country: USA
      - name: Framlingham
        country: UK
