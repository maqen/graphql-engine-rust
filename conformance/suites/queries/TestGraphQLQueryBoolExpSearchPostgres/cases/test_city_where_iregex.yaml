upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpSearchPostgres
  method: test_city_where_iregex
  fixtures:
  - queries/graphql_query/boolexp/search/select_city_where_iregex_postgres.yaml
steps:
- description: Select cities starting with fram
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        city (
        where: {name: {_iregex: "fram.*" }}
        ) {
          name
          country
        }
      }
  response:
    data:
      city:
      - name: Framlingham
        country: UK
