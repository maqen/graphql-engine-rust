upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBoolExpSearchPostgres
  method: test_project_where_ilike
  fixtures:
  - queries/graphql_query/boolexp/search/select_project_where_ilike_postgres.yaml
steps:
- description: Select projects with a given ID of type `character`
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        project (
        where: {id: { _ilike: "b%"}}
        ) {
          id
        }
      }
  response:
    data:
      project:
      - id: bcd
      - id: BCD
