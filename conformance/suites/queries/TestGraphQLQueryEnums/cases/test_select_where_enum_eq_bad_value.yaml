upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryEnums
  method: test_select_where_enum_eq_bad_value
  fixtures:
  - queries/graphql_query/enums/select_where_enum_eq_bad_value.yaml
steps:
- description: Test validation of enum input values
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        users(where: { favorite_color: { _eq: not_a_real_color }}) { name }
      }
  response:
    errors:
    - message: expected one of the values ['blue', 'green', 'orange', 'purple', 'red', 'yellow'] for type
        'colors_enum', but found 'not_a_real_color'
      extensions:
        path: $.selectionSet.users.args.where.favorite_color._eq
        code: validation-failed
