upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryEnums
  method: test_introspect
  fixtures:
  - queries/graphql_query/enums/introspect.yaml
steps:
- description: Test introspecting enum types
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        colors: __type(name: "colors_enum") {
          name
          kind
          enumValues {
            name
            description
          }
        }
        users: __type(name: "users") {
          fields {
            name
            type {
              ofType {
                name
              }
            }
          }
        }
      }
  response:
    data:
      colors:
        name: colors_enum
        kind: ENUM
        enumValues:
        - name: blue
          description: '#0000FF'
        - name: green
          description: '#00FF00'
        - name: orange
          description: '#FFFF00'
        - name: purple
          description: '#FF00FF'
        - name: red
          description: '#FF0000'
        - name: yellow
          description: '#00FFFF'
      users:
        fields:
        - name: favorite_color
          type:
            ofType:
              name: colors_enum
        - name: id
          type:
            ofType:
              name: Int
        - name: name
          type:
            ofType:
              name: String
