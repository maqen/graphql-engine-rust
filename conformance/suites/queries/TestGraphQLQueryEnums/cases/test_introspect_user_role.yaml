upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryEnums
  method: test_introspect_user_role
  fixtures:
  - queries/graphql_query/enums/introspect_user_role.yaml
steps:
- description: Test introspecting enum types as user role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
  query:
    query: |
      {
        query_root_fields: __type(name: "query_root") {
          fields {
            name
          }
        }
        zones: __type(name: "zones") {
          fields {
            name
            type {
              ofType {
                name
              }
            }
          }
        }
      }
  response:
    data:
      query_root_fields:
        fields:
        - name: zones
      zones:
        fields:
        - name: code
          type:
            ofType:
              name: String
        - name: id
          type:
            ofType:
              name: Int
