upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryEnums
  method: test_select_where_enum_eq
  fixtures:
  - queries/graphql_query/enums/select_where_enum_eq.yaml
steps:
- description: Test querying a table that references an enum table and filtering on enum equality
  url: /v1/graphql
  status: 200
  query:
    query: |
      {
        like_red:   users(where: { favorite_color: { _eq: red   }}) { name }
        like_blue:  users(where: { favorite_color: { _eq: blue  }}) { name }
        like_green: users(where: { favorite_color: { _eq: green }}) { name }
      }
  response:
    data:
      like_red:
      - name: Alyssa
      like_blue:
      - name: Ben
      like_green: []
