upstream:
  file: test_graphql_queries.py
  class: TestGraphQLQueryBasicPostgres
  method: test_select_query_batching_with_one_error
  fixtures:
  - queries/graphql_query/basic/select_query_batching_with_one_error.yaml
steps:
- description: GraphQL query to test error reporting when batching requests
  url: /v1/graphql
  status: 200
  query:
  - query: |
      query {
        does_not_exist {
          id
        }
      }
  - query: |
      query {
        author {
          id
        }
      }
  response:
  - errors:
    - message: 'field ''does_not_exist'' not found in type: ''query_root'''
      extensions:
        path: $.selectionSet.does_not_exist
        code: validation-failed
  - data:
      author:
      - id: 1
      - id: 2
