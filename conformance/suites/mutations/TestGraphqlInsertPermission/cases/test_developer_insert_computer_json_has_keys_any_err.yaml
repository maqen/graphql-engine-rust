upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_developer_insert_computer_json_has_keys_any_err
  fixtures:
  - queries/graphql_mutation/insert/permissions/developer_insert_has_keys_any_fail.yaml
steps:
- description: Inserts computer specs with atleast one of the required keys
  url: /v1alpha1/graphql
  status: 400
  headers:
    X-Hasura-Role: developer
    X-Hasura-Spec-Keys: '{display,memory,warranty}'
  query:
    variables:
      spec:
        processor: AMD
    query: |
      mutation insert_computer($spec: jsonb) {
        insert_computer (
          objects: [
            {
              name: "Computer1",
              spec: $spec
            },
            ],
        ) {
          affected_rows
          returning {
            name
            spec
            }
          }
      }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $.selectionSet.insert_computer.args.objects
        code: permission-error
