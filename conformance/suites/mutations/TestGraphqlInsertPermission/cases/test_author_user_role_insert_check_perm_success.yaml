upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_author_user_role_insert_check_perm_success
  fixtures:
  - queries/graphql_mutation/insert/permissions/author_user_role_insert_check_perm_success.yaml
steps:
- description: Upserts author with id 1 as a user
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation insert_author {
        insert_author (
          objects: [
            {
              id: 1
              name: "Author 1"
              is_registered: false
            }
            ],
          on_conflict: {
            constraint: author_pkey,
            update_columns: []
          }
        ) {
          affected_rows
          returning {
              id
              name
              is_registered
              get_articles(args: {search: "Article"}){
                id
                title
                content
              }
            }
          }
        }
  response:
    data:
      insert_author:
        affected_rows: 0
        returning: []
