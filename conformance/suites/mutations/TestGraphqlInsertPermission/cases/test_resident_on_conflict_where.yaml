upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_resident_on_conflict_where
  fixtures:
  - queries/graphql_mutation/insert/permissions/resident_on_conflict_where.yaml
steps:
- description: Upsert into resident table only if age is greater
  url: /v1/graphql
  status: 200
  query:
    variables:
      age: 23
    query: |
      mutation ($age:Int){
        insert_resident(
          objects: [
            {
              id: 6
              age: $age
              name: "Resident 6"
            }
          ]
          on_conflict:{
            constraint: resident_pkey
            update_columns: [age]
            where: {age: {_lt: $age}}
          }
        ){
          affected_rows
          returning{
            id
            age
          }
        }
      }
  response:
    data:
      insert_resident:
        affected_rows: 1
        returning:
        - id: 6
          age: 23
