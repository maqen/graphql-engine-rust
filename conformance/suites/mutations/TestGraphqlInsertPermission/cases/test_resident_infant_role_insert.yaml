upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_resident_infant_role_insert
  fixtures:
  - queries/graphql_mutation/insert/permissions/resident_infant.yaml
steps:
- description: Insert into resident table only with insertable columns
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: infant
    X-Hasura-Infant-Id: '1'
    X-Hasura-Infant-Name: Bittu
  query:
    query: |
      mutation {
        insert_resident(
          objects: [
            {
              age: 3
            }
          ]
        ){
          affected_rows
          returning{
            id
            name
            age
            is_user
          }
        }
      }
  response:
    data:
      insert_resident:
        affected_rows: 1
        returning:
        - id: 1
          name: Bittu
          age: 3
          is_user: false
