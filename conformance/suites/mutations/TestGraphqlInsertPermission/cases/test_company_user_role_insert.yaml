upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_company_user_role_insert
  fixtures:
  - queries/graphql_mutation/insert/permissions/company_user_role.yaml
steps:
- description: Insert Company data as user role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Company-Id: '1'
    X-Hasura-Role: user
  query:
    query: |
      mutation insert_company {
        insert_Company (
          objects: [
            {
              name: "34 Cross",
              id: 1
            }
            ],
        ) {
          affected_rows
          returning{
            id
            name
          }
          }
        }
  response:
    data:
      insert_Company:
        affected_rows: 1
        returning:
        - id: 1
          name: 34 Cross
