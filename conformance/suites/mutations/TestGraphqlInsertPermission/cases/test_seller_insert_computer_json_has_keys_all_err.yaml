upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_seller_insert_computer_json_has_keys_all_err
  fixtures:
  - queries/graphql_mutation/insert/permissions/seller_insert_computer_has_keys_all_fail.yaml
steps:
- description: Inserts computer specs without all the required keys (error)
  url: /v1alpha1/graphql
  status: 400
  headers:
    X-Hasura-Role: seller
    X-Hasura-Spec-Required-Keys: '{processor,display,memory,warranty}'
  query:
    variables:
      spec:
        processor: AMD
        display: 16" FHD
        memory: 16 GB DDR4
    query: |
      mutation insert_computer($spec: jsonb) {
        insert_computer (
          objects: [
            {
              name: "Computer1",
              spec: $spec
            },
            ],
        ) {
          affected_rows
          returning {
            name
            spec
            }
          }
      }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $.selectionSet.insert_computer.args.objects
        code: permission-error
