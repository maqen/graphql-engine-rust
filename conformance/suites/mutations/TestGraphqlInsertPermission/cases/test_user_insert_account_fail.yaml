upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_user_insert_account_fail
  fixtures:
  - queries/graphql_mutation/insert/permissions/user_insert_account_fail.yaml
steps:
- description: Insert data into account table as a user who is a non-admin
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation{
        insert_account(
          objects: {account_no: 1}
        ){
          affected_rows
        }
      }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $.selectionSet.insert_account.args.objects
        code: permission-error
