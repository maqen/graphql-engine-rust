upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_check_set_headers_while_doing_upsert
  fixtures:
  - queries/graphql_mutation/insert/permissions/leads_upsert_check_with_headers.yaml
steps:
- description: Trying to upsert with required headers set should succeed
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: sales
    X-Hasura-User-Id: sales 1
  query:
    query: |
      mutation {
        insert_leads(objects:
          [{id: 1, name: "lead 2", added_by: "sales 1"}]
          , on_conflict: {constraint: leads_pkey, update_columns: [name]}
          ) {
           affected_rows
        }
      }
  response:
    data:
      insert_leads:
        affected_rows: 1
- description: Trying to upsert without the required headers set should fail
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: sales
  query:
    query: |
      mutation {
        insert_leads(
          objects: [{
            id: 1
            name: "lead 2"
            added_by: "sales 1"
          }]
          on_conflict: {
            constraint: leads_pkey
            update_columns: [name]
          }
        ) {
          affected_rows
        }
      }
  response:
    errors:
    - message: 'missing session variable: "x-hasura-user-id"'
      extensions:
        path: $
        code: not-found
