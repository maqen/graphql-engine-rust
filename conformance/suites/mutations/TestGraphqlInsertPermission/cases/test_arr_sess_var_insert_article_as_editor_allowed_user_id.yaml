upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_arr_sess_var_insert_article_as_editor_allowed_user_id
  fixtures:
  - queries/graphql_mutation/insert/permissions/insert_article_arr_sess_var_editor_allowed_user_id.yaml
steps:
- description: Editor insert article for an allowed user-id
  url: /v1alpha1/graphql
  status: 200
  headers:
    X-Hasura-Role: editor
    X-Hasura-Allowed-User-Ids: '{2,3}'
  query:
    query: |
      mutation insert_article {
        insert_article (
          objects: [
            {
              title: "Article 4",
              content: "Sample article content 4",
              author_id: 2
            },
          ]
        ) {
          returning {
            title
            content
          }
        }
      }
  response:
    data:
      insert_article:
        returning:
        - title: Article 4
          content: Sample article content 4
