upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_user_role_insert_check_user_id_fail
  fixtures:
  - queries/graphql_mutation/insert/permissions/author_user_role_insert_check_user_id_fail.yaml
steps:
- description: Upserts author with id 1 as a user (Error)
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '5'
  query:
    query: |
      mutation insert_author {
        insert_author (
          objects: [
            {
              id: 10
              name: "Author 5"
              is_registered: false
            }
            ],
          on_conflict: {
            constraint: author_pkey,
            action: ignore
          }
        ) {
          affected_rows
          returning {
              id
              name
              is_registered
            }
          }
        }
  response:
    errors:
    - message: 'field ''action'' not found in type: ''author_on_conflict'''
      extensions:
        path: $.selectionSet.insert_author.args.on_conflict.action
        code: validation-failed
