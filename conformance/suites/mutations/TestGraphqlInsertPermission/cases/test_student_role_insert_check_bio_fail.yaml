upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_student_role_insert_check_bio_fail
  fixtures:
  - queries/graphql_mutation/insert/permissions/author_student_role_insert_check_bio_fail.yaml
steps:
- description: Inserts author without bio as a student (Error)
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: student
  query:
    query: |
      mutation insert_author {
        insert_author (
          objects: [
            {
              id: 5
              name: "Student 1"
              is_registered: false
            }
            ]
        ) {
          affected_rows
          }
        }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $.selectionSet.insert_author.args.objects
        code: permission-error
