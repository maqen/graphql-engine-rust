upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_restricted_role_on_conflict_update
  fixtures:
  - queries/graphql_mutation/insert/permissions/article_on_conflict_restricted_role.yaml
steps:
- description: Upserts article data via GraphQL mutation as Restricted role (no column in update permissions)
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: restricted
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation insert_article {
        insert_article (
          objects: [
            {
              id: 1
              content: "Updated Article 1 content"
              author_id: 1
            }
            ],
          on_conflict: {
            constraint: article_pkey
            update_columns: []
          }
        ) {
          affected_rows
          returning {
            title
            content
            author_id
            }
          }
        }
  response:
    data:
      insert_article:
        affected_rows: 0
        returning: []
- description: Upserts article data via GraphQL mutation as Restricted role (error when using placeholder)
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: restricted
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation insert_article {
        insert_article (
          objects: [
            {
              id: 1
              content: "Updated Article 1 content"
              author_id: 1
            }
            ],
          on_conflict: {
            constraint: article_pkey
            update_columns: [_PLACEHOLDER]
          }
        ) {
          affected_rows
          returning {
            title
            content
            author_id
            }
          }
        }
  response:
    errors:
    - message: erroneous column name
      extensions:
        path: $.selectionSet.insert_article.args.on_conflict
        code: validation-failed
