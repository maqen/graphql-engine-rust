upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_arr_sess_var_insert_article_as_editor_err_not_allowed_user_id
  fixtures:
  - queries/graphql_mutation/insert/permissions/insert_article_arr_sess_var_editors_err_not_allowed_user_id.yaml
steps:
- description: Editor inserts article data for a not allowed user-id
  url: /v1alpha1/graphql
  status: 400
  headers:
    X-Hasura-Role: editor
    X-Hasura-Allowed-User-Ids: '{1,3,4}'
  query:
    query: |
      mutation insert_article {
        insert_article (
          objects: [
            {
              title: "Article 4",
              content: "Sample article content 4",
              author_id: 2
            },
          ]
        ) {
          returning {
            title
            content
          }
        }
      }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $.selectionSet.insert_article.args.objects
        code: permission-error
