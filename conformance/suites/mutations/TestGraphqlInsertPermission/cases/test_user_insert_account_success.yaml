upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_user_insert_account_success
  fixtures:
  - queries/graphql_mutation/insert/permissions/user_insert_account_success.yaml
steps:
- description: Insert data into account table as a user who is admin
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '2'
  query:
    query: |
      mutation{
        insert_account(
          objects: {account_no: 1}
        ){
          affected_rows
        }
      }
  response:
    data:
      insert_account:
        affected_rows: 1
