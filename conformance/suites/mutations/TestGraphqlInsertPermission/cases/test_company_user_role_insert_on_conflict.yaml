upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertPermission
  method: test_company_user_role_insert_on_conflict
  fixtures:
  - queries/graphql_mutation/insert/permissions/company_user_role_on_conflict.yaml
steps:
- description: Upsert Company name as user role
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Company-Id: '1'
    X-Hasura-Role: user
  query:
    query: |
      mutation insert_company {
        insert_Company (
          objects: [
            {
              name: "Hasura",
              id: 1
            }
            ],
          on_conflict: {
            constraint: Company_pkey,
            update_columns: [name]
            }
        ) {
          affected_rows
          returning{
            id
            name
          }
          }
        }
  response:
    data:
      insert_Company:
        affected_rows: 1
        returning:
        - id: 1
          name: Hasura
