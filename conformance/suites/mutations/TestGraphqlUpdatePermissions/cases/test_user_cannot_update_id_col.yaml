upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdatePermissions
  method: test_user_cannot_update_id_col
  fixtures:
  - queries/graphql_mutation/update/permissions/user_cannot_update_id_col_article.yaml
steps:
- description: Users cannot update id of his article
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation update_article {
        update_article(
          where: {id: {_eq: 1}},
          _set: {
             id: 2
          }
        ) {
          affected_rows
          returning{
            id
            title
            content
          }
        }
      }
  response:
    errors:
    - message: 'field ''id'' not found in type: ''article_set_input'''
      extensions:
        path: $.selectionSet.update_article.args._set.id
        code: validation-failed
