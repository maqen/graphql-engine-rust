upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdatePermissions
  method: test_user_can_update_unpublished_article
  fixtures:
  - queries/graphql_mutation/update/permissions/user_can_update_unpublished_article.yaml
steps:
- description: Update mutation on author
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation update_article {
        update_article(
          where: {id: {_eq: 2}},
          _set: {
             content: "Article content version 1.0.2"
             version: "1.0.2"
          }
        ) {
          affected_rows
          returning{
            id
            version
            title
            content
            author {
              id
              name
            }
            is_published
          }
        }
      }
  response:
    data:
      update_article:
        affected_rows: 1
        returning:
        - id: 2
          version: 1.0.2
          title: Article 1
          content: Article content version 1.0.2
          author:
            id: 1
            name: Author 1
          is_published: false
