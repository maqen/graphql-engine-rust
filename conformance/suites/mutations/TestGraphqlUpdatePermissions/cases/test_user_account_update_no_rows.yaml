upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdatePermissions
  method: test_user_account_update_no_rows
  fixtures:
  - queries/graphql_mutation/update/permissions/user_account_update_no_rows.yaml
steps:
- description: Update data in account table as a user who is non admin
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation{
        update_account(
          _set: {account_no: 3}
          where: {account_no: {_eq: 1}}
        ){
          affected_rows
          returning{
            id
            account_no
          }
        }
      }
  response:
    data:
      update_account:
        affected_rows: 0
        returning: []
