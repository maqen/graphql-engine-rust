upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdatePermissions
  method: test_user_cannot_publish
  fixtures:
  - queries/graphql_mutation/update/permissions/user_cannot_publish.yaml
steps:
- description: Try to change the published flag on an unpublished article
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '1'
  query:
    query: |
      mutation update_article {
        update_article(
          where: {id: {_eq: 2}},
          _set: {
             is_published: true
          }
        ) {
          affected_rows
          returning{
            id
          }
        }
      }
  response:
    errors:
    - message: check constraint of an insert/update permission has failed
      extensions:
        path: $
        code: permission-error
