upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlMutationCustomSchema
  method: test_insert_author
  fixtures:
  - queries/graphql_mutation/custom_schema/insert_author.yaml
steps:
- description: Insert into author table with on conflict update
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        AddAuthors(
          objects: [{AuthorId: 1, name: "Author 1 updated"}]
          on_conflict: {
            constraint: author_pkey
            update_columns: [AuthorId, name]
          }
        ){
          affected_rows
          returning{
            AuthorId
            name
          }
        }
      }
  response:
    data:
      AddAuthors:
        affected_rows: 1
        returning:
        - AuthorId: 1
          name: Author 1 updated
