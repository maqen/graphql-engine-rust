upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLMutateEnums
  method: test_update_enum_field
  fixtures:
  - queries/graphql_mutation/enums/update_enum_field.yaml
steps:
- description: Test updating a record that references an enum table
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        update_users(where: {id: {_eq: 1}}, _set: {favorite_color: blue}) {
          affected_rows
          returning {
            name
            favorite_color
          }
        }
      }
  response:
    data:
      update_users:
        affected_rows: 1
        returning:
        - name: Alyssa
          favorite_color: blue
