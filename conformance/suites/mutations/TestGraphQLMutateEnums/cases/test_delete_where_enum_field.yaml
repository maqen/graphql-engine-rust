upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLMutateEnums
  method: test_delete_where_enum_field
  fixtures:
  - queries/graphql_mutation/enums/delete_where_enum_field.yaml
steps:
- description: Test deleting records filtered by an enum reference
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        delete_users(where: {favorite_color: {_eq: red}}) {
          affected_rows
          returning {
            name
            favorite_color
          }
        }
      }
  response:
    data:
      delete_users:
        affected_rows: 1
        returning:
        - name: Alyssa
          favorite_color: red
