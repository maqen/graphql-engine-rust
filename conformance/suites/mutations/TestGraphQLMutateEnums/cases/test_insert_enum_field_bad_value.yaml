upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLMutateEnums
  method: test_insert_enum_field_bad_value
  fixtures:
  - queries/graphql_mutation/enums/insert_enum_field_bad_value.yaml
steps:
- description: Test inserting a record with an invalid enum value
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        insert_users(objects: [{ name: "Matthew", favorite_color: not_a_real_color }]) {
          returning {
            name
            favorite_color
          }
        }
      }
  response:
    errors:
    - message: expected one of the values ['blue', 'green', 'orange', 'purple', 'red', 'yellow'] for type
        'colors_enum', but found 'not_a_real_color'
      extensions:
        path: $.selectionSet.insert_users.args.objects[0].favorite_color
        code: validation-failed
