upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLMutateEnums
  method: test_update_where_enum_field
  fixtures:
  - queries/graphql_mutation/enums/update_where_enum_field.yaml
steps:
- description: Test updating records filtered by an enum reference
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        update_users(where: {favorite_color: {_eq: red}}, _set: {favorite_color: blue}) {
          affected_rows
          returning {
            name
            favorite_color
          }
        }
      }
  response:
    data:
      update_users:
        affected_rows: 1
        returning:
        - name: Alyssa
          favorite_color: blue
