upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_polygon
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_area.yaml
steps:
- description: Insert area as a polygon
  url: /v1/graphql
  status: 200
  query:
    variables:
      areas:
      - name: Foo
        area:
          coordinates:
          - - - 43.75049
              - 11.03207
            - - 43.80009
              - 11.03208
            - - 42.60009
              - 10.13248
            - - 43.75049
              - 11.03207
          type: Polygon
          crs:
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
    query: |
      mutation insertArea($areas: [area_insert_input!]!) {
        insert_area(objects: $areas) {
          returning{
            id
            name
            area
          }
        }
      }
  response:
    data:
      insert_area:
        returning:
        - id: 1
          name: Foo
          area:
            type: Polygon
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - - - 43.75049
                - 11.03207
              - - 43.80009
                - 11.03208
              - - 42.60009
                - 10.13248
              - - 43.75049
                - 11.03207
- description: Delete the inserted area
  url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        delete from area
  response:
    result_type: CommandOk
    result: null
