upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_line_string_road
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_road.yaml
steps:
- description: Insert a straight road as a geojson LineString
  url: /v1/graphql
  status: 200
  query:
    variables:
      roads:
      - name: Foo
        path:
          coordinates:
          - - 43.75049
            - 11.03207
          - - 43.80009
            - 11.03208
          type: LineString
          crs:
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
    query: |
      mutation insertRoad($roads: [road_insert_input!]!) {
        insert_road(objects: $roads) {
          returning{
            id
            name
            path
          }
        }
      }
  response:
    data:
      insert_road:
        returning:
        - id: 1
          name: Foo
          path:
            type: LineString
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - - 43.75049
              - 11.03207
            - - 43.80009
              - 11.03208
- description: Delete the inserted road
  url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        delete from road
  response:
    result_type: CommandOk
    result: null
