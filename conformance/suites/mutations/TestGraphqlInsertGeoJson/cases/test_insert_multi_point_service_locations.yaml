upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_multi_point_service_locations
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_service_locations.yaml
steps:
- description: Insert the path for a curved road
  url: /v1/graphql
  status: 200
  query:
    variables:
      locations:
      - locations:
          coordinates:
          - - 43.75049
            - 11.03207
          - - 43.80009
            - 11.03208
          - - 43.80009
            - 11.03308
          type: MultiPoint
          crs:
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
    query: |
      mutation insertServLoc($locations: [service_locations_insert_input!]!) {
        insert_service_locations(objects: $locations) {
          returning{
            id
            locations
          }
        }
      }
  response:
    data:
      insert_service_locations:
        returning:
        - id: 1
          locations:
            type: MultiPoint
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - - 43.75049
              - 11.03207
            - - 43.80009
              - 11.03208
            - - 43.80009
              - 11.03308
- description: Delete the inserted service locations
  url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        delete from service_locations
  response:
    result_type: CommandOk
    result: null
