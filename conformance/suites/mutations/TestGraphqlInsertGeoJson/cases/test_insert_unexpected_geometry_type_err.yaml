upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_unexpected_geometry_type_err
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_geometry_unexpected_type_err.yaml
steps:
- description: Insert landmarks
  url: /v1/graphql
  status: 200
  query:
    variables:
      landmarks:
      - name: Baz
        type: river
        location:
          coordinates:
          - 43.75049
          - 11.03207
          type: Random
          crs:
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
    query: |
      mutation insertLandmark($landmarks: [landmark_insert_input!]!) {
        insert_landmark(objects: $landmarks) {
          returning{
            id
            name
            location
            type
          }
        }
      }
  response:
    errors:
    - message: 'unexpected geometry type: Random'
      extensions:
        path: $.selectionSet.insert_landmark.args.objects[0].location
        code: parse-failed
