upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_linear_ring_less_than_4_points_err
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_area_less_than_4_points_err.yaml
steps:
- description: Insert an area with only 3 points; error
  url: /v1/graphql
  status: 200
  query:
    variables:
      areas:
      - name: Foo
        area:
          coordinates:
          - - - 43.75049
              - 11.03207
            - - 43.80009
              - 11.03208
            - - 42.60009
              - 10.13248
          type: Polygon
          crs:
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
    query: |
      mutation insertArea($areas: [area_insert_input!]!) {
        insert_area(objects: $areas) {
          returning{
            id
            name
            area
          }
        }
      }
  response:
    errors:
    - message: A LinearRing needs at least 4 Positions
      extensions:
        path: $.selectionSet.insert_area.args.objects[0].area
        code: parse-failed
