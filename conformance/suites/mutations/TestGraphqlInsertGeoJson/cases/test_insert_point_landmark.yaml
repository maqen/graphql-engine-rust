upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertGeoJson
  method: test_insert_point_landmark
  fixtures:
  - queries/graphql_mutation/insert/geojson/insert_landmark.yaml
steps:
- description: Insert landmarks
  url: /v1/graphql
  status: 200
  query:
    variables:
      landmarks:
      - name: Baz
        type: river
        location:
          coordinates:
          - 43.75049
          - 11.03207
          type: Point
          crs: &id001
            type: name
            properties:
              name: urn:ogc:def:crs:EPSG::4326
      - name: Foo Bar
        type: park
        location:
          coordinates:
          - 43.76417
          - 11.25869
          type: Point
          crs: *id001
    query: |
      mutation insertLandmark($landmarks: [landmark_insert_input!]!) {
        insert_landmark(objects: $landmarks) {
          returning{
            id
            name
            location
            type
          }
        }
      }
  response:
    data:
      insert_landmark:
        returning:
        - id: 1
          name: Baz
          location:
            type: Point
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - 43.75049
            - 11.03207
          type: river
        - id: 2
          name: Foo Bar
          location:
            type: Point
            crs:
              type: name
              properties:
                name: urn:ogc:def:crs:EPSG::4326
            coordinates:
            - 43.76417
            - 11.25869
          type: park
- description: Delete the inserted landmarks
  url: /v1/query
  status: 200
  query:
    type: run_sql
    args:
      sql: |
        delete from landmark
  response:
    result_type: CommandOk
    result: null
