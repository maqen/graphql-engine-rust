upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlDeletePermissions
  method: test_user_delete_account_success
  fixtures:
  - queries/graphql_mutation/delete/permissions/user_delete_account_success.yaml
steps:
- description: Delete data from account table as a user who is admin
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '2'
  query:
    query: |
      mutation{
        delete_account(
          where: {account_no: {_eq: 1}}
        ){
          affected_rows
        }
      }
  response:
    data:
      delete_account:
        affected_rows: 1
