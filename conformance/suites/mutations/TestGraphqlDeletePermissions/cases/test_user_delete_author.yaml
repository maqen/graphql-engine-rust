upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlDeletePermissions
  method: test_user_delete_author
  fixtures:
  - queries/graphql_mutation/delete/permissions/user_delete_author.yaml
steps:
- description: Delete an author
  url: /v1/graphql
  status: 200
  headers:
    X-Hasura-Role: user
    X-Hasura-User-Id: '4'
  query:
    query: |
      mutation {
        delete_author(
          where: {id: {_eq: 4}}
        ){
          affected_rows
          returning{
            id
            name
            articles {
              id
              title
              content
            }
          }
        }
      }
  response:
    data:
      delete_author:
        affected_rows: 1
        returning:
        - id: 4
          name: Author 4
          articles: []
