upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlInsertOnConflict
  method: test_order_on_conflict_where
  fixtures:
  - queries/graphql_mutation/insert/onconflict/order_on_conflict_where.yaml
steps:
- description: Upsert into orders only if new value is greater than old value
  url: /v1/graphql
  status: 200
  query:
    variables:
      placed: '2017-08-18 14:22:11.802755+02'
    query: |
      mutation ($placed: timestamptz) {
        insert_orders(
          objects: [{id: 1, placed: $placed}]
          on_conflict: {
            constraint:orders_pkey
            update_columns: [placed]
            where: {placed: {_lt: $placed}}
          }
        ){
          affected_rows
        }
      }
  response:
    data:
      insert_orders:
        affected_rows: 0
- description: Upsert into orders only if new value is greater than old value
  url: /v1/graphql
  status: 200
  query:
    variables:
      placed: '2017-08-20 14:22:11.802755+02'
    query: |
      mutation ($placed: timestamptz) {
        insert_orders(
          objects: [{id: 1, placed: $placed}]
          on_conflict: {
            constraint:orders_pkey
            update_columns: [placed]
            where: {placed: {_lt: $placed}}
          }
        ){
          affected_rows
        }
      }
  response:
    data:
      insert_orders:
        affected_rows: 1
