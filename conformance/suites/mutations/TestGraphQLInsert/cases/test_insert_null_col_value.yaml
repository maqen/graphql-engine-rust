upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLInsert
  method: test_insert_null_col_value
  fixtures:
  - queries/graphql_mutation/insert/basic/order_col_shipped_null.yaml
steps:
- description: Insert into order table with a null value
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation insert_orders{
        insert_orders(
          objects: [
            {
              placed: "2017-08-19 14:22:11.802755+02",
              shipped: null
            }
          ]
        ) {
          returning {
            id
          }
          affected_rows
        }
      }
  response:
    data:
      insert_orders:
        returning:
        - id: 1
        affected_rows: 1
