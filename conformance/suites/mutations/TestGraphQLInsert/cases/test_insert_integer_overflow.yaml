upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLInsert
  method: test_insert_integer_overflow
  fixtures:
  - queries/graphql_mutation/insert/basic/insert_integer_overflow.yaml
steps:
- description: Inserting a bigint into an int should cause an error, see
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        insert_test_types(
          objects: [
            {
            c2_integer : 2147483648
            }
          ]
        ) {
          returning {
            c2_integer
          }
        }
      }
  response:
    errors:
    - message: The value 2.147483648e9 lies outside the bounds or is not an integer. Maybe it is a float,
        or is there integer overflow?
      extensions:
        path: $.selectionSet.insert_test_types.args.objects[0].c2_integer
        code: parse-failed
