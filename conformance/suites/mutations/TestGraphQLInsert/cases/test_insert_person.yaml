upstream:
  file: test_graphql_mutations.py
  class: TestGraphQLInsert
  method: test_insert_person
  fixtures:
  - queries/graphql_mutation/insert/basic/person_jsonb.yaml
steps:
- description: Inserts person data via GraphQL mutation (without Variable)
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation insert_person{
        insert_person(
          objects: [
            {
              details: {name: {first: json last: murphy}}
            }
          ]
        ) {
          returning {
            details
          }
        }
      }
  response:
    data:
      insert_person:
        returning:
        - details:
            name:
              last: murphy
              first: json
