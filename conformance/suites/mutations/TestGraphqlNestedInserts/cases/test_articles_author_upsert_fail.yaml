upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlNestedInserts
  method: test_articles_author_upsert_fail
  fixtures:
  - queries/graphql_mutation/insert/nested/articles_author_upsert_fail.yaml
steps:
- description: Insert article while upserting (do nothing) it's author (Error)
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation article_author{
        insert_article(
          objects: [
            {
              title: "Article 1 by Author 1",
              content: "Article content for Article 1 by Author 1",
              is_published: true
              author: {
                data: {
                  id: 1
                  name: "Author 1"
                }
                on_conflict: {
                  constraint: author_pkey,
                  update_columns: []
                }
              }
            }
          ]
        ){
          affected_rows
          returning{
            id
            title
            content
            author{
              id
              name
            }
          }
        }
      }
  response:
    errors:
    - message: 'field ''id'' not found in type: ''author_insert_input'''
      extensions:
        path: $.selectionSet.insert_article.args.objects[0].author.data.id
        code: validation-failed
