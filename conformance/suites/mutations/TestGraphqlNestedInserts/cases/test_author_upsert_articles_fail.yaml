upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlNestedInserts
  method: test_author_upsert_articles_fail
  fixtures:
  - queries/graphql_mutation/insert/nested/author_upsert_articles_fail.yaml
steps:
- description: Upsert author (do nothing) and it's articles (Error)
  url: /v1/graphql
  status: 200
  query:
    query: "mutation nested_author_insert {\n   insert_author(\n     objects: [\n       {\n         id:\
      \ 1,\n         name: \"Author 1\", \n         articles: {\n           data: [\n             {\n\
      \               title: \"Article 1 by Author 1\", \n               content: \"Content for Article\
      \ 1 by Author 1\", \n               is_published: false\n             },\n             {\n     \
      \          title: \"Article 2 by Author 1\", \n               content: \"Content for Article 2 by\
      \ Author 1\", \n               is_published: false\n             }\n           ]\n         }\n \
      \      }\n     ],\n     on_conflict: {\n       constraint: author_pkey,\n       update_columns:\
      \ []\n     }\n   ) {\n     affected_rows\n     returning {\n       id\n       name\n       articles\
      \ {\n         id\n         title\n         content\n         is_published\n       }\n     }\n  \
      \ }\n}\n"
  response:
    errors:
    - message: 'field ''id'' not found in type: ''author_insert_input'''
      extensions:
        path: $.selectionSet.insert_author.args.objects[0].id
        code: validation-failed
