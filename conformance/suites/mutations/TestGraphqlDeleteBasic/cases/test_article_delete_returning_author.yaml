upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlDeleteBasic
  method: test_article_delete_returning_author
  fixtures:
  - queries/graphql_mutation/delete/basic/article_returning_author.yaml
steps:
- description: Delete mutation on article with returning columns and author
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation DeleteAuthor2Articles {
        delete_article(
          where: {
            author: {id: {_eq: 2}}
          }
        ) {
          affected_rows
          returning {
            id
            title
            content
            author {
              id
              name
            }
          }
        }
      }
  response:
    data:
      delete_article:
        affected_rows: 2
        returning:
        - id: 4
          title: Article 4
          content: Sample article content 4
          author:
            id: 2
            name: Author 2
        - id: 5
          title: Article 5
          content: Sample article content 5
          author:
            id: 2
            name: Author 2
