upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlMutationCustomGraphQLTableName
  method: test_insert_article_author
  fixtures:
  - queries/graphql_mutation/custom_schema/custom_table_name/insert_article_author.yaml
steps:
- description: Insert into article table with a new author
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        insert_article(
          objects: [
            {
              title: "Article 4 by new author",
              content: "Content for Article 4"
              author: {
                data: {
                  id: 3
                  name: "Author 3"
                }
              }
            }
          ]
        ){
          affected_rows
          returning{
            title
            content
            author{
              id
              name
            }
          }
        }
      }
  response:
    data:
      insert_article:
        affected_rows: 2
        returning:
        - title: Article 4 by new author
          content: Content for Article 4
          author:
            id: 3
            name: Author 3
