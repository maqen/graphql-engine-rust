upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdateJsonB
  method: test_jsonb_delete_at_path
  fixtures:
  - queries/graphql_mutation/update/jsonb/person_delete_at_path.yaml
steps:
- description: Updated person data using _delete_at_path operator
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation update_person($value: jsonb) {
        update_person(
          where: {id: {_eq: 1}},
          _delete_at_path: {
            details: ["name", "last"]
          }
        ){
          affected_rows
          returning{
            id
            details
          }
        }
      }
  response:
    data:
      update_person:
        affected_rows: 1
        returning:
        - id: 1
          details:
            name:
              first: John
