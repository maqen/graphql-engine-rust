upstream:
  file: test_graphql_mutations.py
  class: TestGraphqlUpdateJsonB
  method: test_jsonb_delete_key
  fixtures:
  - queries/graphql_mutation/update/jsonb/person_delete_key.yaml
steps:
- description: Updated person data using _delete_key operator
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation update_person($value: jsonb) {
        update_person(
          where: {id: {_eq: 3}},
          _delete_key: {
            details: "address"
          }
        ){
          affected_rows
          returning{
            id
            details
          }
        }
      }
  response:
    data:
      update_person:
        affected_rows: 1
        returning:
        - id: 3
          details:
            name:
              last: Wilson
              first: Robert
