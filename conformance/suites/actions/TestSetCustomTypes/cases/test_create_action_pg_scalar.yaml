upstream:
  file: test_actions.py
  class: TestSetCustomTypes
  method: test_create_action_pg_scalar
  fixtures:
  - queries/actions/custom-types/create_action_pg_scalar.yaml
steps:
- description: Create an action with PG scalars in input arguments
  url: /v1/query
  status: 200
  query:
    type: create_action
    args:
      name: some_action
      definition:
        kind: synchronous
        arguments:
        - name: user_id
          type: ID!
        - name: location
          type: geography!
        output_type: User!
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
  response:
    message: success
- description: Remove action
  url: /v1/query
  status: 200
  query:
    type: drop_action
    args:
      name: some_action
  response:
    message: success
