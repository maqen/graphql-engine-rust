upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_expecting_object_response_got_array
  fixtures:
  - queries/actions/sync/expecting_object_response.yaml
steps:
- description: Update actions webhook to another route which retuns array response
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_user
      definition:
        kind: synchronous
        arguments:
        - name: users
          type: '[UserInput!]!'
        output_type: UserId
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-users'
  response:
    message: success
- description: Run create_users sync action
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        create_user(users: [{email: "blake@hasura.io", name: "Blake"}, {email: "elsa@hasura.io", name: "Elsa"}]){
          id
          user {
            name
            email
            is_admin
          }
        }
      }
  response:
    errors:
    - message: got array for the action webhook response, expecting UserId
      extensions:
        path: $
        code: unexpected
        internal:
          error: unexpected response
          request:
            action:
              name: create_user
            input:
              users:
              - email: blake@hasura.io
                name: Blake
              - email: elsa@hasura.io
                name: Elsa
            request_query: |
              mutation {
                create_user(users: [{email: "blake@hasura.io", name: "Blake"}, {email: "elsa@hasura.io", name: "Elsa"}]){
                  id
                  user {
                    name
                    email
                    is_admin
                  }
                }
              }
            transformed_request: null
            url: '{{ACTION_WEBHOOK_HANDLER}}/create-users'
          response:
            body:
            - id: 1
            - id: 2
            headers:
            - name: Content-Type
              value: application/json
            - name: Set-Cookie
              value: abcd
            status: 200
- description: Revert action definition
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_user
      definition:
        kind: synchronous
        arguments:
        - name: email
          type: String!
        - name: name
          type: String!
        output_type: UserId
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
  response:
    message: success
