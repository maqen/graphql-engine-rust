upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_mirror_action_unexpected_field
  fixtures:
  - queries/actions/sync/mirror_action_unexpected_field.yaml
steps:
- description: Unexpected extra field in response should be ignored
  url: /v1/graphql
  status: 200
  query:
    variables:
      id: some-id
      name: Alice
      age: 25
    query: |
      mutation ($id: ID, $name: String, $age: Int) {
        mirror(arg: {id: $id, name: $name, age: $age}){
          id
          name
        }
      }
  response:
    data:
      mirror:
        id: some-id
        name: Alice
