upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_mirror_action_success
  fixtures:
  - queries/actions/sync/mirror_action_success.yaml
steps:
- description: A successful query to mirror action
  url: /v1/graphql
  status: 200
  query:
    variables:
      id: some-id
      name: Alice
    query: |
      mutation ($id: ID, $name: String) {
        mirror(arg: {id: $id, name: $name}){
          id
          name
        }
      }
  response:
    data:
      mirror:
        id: some-id
        name: Alice
