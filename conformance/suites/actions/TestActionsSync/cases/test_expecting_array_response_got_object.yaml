upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_expecting_array_response_got_object
  fixtures:
  - queries/actions/sync/expecting_array_response.yaml
steps:
- description: Update actions webhook to another route which retuns object response
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_users
      definition:
        kind: synchronous
        arguments:
        - name: email
          type: String!
        - name: name
          type: String!
        output_type: '[UserId]'
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
  response:
    message: success
- description: Run create_users action
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        create_users(email: "clarke@gmail.com", name: "Clarke"){
          id
          user {
            name
            email
            is_admin
          }
        }
      }
  response:
    errors:
    - message: expecting array for the action webhook response
      extensions:
        path: $
        code: unexpected
        internal:
          error: unexpected response
          request:
            action:
              name: create_users
            input:
              email: clarke@gmail.com
              name: Clarke
            request_query: |
              mutation {
                create_users(email: "clarke@gmail.com", name: "Clarke"){
                  id
                  user {
                    name
                    email
                    is_admin
                  }
                }
              }
            transformed_request: null
            url: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
          response:
            body:
              id: 1
            headers:
            - name: Content-Type
              value: application/json
            - name: Set-Cookie
              value: abcd
            status: 200
- description: Revert action definition
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_users
      definition:
        kind: synchronous
        arguments:
        - name: users
          type: '[UserInput!]!'
        output_type: '[UserId]'
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-users'
  response:
    message: success
