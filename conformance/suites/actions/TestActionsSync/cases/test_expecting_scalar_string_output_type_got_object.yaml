upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_expecting_scalar_string_output_type_got_object
  fixtures:
  - queries/actions/sync/expecting_scalar_response_got_object.yaml
steps:
- description: Update actions webhook to another route which returns object response
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: scalar_response
      definition:
        kind: synchronous
        arguments:
        - name: email
          type: String!
        - name: name
          type: String!
        output_type: String!
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
  response:
    message: success
- description: Run scalar-response sync action
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        scalar_response(email: "clarke@gmail.com", name: "Clarke")
      }
  response:
    errors:
    - message: got object for the action webhook response, expecting String
      extensions:
        path: $
        code: unexpected
        internal:
          error: unexpected response
          request:
            action:
              name: scalar_response
            input:
              email: clarke@gmail.com
              name: Clarke
            request_query: |
              mutation {
                scalar_response(email: "clarke@gmail.com", name: "Clarke")
              }
            transformed_request: null
            url: '{{ACTION_WEBHOOK_HANDLER}}/create-user'
          response:
            body:
              id: 1
            headers:
            - name: Content-Type
              value: application/json
            - name: Set-Cookie
              value: abcd
            status: 200
- description: Revert action wehbook
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: scalar_response
      definition:
        kind: synchronous
        arguments: null
        output_type: String!
        handler: '{{ACTION_WEBHOOK_HANDLER}}/scalar-response'
  response:
    message: success
