upstream:
  file: test_actions.py
  class: TestActionsSync
  method: test_expecting_array_response_got_null
  fixtures:
  - queries/actions/sync/expecting_array_response_got_null.yaml
steps:
- description: Update actions webhook to another route which returns null response (also, output_type
    is non-nullable)
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_users
      definition:
        kind: synchronous
        arguments: null
        output_type: '[UserId]!'
        handler: '{{ACTION_WEBHOOK_HANDLER}}/null-response'
  response:
    message: success
- description: Run create_users sync action (with null_response handler)
  url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        create_users {
          id
        }
      }
  response:
    errors:
    - message: got null for the action webhook response
      extensions:
        path: $
        code: unexpected
        internal:
          error: unexpected response
          request:
            action:
              name: create_users
            input: {}
            request_query: |
              mutation {
                create_users {
                  id
                }
              }
            transformed_request: null
            url: '{{ACTION_WEBHOOK_HANDLER}}/null-response'
          response:
            body: null
            headers:
            - name: Content-Type
              value: application/json
            - name: Set-Cookie
              value: abcd
            status: 200
- description: Revert action definition
  url: /v1/query
  status: 200
  query:
    type: update_action
    args:
      name: create_users
      definition:
        kind: synchronous
        arguments:
        - name: users
          type: '[UserInput!]!'
        output_type: '[UserId]'
        handler: '{{ACTION_WEBHOOK_HANDLER}}/create-users'
  response:
    message: success
