  - queries/actions/sync/extensions_code_toplevel_no_extensions.yaml
steps:
- description: Run get_user_by_email query action with invalid email
  url: /v1/graphql
  status: 200
  query:
    query: |
      query {
        intentional_error(
          blob: { message: "intentionally generated error", code: "toplevel-error" }
        ) {
          id
        }
      }
  response:
    errors:
    - message: intentionally generated error
      extensions:
        path: $
        code: toplevel-error
