upstream:
  file: test_actions.py
  class: TestActionsAsync
  method: test_create_user_nested_success
  by_hand: true
steps:
- url: /v1/graphql
  status: 200
  query:
    query: |
      mutation {
        create_user_nested(email: "clarke@hasura.io", name: "Clarke")
      }
    variables: {}
  response:
    data:
      create_user_nested: '{{any}}'
  capture:
    action_id: /data/create_user_nested
- url: /v1/graphql
  status: 200
  query:
    query: |
      query ($action_id: uuid!){
        create_user_nested(id: $action_id){
          __typename
          id
          output {
            __typename
            userObj {
              __typename
              id
            }
          }
        }
      }
    variables:
      action_id: '{{var:action_id}}'
  response:
    data:
      create_user_nested:
        __typename: create_user_nested
        id: '{{var:action_id}}'
        output:
          __typename: UserIdNested
          userObj:
            __typename: UserIdObj
            id: 1
  retry_for: 10.0
