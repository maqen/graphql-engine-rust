upstream:
  file: test_openapi.py
  class: TestOpenAPISpec
  method: test_duplicate_field_name
  fixtures:
  - queries/openapi/openapi_get_endpoint_test_duplicate_field_name.yaml
steps:
- description: Try to add a POST rest endpoint with default argument
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: with_duplicate_field_name
      name: with_duplicate_field_name
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: query_with_duplicate_field_name
  response:
    message: success
- description: Call openapi json endpoint
  url: /api/swagger/json
  method: GET
  status: 200
  query: null
  response:
    info:
      description: This OpenAPI specification is automatically generated by Hasura.
      title: Rest Endpoints
      version: ''
    paths:
      /api/rest/with_duplicate_field_name:
        post:
          summary: with_duplicate_field_name
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            query { test_table { first_name } test_table { last_name } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      test_table:
                        items:
                          description: columns and relationships of "test_table"
                          nullable: false
                          properties:
                            first_name:
                              nullable: true
                              title: String
                              type: string
                            last_name:
                              nullable: true
                              title: String
                              type: string
                          title: test_table
                          type: object
                        nullable: false
                        type: array
              description: Responses for POST /api/rest/with_duplicate_field_name
    components: {}
    openapi: 3.0.0
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: with_duplicate_field_name
  response:
    message: success
