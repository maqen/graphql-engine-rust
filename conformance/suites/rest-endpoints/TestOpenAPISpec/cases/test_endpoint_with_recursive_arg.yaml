upstream:
  file: test_openapi.py
  class: TestOpenAPISpec
  method: test_endpoint_with_recursive_arg
  fixtures:
  - queries/openapi/openapi_post_endpoint_test_recursive_arg.yaml
steps:
- description: Try to add a POST rest endpoint with arguments
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: recurse_arg
      name: recurse_arg
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: mutation_recursive_arg
  response:
    message: success
- description: Call openapi json endpoint
  url: /api/swagger/json
  method: GET
  status: 200
  query: null
  response:
    info:
      description: This OpenAPI specification is automatically generated by Hasura.
      title: Rest Endpoints
      version: ''
    paths:
      /api/rest/recurse_arg:
        post:
          summary: recurse_arg
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            mutation MyMutation($object: test_table_recurse_insert_input!) { insert_test_table_recurse_one(object: $object) { id } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    object:
                      $ref: '#/components/schemas/test_table_recurse_insert_input!'
                  type: object
            description: Query parameters can also be provided in the request body as a JSON object
            required: true
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      insert_test_table_recurse_one:
                        description: columns and relationships of "test_table_recurse"
                        nullable: true
                        properties:
                          id:
                            $ref: '#/components/schemas/uuid!'
                        title: test_table_recurse
                        type: object
              description: Responses for POST /api/rest/recurse_arg
    components:
      schemas:
        uuid:
          nullable: true
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}'
          title: uuid
          type: string
        test_table_recurse_obj_rel_insert_input:
          description: input type for inserting object relation for remote table "test_table_recurse"
          nullable: true
          properties:
            data:
              $ref: '#/components/schemas/test_table_recurse_insert_input!'
          title: test_table_recurse_obj_rel_insert_input
          type: object
        test_table_recurse_insert_input!:
          description: input type for inserting data into table "test_table_recurse"
          nullable: false
          properties:
            id:
              $ref: '#/components/schemas/uuid'
            random_data:
              nullable: true
              title: String
              type: string
            recurse_rel:
              $ref: '#/components/schemas/test_table_recurse_obj_rel_insert_input'
          title: test_table_recurse_insert_input
          type: object
        uuid!:
          nullable: false
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}'
          title: uuid
          type: string
    openapi: 3.0.0
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: recurse_arg
  response:
    message: success
