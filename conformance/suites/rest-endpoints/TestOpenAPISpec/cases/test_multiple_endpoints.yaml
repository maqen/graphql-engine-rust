upstream:
  file: test_openapi.py
  class: TestOpenAPISpec
  method: test_multiple_endpoints
  fixtures:
  - queries/openapi/openapi_multiple_endpoints_test.yaml
steps:
- description: Try to add a POST rest endpoint with arguments in URL
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: with_args_url/:first_name/:last_name
      name: with_args_url
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: query_with_args
  response:
    message: success
- description: Try to add a POST rest endpoint with default argument
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: with_default_arg
      name: with_default_arg
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: query_with_default_arg
  response:
    message: success
- description: Try to add a POST rest mutation endpoint
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: mutation_with_args
      name: mutation_with_args
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: mutation_with_args
  response:
    message: success
- description: Call openapi json endpoint
  url: /api/swagger/json
  method: GET
  status: 200
  query: null
  response:
    info:
      description: This OpenAPI specification is automatically generated by Hasura.
      title: Rest Endpoints
      version: ''
    paths:
      /api/rest/with_default_arg:
        post:
          summary: with_default_arg
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            query ($first_name:String="Foo") { test_table(where: {first_name: { _eq: $first_name } }) { first_name last_name } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          - in: query
            name: first_name
            required: false
            schema:
              default: Foo
              type: string
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    first_name:
                      default: Foo
                      nullable: true
                      title: String
                      type: string
                  type: object
            description: Query parameters can also be provided in the request body as a JSON object
            required: false
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      test_table:
                        items:
                          description: columns and relationships of "test_table"
                          nullable: false
                          properties:
                            first_name:
                              nullable: true
                              title: String
                              type: string
                            last_name:
                              nullable: true
                              title: String
                              type: string
                          title: test_table
                          type: object
                        nullable: false
                        type: array
              description: Responses for POST /api/rest/with_default_arg
      /api/rest/mutation_with_args:
        post:
          summary: mutation_with_args
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            mutation ($first_name: String!, $last_name: String!) { insert_test_table( objects: {first_name: $first_name, last_name: $last_name }) { returning { id } affected_rows } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          - description: _"first_name" is required (enter it either in parameters or request body)_
            in: query
            name: first_name
            required: true
            schema:
              type: string
          - description: _"last_name" is required (enter it either in parameters or request body)_
            in: query
            name: last_name
            required: true
            schema:
              type: string
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    first_name:
                      nullable: false
                      title: String
                      type: string
                    last_name:
                      nullable: false
                      title: String
                      type: string
                  type: object
            description: Query parameters can also be provided in the request body as a JSON object
            required: false
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      insert_test_table:
                        description: response of any mutation on the table "test_table"
                        nullable: true
                        properties:
                          affected_rows:
                            nullable: false
                            title: Int
                            type: integer
                          returning:
                            items:
                              description: columns and relationships of "test_table"
                              nullable: false
                              properties:
                                id:
                                  $ref: '#/components/schemas/uuid!'
                              title: test_table
                              type: object
                            nullable: false
                            type: array
                        title: test_table_mutation_response
                        type: object
              description: Responses for POST /api/rest/mutation_with_args
      /api/rest/with_args_url/{first_name}/{last_name}:
        post:
          summary: with_args_url
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            query ($first_name: String!, $last_name:String!) { test_table(where: {first_name: { _eq: $first_name } last_name: { _eq: $last_name }}) { first_name last_name } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          - description: _"first_name" is required as part of the path_
            in: path
            name: first_name
            required: true
            schema:
              type: string
          - description: _"last_name" is required as part of the path_
            in: path
            name: last_name
            required: true
            schema:
              type: string
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    first_name:
                      nullable: false
                      title: String
                      type: string
                    last_name:
                      nullable: false
                      title: String
                      type: string
                  type: object
            description: Query parameters can also be provided in the request body as a JSON object
            required: false
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      test_table:
                        items:
                          description: columns and relationships of "test_table"
                          nullable: false
                          properties:
                            first_name:
                              nullable: true
                              title: String
                              type: string
                            last_name:
                              nullable: true
                              title: String
                              type: string
                          title: test_table
                          type: object
                        nullable: false
                        type: array
              description: Responses for POST /api/rest/with_args_url/{first_name}/{last_name}
    components:
      schemas:
        uuid!:
          nullable: false
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}'
          title: uuid
          type: string
    openapi: 3.0.0
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: with_args_url
  response:
    message: success
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: with_default_arg
  response:
    message: success
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: mutation_with_args
  response:
    message: success
