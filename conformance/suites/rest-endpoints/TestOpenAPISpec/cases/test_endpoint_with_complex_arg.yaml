upstream:
  file: test_openapi.py
  class: TestOpenAPISpec
  method: test_endpoint_with_complex_arg
  fixtures:
  - queries/openapi/openapi_get_endpoint_test_complex_arg.yaml
steps:
- description: Try to add a GET rest endpoint with no argument
  url: /v1/query
  status: 200
  query:
    type: create_rest_endpoint
    args:
      url: complex_arg
      name: complex_arg
      methods:
      - POST
      definition:
        query:
          collection_name: test_collection
          query_name: mutation_complex_arg
  response:
    message: success
- description: Call openapi json endpoint
  url: /api/swagger/json
  method: GET
  status: 200
  query: null
  response:
    info:
      description: This OpenAPI specification is automatically generated by Hasura.
      title: Rest Endpoints
      version: ''
    paths:
      /api/rest/complex_arg:
        post:
          summary: complex_arg
          description: |-
            ***
            The GraphQl query for this endpoint is:
            ``` graphql
            mutation ($objects: [test_table_insert_input!]!) { insert_test_table( objects: $objects) { returning { id } } }
            ```
          parameters:
          - description: Your x-hasura-admin-secret will be used for authentication of the API request.
            in: header
            name: x-hasura-admin-secret
            schema:
              type: string
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    objects:
                      items:
                        $ref: '#/components/schemas/test_table_insert_input!'
                      nullable: false
                      type: array
                  type: object
            description: Query parameters can also be provided in the request body as a JSON object
            required: true
          responses:
            '200':
              content:
                application/json:
                  schema:
                    properties:
                      insert_test_table:
                        description: response of any mutation on the table "test_table"
                        nullable: true
                        properties:
                          returning:
                            items:
                              description: columns and relationships of "test_table"
                              nullable: false
                              properties:
                                id:
                                  $ref: '#/components/schemas/uuid!'
                              title: test_table
                              type: object
                            nullable: false
                            type: array
                        title: test_table_mutation_response
                        type: object
              description: Responses for POST /api/rest/complex_arg
    components:
      schemas:
        uuid:
          nullable: true
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}'
          title: uuid
          type: string
        test_table_insert_input!:
          description: input type for inserting data into table "test_table"
          nullable: false
          properties:
            first_name:
              nullable: true
              title: String
              type: string
            id:
              $ref: '#/components/schemas/uuid'
            last_name:
              nullable: true
              title: String
              type: string
          title: test_table_insert_input
          type: object
        uuid!:
          nullable: false
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89aAbB][a-f0-9]{3}-[a-f0-9]{12}'
          title: uuid
          type: string
    openapi: 3.0.0
- description: Try to remove the endpoint
  url: /v1/query
  status: 200
  query:
    type: drop_rest_endpoint
    args:
      name: complex_arg
  response:
    message: success
